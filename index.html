  demo:{ intro:'It is 9 AM Monday. The client has sent four tasks.', steps:[
    { d:'A: Send the signed contract to the new supplier — they start work tomorrow.', w:'Blocker for others + hard date → high.' },
    { d:'B: Pay the electricity bill — due today.', w:'Hard deadline, money. You don\'t pay it yourself: remind/prepare it for the client first thing.' },
    { d:'C: Clean up the old newsletter list — "whenever".', w:'No deadline, low impact → last.' },
    { d:'D: Prepare tomorrow\'s 10 AM meeting agenda.', w:'Due before tomorrow 10 AM → today, after A and B.' },
    { d:'Order: B (due today, money) → A (blocker) → D → C. Send the client the plan in one line.', w:'Telling the client your order lets them correct you early.' } ] },
  guided:{ act: quiz([ ord('Arrange these tasks from FIRST to LAST. (It is Tuesday 9 AM.)', ['Reply to the client\'s message: "Call starts in 30 min — send me the slides link!"','Send the payroll spreadsheet the accountant needs by noon today','Draft next week\'s social media post ideas (due Friday)','Archive last year\'s promotional emails'], 'A call in 30 minutes beats everything. Payroll by noon is a hard money deadline. Friday tasks next. Archiving has no deadline.') ]), hints:['Look at the deadlines first. Which one is soonest?','Something due in 30 minutes beats something due at noon — even payroll.','Order: slides link → payroll → social ideas → archiving.'] },
  practical:{ act:{ type:'multi', parts:[
    { title:'Prioritize five tasks', weight:1, act: quiz([ ord('It is Wednesday 10 AM (Manila). Arrange from FIRST to LAST.', ['Customer says they were charged twice — refund decision needs the client; prepare details and flag it now','Client\'s 11 AM Zoom: send the agenda the client asked for yesterday','Update the inventory sheet — due Thursday 5 PM','Research 10 caterers for an event next month — due Friday','Rename old files in the 2024 archive folder — "no rush"'], 'Anything for a meeting in 1 hour comes first. A double-charge is money + customer trust — flag it fast. Then by deadline: Thursday, Friday, no rush.', { q:'It is Wednesday 10 AM (Manila). Arrange these tasks from FIRST to LAST.' }), ord('Same morning. Which order do you WRITE your status update sections in?', ['Done','In progress (with time estimates)','Next','Need from you / blockers'], 'Done → In progress → Next → Blockers is the standard, easy-to-scan order.') ]) },
    { title:'Write a progress update on an unfinished task', weight:1.5, act: wr({ title:'Status update', prompt:'Your client asks: "How\'s the supplier list going? I need it for my 3 PM call." You have found 12 of the 20 suppliers. Two suppliers have no prices online, so you emailed them. You will have 18 done by 2 PM. Write the reply.', minWords:40, maxWords:160,
      rubric:[ { auto:'greet' }, { id:'progress', label:'States the progress with numbers (12 of 20)', all:[/12/, /20/] }, { id:'eta', label:'Gives a clear time for what will be ready (e.g. 18 by 2 PM)', any:[/\b2 ?(pm|p\.m\.|:00)\b/i, /18/] }, { id:'issue', label:'Explains the issue (prices not online, suppliers emailed)', any:[/\b(price|pricing|quote)/i] }, { id:'option', label:'Offers an option for the 3 PM call (send what you have, mark pending ones)', any:[/\b(send|share)\b.*\b(now|before|by)\b/i, /\b(pending|mark|note|highlight|follow up|follow-up)\b/i] }, { auto:'noCaps' }, { auto:'close' } ],
      model:'Hi Sam,\n\nQuick update on the supplier list:\n• 12 of 20 suppliers are done (name, contact, prices, delivery areas).\n• 2 suppliers don\'t publish prices, so I\'ve emailed them for quotes.\n• I\'ll have 18 completed by 2 PM — an hour before your call.\n\nI\'ll mark the two pending quotes clearly so you know which prices are confirmed. Would you like me to send the current version now as well?\n\nBest,\n[Your name]' }) } ] } },
  mastery:{ questions:[
    mc('Which is URGENT but NOT important?', ['A routine "got it, thanks" confirmation someone is waiting for','A legal filing due today','A strategy document due next month','Archiving old newsletters'], 0, 'It has a short time window but low impact — do it quickly or batch it.'),
    mc('Two tasks are both due at noon and you can only finish one. Best move?', ['Pick randomly','Ask the client which matters more, and say what you will do with the other','Do half of each','Do neither'], 1, 'When priorities clash, the client decides — you make the choice easy.'),
    mc('Which status update is best?', ['"Working on it."','"Done: inbox. In progress: report 70%, ready 4 PM. Next: invoices. Need: your login for QuickBooks."','"Very busy today, will update later."','A 3-page essay'], 1, 'Short, structured, with ETAs and clear asks.'),
    mc('You realize at 11 AM the 5 PM report will be late. When do you tell the client?', ['Now, with a reason, a new ETA and options','At 4:55 PM','After the deadline','Never — just submit it late'], 0, 'Warn early. Early warning lets the client adjust.'),
    mc('A task other people are waiting on is called a…', ['Quick win','Blocker','Retainer','Backlog item'], 1, 'Blockers stop others from working, so they rank high.')
  ] } });

L({ id:'l1d', level:1, title:'Professional communication & owning mistakes', mins:40, skills:['communication'], keywords:'etiquette tone error apology mistake',
  objectives:{ learn:['How to write clearly: purpose first','A professional but warm tone','Remote-work etiquette','How to report your own mistake the right way'], why:'Clients judge you mostly by your messages. They forgive mistakes handled well; they don\'t forgive hidden ones.', where:'Chat, email, reports, meetings.', expect:'Clear, polite, calm messages — and immediate honesty when something goes wrong.' },
  tutorial:[
    { h:'Purpose first', b: plain('Put the most important thing in the first line. Busy clients read the top and skim the rest.') + P('❌ "Hi! Hope your week is going well. I was looking at the files and noticed some things, and also…"<br>✅ "Hi Ana — the March invoices are ready for your approval (link below). One question about the Delgado invoice."') },
    { h:'Professional tone', b: UL(['Polite and warm, not stiff: "Thanks for the update!" is fine.','Confident: "I will send it by 3 PM" — not "I\'ll try maybe…"','No slang or text-speak ("pls", "u", "gonna").','No ALL CAPS, no "!!!" — they read as shouting.','Short paragraphs and bullet points.']) },
    { h:'Remote etiquette', b: UL(['Reply or acknowledge within your working hours, even just "Got it — on it, will update by 2 PM."','Share your working hours and time zone; update your status when away.','Be on time for calls; mute when not speaking; have a quiet background.','Never go silent. If sick or offline unexpectedly, tell the client as early as you can.']) },
    { h:'Owning a mistake: the 5-step message', b: `<ol class="steps"><li><b>Tell them first</b> — before they discover it.</li><li><b>What happened</b> — one or two plain sentences.</li><li><b>Impact</b> — what it affected.</li><li><b>Fixed</b> — what you have already corrected (attach it).</li><li><b>Prevention</b> — what you will do so it does not happen again.</li></ol>` + watch('Don\'t blame tools or other people, and don\'t over-apologize. One sincere apology is enough; the fix is what matters.') }
  ],
  demo:{ intro:'You notice the customer list you sent yesterday has 14 duplicate rows.', steps:[
    { d:'Fix it first: remove duplicates, double-check the count (186 customers, not 200).', w:'Come with the solution, not just the problem.' },
    { d:'Subject: "Corrected customer list (duplicates removed)"', w:'The subject tells them it is a fix.' },
    { d:'"Hi Mia, I found an error in the customer list I sent yesterday: 14 customers appeared twice, so the total showed 200 instead of 186."', w:'What happened + impact, plainly.' },
    { d:'"I\'ve removed the duplicates and attached the corrected file. If you already used the old one for the mailing, those 14 people may receive it twice."', w:'Fix + the real-world impact they need to know.' },
    { d:'"From now on I\'ll run a duplicate check before sending any list. Sorry for the trouble!"', w:'Prevention + one short apology.' } ] },
  guided:{ act: quiz([ mc('Which opening line is most professional?', ['"OMG so sorry!!! I messed up the file 😭"','"Hi Carlo — I found an error in yesterday\'s report and have already corrected it (attached)."','"The system broke the file, not me."','"Hey, there might be some issues maybe?"'], 1, 'Calm, specific, already fixed. No drama, no blame, no vagueness.') ]), hints:['Look for calm + specific + solution.','Avoid blame, drama and vagueness.','The best line names the error AND says it is already fixed.'] },
  practical:{ act: wr({ title:'Report your own error', prompt:'Yesterday you sent your client Ms. Reyes the November expense spreadsheet. Today you noticed you counted 3 transactions twice, so the total shows ₱63,270 — the correct total is ₱58,920. Write your message to her.', minWords:60, maxWords:200,
    rubric:[ { auto:'greet' }, { id:'error', label:'Clearly states what went wrong', any:[/\b(error|mistake|incorrect|counted .*twice|double[- ]?count|duplicate)/i] }, { id:'figure', label:'Gives the corrected total (₱58,920)', any:[/58,?920/] }, { id:'fixed', label:'Says it is corrected and attached/updated', any:[/\b(correct(ed)?|updated|fixed|attached|revised)\b/i] }, { id:'prevent', label:'Says how you will prevent it next time', any:[/\b(going forward|from now on|in future|next time|prevent|double[- ]check|check .* before)\b/i] }, { id:'noblame', label:'Takes ownership (no blaming tools or others)', none:[/\b(excel (did|messed)|the system|not my fault|you gave me|glitch)\b/i], why:'Blame makes clients doubt your honesty.', fix:'Say "I" — "I counted three transactions twice."' }, { id:'apol', label:'One sincere apology, not grovelling', auto:{ test: s => (s.match(/\b(sorry|apolog)/gi) || []).length <= 2 }, why:'Too many apologies make you sound unsure and waste the reader\'s time.', fix:'Apologize once, then focus on the fix.' }, { auto:'close' } ],
    model:'Hi Ms. Reyes,\n\nI found an error in the November expense spreadsheet I sent yesterday: I counted three transactions twice, so the total showed ₱63,270. The correct total is ₱58,920.\n\nI\'ve corrected the file and attached the updated version (the three duplicate rows are removed and the summary has been recalculated). If you\'ve already shared the old version, please use this one instead.\n\nGoing forward, I\'ll run a duplicate check and compare totals with the bank statement before sending any report. I\'m sorry for the inconvenience.\n\nBest regards,\n[Your name]' }) },
  mastery:{ questions:[
    mc('What should the first line of a work message contain?', ['A long greeting','The main point or request','Your life update','An apology'], 1, 'Purpose first.'),
    mc('You will be offline for a medical appointment tomorrow 2–4 PM. When do you tell the client?', ['Today, with your plan for urgent items','Tomorrow at 2 PM','After you return','Don\'t mention it'], 0, 'Tell them early and say how urgent work will be covered.'),
    mc('Which word choice sounds most confident?', ['"I\'ll try to maybe send it later"','"I will send it by 3 PM"','"Hopefully soon"','"If I can"'], 1, 'Specific commitments build trust.'),
    mc('Which is NOT part of a good mistake report?', ['What happened','The fix','Blaming the client\'s file','Prevention'], 2, 'Never blame. Own it, fix it, prevent it.'),
    mc('A client sends a message at 9 PM your time, outside your working hours. Best practice?', ['Always reply instantly at any hour','Reply at the start of your next working hours, unless you agreed to cover urgent issues','Never reply','Reply with "I\'m off, go away"'], 1, 'Respect agreed hours — and make sure the client knows them.')
  ] } });

L({ id:'l1e', level:1, title:'Confidentiality & data privacy', mins:40, skills:['confidentiality'], keywords:'privacy NDA password data protection sensitive security',
  objectives:{ learn:['What counts as confidential information','Safe habits for passwords and access','How to handle sensitive customer data','What to do if something goes wrong'], why:'One careless data leak can end a client relationship — and harm real people.', where:'Every client: you will see emails, customer lists, finances and passwords.', expect:'Clients expect you to protect their data as carefully as they would — usually under a signed NDA.' },
  tutorial:[
    { h:'What is confidential?', b: plain('Assume EVERYTHING you see in a client\'s business is private unless they say otherwise.') + UL(['Customer names, emails, phone numbers, addresses (personal data)','Payment details, bank info, invoices, prices, salaries','Passwords and login codes','Contracts, plans, internal conversations']) + P('Many clients ask you to sign an <b>NDA</b> (non-disclosure agreement): a contract promising you will keep their information secret. Laws such as the Philippines\' Data Privacy Act of 2012 and the EU\'s GDPR also protect personal data.') },
    { h:'Passwords & access', b: UL(['Use the client\'s <b>password manager</b> (e.g. Bitwarden, 1Password, LastPass shared vaults) — never ask for passwords in chat or email.','Turn on <b>two-factor authentication (2FA)</b> on your own accounts.','Only use the access you were given. Never log in to anything else "to help".','When a project ends, return or delete access and files as agreed.']) },
    { h:'Safe everyday habits', b: UL(['Lock your screen when you step away (Windows: <kbd>Win</kbd>+<kbd>L</kbd>).','Don\'t download client files to shared or personal devices unless allowed.','Avoid public Wi-Fi for client work; use a trusted connection.','Don\'t paste client data into personal apps or AI tools without the client\'s permission.','Blur or crop personal data out of screenshots — and out of your portfolio.']) },
    { h:'If something goes wrong', b: P('Sent a file to the wrong person? Clicked a suspicious link? Lost a device?') + `<ol class="steps"><li><b>Report it to the client immediately</b> — minutes matter.</li><li>Say exactly what happened.</li><li>Follow their instructions (recall the email, change passwords…).</li></ol>` + watch('Hiding a data mistake is far worse than the mistake itself.') }
  ],
  demo:{ intro:'A customer emails their full credit-card number to ask about a payment.', steps:[
    { d:'Do not copy the card number anywhere (no spreadsheets, no chat).', w:'Every copy is another place it can leak.' },
    { d:'Reply to the customer without repeating the number: "For your security, please don\'t send card details by email. We\'ve removed your message."', w:'Protects the customer and teaches safe behaviour.' },
    { d:'Delete the email (and empty Trash) if the client\'s policy allows; tell the client what happened.', w:'The client decides the policy; you inform them.' },
    { d:'Handle the actual question using the last 4 digits only.', w:'You can still help — just safely.' } ] },
  guided:{ act: quiz([ mc('Your client\'s team member asks you in chat for the company bank password "to save time". You have it in the shared vault. You…', ['Paste it in chat','Ask them to get access through the vault or from the client, and tell the client about the request','Email it instead','Read it to them on a call'], 1, 'Never send passwords by chat or email. Access goes through the vault/owner.', { crit:[0,2,3], critMsg:'Shared a password outside the password manager.' }) ]), hints:['Is chat a safe place for a password?','Who should decide whether this person gets access?','Point them to the vault or the client, and tell the client.'] },
  practical:{ act: quiz([
    mc('You receive a spreadsheet of 500 customers with emails and phone numbers to clean up. Where should you work on it?', ['In the client\'s Google Drive / OneDrive, as instructed','Download it to the family computer','Email it to your personal account to work faster','Upload it to a random free online "cleaner" website'], 0, 'Work where the client stores data. Free online tools and personal accounts create copies you can\'t control.', { crit:[2,3], critMsg:'Moved customer data to an uncontrolled place.' }),
    mc('You accidentally emailed an internal salary sheet to a supplier. First step?', ['Hope they don\'t open it','Tell the client immediately what happened, then try to recall the email and ask the supplier to delete it','Delete it from your Sent folder','Wait until the end of the week'], 1, 'Report immediately. Speed limits the damage.', { crit:[0,2,3], critMsg:'Hid or delayed reporting a data leak.' }),
    mc('You want to add the customer database you cleaned to your portfolio. You should…', ['Use it as is — it\'s your work','Recreate it with fictional data, or fully anonymize it, and only with permission','Blur the names but keep emails','Post it on LinkedIn'], 1, 'Never publish real client data. Use sample data or get permission and anonymize.', { crit:[0,2,3], critMsg:'Published real client data.' }),
    mc('A caller says they are "from the bank" and need the client\'s account login to stop fraud. You…', ['Give it — it\'s an emergency','Refuse politely, do not share anything, and tell the client','Give only the password, not the username','Ask them to email you instead, then send it'], 1, 'Real banks never ask for passwords. This is social engineering.', { crit:[0,2,3], critMsg:'Gave credentials to an unverified person.' }),
    multi('Which are safe habits? (choose all)', ['Locking your screen when you step away','Using 2FA on your accounts','Saving client passwords in a notes app on your phone','Blurring personal data in screenshots','Working on client files on public café Wi-Fi without protection'], [0,1,3], 'Lock screens, 2FA and blurring are good. Unprotected notes and open Wi-Fi expose data.'),
    mc('Is it OK to paste a client\'s customer complaints into your personal AI chatbot to draft replies?', ['Yes, always','Only if the client has approved that tool for their data','Yes, if you delete the chat later','Yes, if you remove the first names only'], 1, 'Client data goes only into tools the client has approved.'),
    mc('A project ends. What do you do with the client\'s files on your laptop?', ['Keep them forever just in case','Return/delete them as the agreement says and confirm with the client','Share them with your next client as examples','Upload to your cloud for backup'], 1, 'Follow the agreement: return or delete, and confirm.'),
    mc('An email asks you to "verify your Microsoft 365 password" via a link to micros0ft-login.co. You…', ['Click and log in to check','Don\'t click; report it as phishing and alert the client if it\'s their account','Forward it to colleagues to ask','Reply asking if it is real'], 1, 'The domain is fake (0 instead of o). Don\'t click; report.', { crit:[0], critMsg:'Entered credentials on a phishing page.' })
  ], { shuffle:false }) },
  mastery:{ questions:[
    mc('What is an NDA?', ['A payment method','A contract to keep client information secret','A type of spreadsheet','A time-tracking tool'], 1, 'Non-disclosure agreement.'),
    mc('Best place to store shared client passwords?', ['A sticky note','The client\'s password manager vault','A chat message','A spreadsheet named "passwords"'], 1, 'Password managers are built for this.'),
    mc('Which counts as personal data?', ['A customer\'s phone number','The company\'s logo','The office plant','A public holiday date'], 0, 'Anything that identifies a person is personal data.'),
    mc('You lost the laptop you use for client work. What first?', ['Buy a new one quietly','Tell the client immediately so passwords and access can be changed','Wait to see if it turns up','Post on social media'], 1, 'Report immediately so access can be secured.'),
    mc('Shortcut to lock a Windows computer?', ['Ctrl+L','Win+L','Alt+F4','Win+D'], 1, 'Win+L locks the screen instantly.')
  ] } });

/* ================= LEVEL 2 ================= */
/* file dataset generator: [type, isoDate, party, ext, messyName, peekStyle] */
const FILE_BASE = [
  ['Invoice','2026-03-14','BrightPath','pdf','scan_0042.pdf'],['Invoice','2026-03-02','Lumen','pdf','Invoice LUMEN march FINAL.pdf'],['Invoice','2026-04-09','CebuPrint','pdf','inv april cebu print.pdf'],['Invoice','2026-02-21','BrightPath','xlsx','feb billing.xlsx'],['Invoice','2026-05-03','Ortega','pdf','Document (3).pdf'],['Invoice','2026-04-27','Lumen','jpg','IMG_4471.jpg'],
  ['Report','2026-03-31','Sunrise','docx','Q1 report draft final FINAL.docx'],['Report','2026-04-30','Sunrise','xlsx','april numbers.xlsx'],['Report','2026-02-28','Sunrise','pdf','monthly-feb.pdf'],['Report','2026-05-15','Lumen','docx','campaign results lumen.docx'],['Report','2026-01-31','Sunrise','xlsx','Book1.xlsx'],
  ['Record','2026-03-05','Villanueva','docx','new patient form.docx'],['Record','2026-03-19','Tan','pdf','scan_0057.pdf'],['Record','2026-04-02','Navarro','xlsx','client info navarro.xlsx'],['Record','2026-04-16','Ramos','docx','intake ramos.docx'],['Record','2026-05-06','Lim','pdf','form lim may.pdf'],['Record','2026-01-22','Garcia','docx','Garcia details.docx'],
  ['Contract','2026-01-10','BrightPath','pdf','agreement brightpath signed.pdf'],['Contract','2026-02-14','CebuPrint','docx','service contract.docx'],['Contract','2026-03-25','Lumen','pdf','Lumen_SLA.pdf'],['Contract','2026-04-20','Ortega','pdf','scan_0063.pdf'],['Contract','2026-05-11','CebuPrint','pdf','cebuprint amendment.pdf'],
  ['Invoice','2026-05-20','Ortega','pdf','payment due ortega.pdf'],['Report','2026-05-31','Sunrise','pdf','may summary.pdf'],['Record','2026-05-22','Bautista','docx','new client bautista.docx'],['Contract','2026-05-28','Lumen','docx','lumen renewal.docx']
];
const FILE_NAMES = { BrightPath:'BrightPath Supplies Inc.', Lumen:'Lumen Marketing Co.', CebuPrint:'Cebu Print Hub', Ortega:'Ortega Cleaning Services', Sunrise:'Sunrise Dental Clinic (internal)', Villanueva:'Maria Villanueva', Tan:'Kevin Tan', Navarro:'Liza Navarro', Ramos:'Paolo Ramos', Lim:'Grace Lim', Garcia:'Andres Garcia', Bautista:'Jessa Bautista' };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function filePeek(t, iso, party, i){ const [y, m, d] = iso.split('-').map(Number); const dateStr = i % 3 === 0 ? MONTHS[m-1] + ' ' + d + ', ' + y : i % 3 === 1 ? d + ' ' + MONTHS[m-1] + ' ' + y : iso; const name = FILE_NAMES[party];
  if (t === 'Invoice') return `INVOICE #INV-${1000 + i * 7}\nFrom: ${name}\nBill to: Sunrise Dental Clinic\nInvoice date: ${dateStr}\nAmount due: ₱${(4200 + i * 1315).toLocaleString()}.00\nTerms: Net 15`;
  if (t === 'Report') return `SUNRISE DENTAL CLINIC\n${party === 'Lumen' ? 'Marketing campaign results prepared by Lumen Marketing Co.' : 'Monthly performance report'}\nPeriod ending: ${dateStr}\nPatients seen: ${300 + i * 11}\nRevenue: ₱${(410000 + i * 9200).toLocaleString()}`;
  if (t === 'Record') return `PATIENT / CUSTOMER RECORD\nName: ${name}\nDate registered: ${dateStr}\nContact: (on file)\nNotes: First visit — cleaning and check-up.`;
  return `SERVICE AGREEMENT\nBetween: Sunrise Dental Clinic and ${name}\nDate signed: ${dateStr}\nTerm: 12 months\n${/amend/i.test(i) ? '' : ''}Signatures: ✔ both parties`; }
function makeFiles(idx, dupList){
  const folders = { Invoice:'inv', Report:'rep', Record:'rec', Contract:'con' };
  const all = FILE_BASE.map((b, i) => ({ name: b[4], peek: filePeek(b[0], b[1], b[2], i), props: 'Type: ' + b[3].toUpperCase() + ' file · Modified ' + b[1], folder: folders[b[0]], expect: `${b[1]}_${b[2]}_${b[0]}.${b[3]}` }));
  all[21].peek = all[21].peek.replace('SERVICE AGREEMENT', 'AMENDMENT TO SERVICE AGREEMENT (replaces pricing in the Feb 14 contract)');
  const files = idx.map(i => Object.assign({}, all[i]));
  dupList.forEach(([i, n]) => files.push({ name: n, peek: all[i].peek, props: all[i].props + ' · identical size', dup: true }));
  return files;
}
const ALL_FILES = () => makeFiles(FILE_BASE.map((_, i) => i), [[0, 'scan_0042 (1).pdf'], [6, 'Q1 report draft final FINAL - Copy.docx'], [12, 'scan_0057 (2).pdf'], [17, 'agreement brightpath signed copy.pdf']]);
const FOLDERS = [{ id:'inv', name:'01_Invoices' }, { id:'rep', name:'02_Reports' }, { id:'rec', name:'03_Customer-Records' }, { id:'con', name:'04_Contracts' }];
const CONV = '<code>YYYY-MM-DD_Party_DocType.ext</code> — the date written <i>in the document</i>, the company or person name with no spaces (e.g. BrightPath, CebuPrint, Villanueva; use "Sunrise" for the clinic\'s own reports), and DocType = Invoice, Report, Record or Contract. Example: <code>2026-03-14_BrightPath_Invoice.pdf</code>';
const PARTY_HELP = 'Party short names: BrightPath, Lumen, CebuPrint, Ortega, Sunrise (the clinic itself), and customers by surname (Villanueva, Tan, Navarro, Ramos, Lim, Garcia, Bautista).';

L({ id:'l2a', level:2, title:'Folders, naming conventions & duplicates', mins:50, skills:['files'], keywords:'file explorer google drive folder structure rename duplicates naming convention',
  objectives:{ learn:['How to design a folder structure a client can navigate','How to name files so they sort and search perfectly','File Explorer and Google Drive basics','How to find and handle duplicates safely'], why:'Messy files cost clients hours every week. Organizing them is often a VA\'s first task.', where:'Shared drives, client onboarding, document management.', expect:'Every file in a predictable place with a predictable name — and nothing important deleted.' },
  tutorial:[
    { h:'Why structure matters', b: plain('A good folder system means anyone can find any file in under 10 seconds, without asking you.') + P('Clients usually say "it\'s a mess, please organize it". Your job is to turn chaos into a system — and write that system down.') },
    { h:'Folder structures that work', b: `<div class="ftree">Sunrise Dental/\n├─ 01_Invoices/\n├─ 02_Reports/\n├─ 03_Customer-Records/\n├─ 04_Contracts/\n└─ 99_Archive/</div>` + UL(['<b>Number prefixes</b> (01_, 02_) keep folders in YOUR chosen order instead of alphabetical.','Group by what people look for: document type, client, or year.','Keep it shallow: 2–3 levels deep is enough.','Add <b>99_Archive</b> for old files instead of deleting them.']) },
    { h:'Naming conventions', b: P('A naming convention is a fixed pattern for file names. Example: <code>YYYY-MM-DD_Party_DocType.ext</code>') + UL(['<b>Date first in YYYY-MM-DD</b> — files then sort by date automatically. "2026-03-14" sorts correctly; "March 14" does not.','<b>Underscores, no spaces</b> — spaces break some links and systems.','<b>No "final", "FINAL2", "new"</b> — use versions: _v01, _v02.','<b>Keep the extension</b> (.pdf, .docx). Changing it does NOT convert the file — it breaks it.']) + watch('Use the date written INSIDE the document (invoice date, signing date), not the day you downloaded it.') },
    { h:'Doing it in the real tools', b: `<b>Windows File Explorer</b> (open with <kbd>Win</kbd>+<kbd>E</kbd>)` + UL(['New folder: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>','Rename: select the file, press <kbd>F2</kbd>','Move: drag, or <kbd>Ctrl</kbd>+<kbd>X</kbd> then <kbd>Ctrl</kbd>+<kbd>V</kbd> in the new folder','Show extensions (Windows 11): ' + MP('View','Show','File name extensions')]) + `<b>Google Drive</b> (drive.google.com)` + UL([MP('New','New folder') + ' to create a folder','Right-click a file › <b>Rename</b>','Right-click › <b>Organize</b> › <b>Move</b> (or drag onto a folder)','Preview a file by double-clicking it']) },
    { h:'Duplicates — careful!', b: P('Clues: "(1)", "Copy", "copy 2" in the name, same size, same content.') + UL(['<b>Open both</b> and compare content before deciding.','An "amended" or "v2" file is usually NOT a duplicate — it is a newer version.','When unsure: move it to 99_Archive or ask. Never delete a unique document.']) }

L({ id:'l2b', level:2, title:'File types, PDFs, ZIP files & screenshots', mins:45, skills:['digital'], keywords:'pdf convert export zip compress screenshot snipping extension upload download',

    { h:'Extensions you must know', b: `<table><tbody><tr><td><code>.docx</code></td><td>Word document — editable text</td></tr><tr><td><code>.xlsx</code> / <code>.csv</code></td><td>Excel workbook / plain comma-separated data (no formulas or formatting)</td></tr><tr><td><code>.pptx</code></td><td>PowerPoint presentation</td></tr><tr><td><code>.pdf</code></td><td>Fixed layout — looks the same everywhere; best for final versions, invoices, contracts</td></tr><tr><td><code>.jpg</code> / <code>.png</code></td><td>Images. PNG is sharper for screenshots</td></tr><tr><td><code>.zip</code></td><td>A compressed folder holding many files</td></tr></tbody></table>` + plain('Editable work → .docx/.xlsx. Final, "do not change" version → .pdf.') },

  demo:{ intro:'Client: "Please send me the signed lease as a PDF and all the move-in photos in one go."', steps:[

  guided:{ act: quiz([ ord('Put these steps in order to send a folder as a ZIP on Windows 11.', ['Put all the files in one folder and name it properly','Right-click the folder','Choose "Compress to ZIP file"','Check the .zip opens, then attach or upload it'], 'Organize → right-click → compress → verify → send.'), mc('Client asks for an invoice they can\'t accidentally edit. Which format?', ['.docx','.pdf','.csv','.txt'], 1, 'PDF keeps a fixed layout and is the standard for final documents.') ]), hints:['You need a folder before you can zip it.','Compress is in the right-click menu.','Always check the result before sending.'] },
  practical:{ act:{ type:'upload', kind:'zip', title:'Prepare a submission package',
    brief:`Hi! Before you start on real deliverables, please show me you can package files properly.\n\n1. Create a folder named <b>YYYY-MM-DD_Practice_Submission</b> using today's date.\n2. Inside it, put exactly three files:\n   • a PDF you export from a short document you write yourself (any 2–3 lines) — name it <b>YYYY-MM-DD_Practice_PDF.pdf</b>\n   • a screenshot of a blank document or this academy page (nothing private!) saved as PNG — <b>YYYY-MM-DD_Practice_Screenshot.png</b>\n   • any spreadsheet saved as .xlsx — <b>YYYY-MM-DD_Practice_Spreadsheet.xlsx</b>\n3. Compress the folder to a ZIP file and upload it here.`, from:'Training supervisor',
    deliver:['Folder name follows the pattern with a real date','Three files with the exact naming pattern','A real exported PDF (not a renamed file)','A real PNG screenshot','A real .xlsx file'],
    check: async (m) => {
      const ents = m.entries.filter(e => !/^__MACOSX\//.test(e.name) && !/\.DS_Store$/.test(e.name));
      const files = ents.filter(e => !e.dir);
      const roots = new Set(files.map(f => f.name.split('/')[0]));
      const root = [...roots][0] || ''; const oneRoot = roots.size === 1 && files.every(f => f.name.includes('/'));
      const dm = /^(\d{4})-(\d{2})-(\d{2})_Practice_Submission$/.exec(root);
      const dateOk = dm && Math.abs(new Date(+dm[1], +dm[2]-1, +dm[3]) - new Date()) < 3 * 864e5;
      const date = dm ? dm[1] + '-' + dm[2] + '-' + dm[3] : 'YYYY-MM-DD';
      const want = { pdf: date + '_Practice_PDF.pdf', png: date + '_Practice_Screenshot.png', xlsx: date + '_Practice_Spreadsheet.xlsx' };
      const byName = n => files.find(f => f.name === root + '/' + n);
      const sig = async (f, bytes) => { if (!f) return false; const b = new Uint8Array(await m.zip.file(f.name).async('arraybuffer')).slice(0, bytes.length); return bytes.every((x, i) => b[i] === x); };
      const pdfF = byName(want.pdf), pngF = byName(want.png), xlF = byName(want.xlsx);
      return [
        chk(oneRoot, 'Everything is inside one folder in the ZIP', { detail: oneRoot ? '' : 'Found: ' + esc([...roots].join(', ')), why: 'Zipping the folder (not loose files) keeps things tidy when the client extracts it.', fix: 'Right-click the FOLDER itself and compress it.', tag:'zip' }),
        chk(dm, 'Folder name follows YYYY-MM-DD_Practice_Submission', { detail: 'Your folder: <code>' + esc(root) + '</code>', fix: 'Rename the folder exactly, e.g. ' + todayISO() + '_Practice_Submission', tag:'files-naming' }),
        chk(dateOk, 'The date in the folder name is today\'s date', { why: 'Dates in names must be accurate or sorting becomes misleading.', fix: 'Use today: ' + todayISO(), tag:'files-naming' }),
        chk(files.length === 3, 'Exactly three files inside', { detail: files.map(f => esc(f.name)).join('<br>'), fix: 'Remove extra files; include only the three requested.', tag:'zip' }),
        chk(pdfF, 'PDF named ' + want.pdf, { fix: 'Name must match exactly, including capitals and underscores.', tag:'files-naming' }),
        chk(await sig(pdfF, [0x25,0x50,0x44,0x46]), 'The PDF is a real exported PDF', { why: 'Renaming a .docx to .pdf does not make it a PDF — the client could not open it.', fix: 'Use File › Save As › PDF (Word) or File › Download › PDF (Google Docs).', tag:'files-ext' }),
        chk(pngF, 'Screenshot named ' + want.png, { tag:'files-naming' }),
        chk(await sig(pngF, [0x89,0x50,0x4e,0x47]), 'The screenshot is a real PNG image', { fix: 'Save from Snipping Tool as PNG (File › Save as › PNG).', tag:'files-ext' }),
        chk(xlF, 'Spreadsheet named ' + want.xlsx, { tag:'files-naming' }),
        chk(await sig(xlF, [0x50,0x4b,0x03,0x04]), 'The spreadsheet is a real .xlsx file', { fix: 'Save from Excel or download from Google Sheets as Microsoft Excel (.xlsx).', tag:'files-ext' })
      ];
    } } },
  mastery:{ questions:[
    mc('Which format keeps formulas and formatting?', ['.csv','.xlsx','.txt','.pdf'], 1, 'CSV stores only plain values.'),
    mc('Windows shortcut to capture part of the screen?', ['Win+Shift+S','Ctrl+P','Alt+Tab','Win+L'], 0, 'Win+Shift+S opens the snipping tool.'),
    mc('Your ZIP is 90 MB. The client wants it by email. Best move?', ['Email it anyway','Upload to their cloud drive and share a link','Split it into 90 emails','Rename it to .pdf'], 1, 'Most email services limit attachments to about 25 MB.'),

  ] } });

VA.data.formulaIndex = [];
const FCARD = (lid, lesson) => (name, what, when, syntax, ex, mistakes) => { VA.data.formulaIndex.push({ name, what, lid, lesson }); return { h: name, b: `<p><b>What it does:</b> ${what}</p><p><b>When businesses use it:</b> ${when}</p><p><b>Syntax:</b> <code>${esc(syntax)}</code></p><div class="plain"><b>Example:</b> ${ex}</div><div class="watch"><b>Common mistakes:</b> ${mistakes}</div>` }; };
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const FIRST = ['Maria','Jose','Ana','Mark','Kristine','John','Angelica','Paolo','Camille','Miguel','Patricia','Carlo','Nicole','Rafael','Bea','Joshua','Hazel','Daniel','Joy','Kevin','Trisha','Aldrin','Faith','Renz','Clarisse','Gino','Lea','Ramon','Ivy','Jerome'];
const LAST = ['Santos','Reyes','Cruz','Bautista','Ocampo','Garcia','Mendoza','Torres','Villanueva','Ramos','Aquino','Navarro','Castillo','Flores','Dela Cruz','Gonzales','Lim','Tan','Rivera','Fernandez','Uy','Sison','Pascual','Domingo'];
const REAL_APPS = (excel, sheets) => ({ h:'Do it in the real apps', b: `<div class="grid g2"><div><b>Microsoft Excel</b><ol class="steps">${excel.map(s => `<li>${s}</li>`).join('')}</ol></div><div><b>Google Sheets</b><ol class="steps">${sheets.map(s => `<li>${s}</li>`).join('')}</ol></div></div>` });
const dt = (y, m, d) => new Date(y, m - 1, d);
const isoD = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const serial = d => XL.toSerial(d.getFullYear(), d.getMonth() + 1, d.getDate());
const near = (W, label, sh) => W.near(label, sh);
/* generic value check helper for uploads */
function valCheck(W, label, expected, o={}){
  const n = typeof label === 'string' ? W.near(label, o.sheet) : W.near(label, o.sheet);
  const lab = o.name || (typeof label === 'string' ? label : String(label));
  if (!n || !n.cell) return chk(false, `"${lab}" is present with its value`, { detail: n ? 'Found the label but no value next to it (put the value in the cell to its right).' : 'Could not find a cell labelled "' + esc(lab) + '". Type the label exactly, with the value in the cell to its right.', why: 'Clients and checkers look for clearly labelled results.', fix: 'Type the label exactly as written, then put the formula in the cell directly to the right.', tag: o.tag });
  const c = n.cell; let ok; const v = c.v;
  if (typeof expected === 'number') ok = W.eq(typeof v === 'number' ? v : NaN, expected, o.tol ?? 0.011);
  else ok = String(v ?? '').trim().toLowerCase() === String(expected).toLowerCase();
  const needF = o.formula !== false;
  const isF = W.isFormula(c);
  const fnOk = !o.must || (isF && o.must.some(fn => new RegExp('\\b' + fn + '\\s*\\(', 'i').test(c.f)));
  const all = ok && (!needF || isF) && fnOk;
  let detail = `Your value in ${n.a}: <b>${esc(c.w ?? v)}</b>${isF ? ` (formula <code>=${esc(c.f)}</code>)` : ' (typed, not a formula)'}`;
  if (!ok) detail += ` · expected <b>${typeof expected === 'number' ? expected.toLocaleString('en-US', { maximumFractionDigits: 2 }) : esc(expected)}</b>`;
  return chk(all, `"${lab}" is correct${needF ? ' and calculated with a formula' : ''}${o.must ? ' (' + o.must.join('/') + ')' : ''}`, { detail, why: !ok ? 'The number is different from the true total — usually a wrong range, a missed row or an unfixed category.' : !isF ? 'A typed number does not update when data changes.' : 'The client asked for a specific method.', fix: o.fix || (o.must ? 'Use ' + o.must.join(' or ') + ' and check the ranges cover every data row.' : 'Use a formula and check that ranges cover every data row.'), tag: o.tag, impact: 'Clients make spending and staffing decisions from these numbers.' });
}

function genLeads(seed){ const r = rng(seed); const names = []; while (names.length < 12){ const n = pick(FIRST, r) + ' ' + pick(LAST, r); if (!names.includes(n)) names.push(n); }
  const mess = n => { const k = ri(r, 0, 3); return k === 0 ? n.toLowerCase() : k === 1 ? '  ' + n + ' ' : k === 2 ? n.toUpperCase() : n.replace(' ', '   '); };
  const recs = names.map(n => ({ clean: n, email: n.toLowerCase().replace(/ /g, '.') + '@mail.example', src: pick(['Facebook ad','Referral','Website form','Walk-in'], r) }));
  const raw = recs.map(x => [mess(x.clean), r() < 0.4 ? x.email.toUpperCase() : x.email, x.src]);
  [1, 4, 8].forEach(i => raw.push(raw[i].slice()));
  return { raw: shuffle(raw, r), recs }; }

  const all = [ { cell:'B10', ask:'Total sales for the week (SUM of C2:C8)', ref:'=SUM(C2:C8)', must:['SUM'], tag:'sum-basic' }, { cell:'B11', ask:'Average sales per open day (AVERAGE ignores the blank closed day)', ref:'=AVERAGE(C2:C8)', must:['AVERAGE'], tag:'sum-basic' }, { cell:'B12', ask:'Lowest daily sales (MIN)', ref:'=MIN(C2:C8)', must:['MIN'], tag:'sum-basic' }, { cell:'B13', ask:'Highest daily sales (MAX)', ref:'=MAX(C2:C8)', must:['MAX'], tag:'sum-basic' }, { cell:'B14', ask:'How many days have a sales number (COUNT)', ref:'=COUNT(C2:C8)', must:['COUNT'], tag:'sum-basic' }, { cell:'B15', ask:'How many days have a note (COUNTA)', ref:'=COUNTA(D2:D8)', must:['COUNTA'], tag:'sum-basic' } ];

    F3('AVERAGE','The mean: total ÷ number of values. Blank cells are ignored, but zeros count.','Average order value, average response time.','=AVERAGE(number1, [number2], …)','<code>=AVERAGE(C2:C8)</code> — if one day is blank (closed), it is skipped.','Typing 0 for "no data" — it drags the average down. Leave it blank.'),
    F3('MIN and MAX','Smallest and largest number in a range.','Cheapest quote, biggest sale, earliest/latest date.','=MIN(range)  /  =MAX(range)','<code>=MAX(C2:C8)</code> → the best sales day.','Using them on text — they only look at numbers.'),
    F3('COUNT vs COUNTA','COUNT counts cells with <b>numbers</b>. COUNTA counts cells that are <b>not empty</b> (text too).','How many orders have an amount (COUNT); how many customers are listed (COUNTA).','=COUNT(range)  /  =COUNTA(range)','<code>=COUNTA(D2:D8)</code> counts the days that have a note.','Using COUNT on names (gives 0) — use COUNTA for text.'),
    REAL_APPS(['Click the cell for the answer','Type <code>=SUM(</code> then drag over C2:C8','Type <code>)</code> and press Enter','Shortcut: <kbd>Alt</kbd>+<kbd>=</kbd> inserts AutoSum','Check the result in the status bar (select the range — Sum/Average/Count show bottom right)'], ['Click the cell for the answer','Type <code>=SUM(</code>, drag over C2:C8','Type <code>)</code>, Enter','Sheets suggests ranges as you type — press Tab to accept','Select a range: the sum shows at the bottom right'])
  ],
  demo:{ intro:'Totals for a week of sales (Thursday was closed).', steps:[
    { d:'B10: =SUM(C2:C8) → total sales.', w:'The range covers all 7 days; the blank day adds nothing.' },
    { d:'B11: =AVERAGE(C2:C8) → average per OPEN day.', w:'AVERAGE skips the blank Thursday. If you typed 0 there, the average would drop.' },
    { d:'B14: =COUNT(C2:C8) → 6 days with numbers.', w:'COUNT only counts numbers.' },
    { d:'B15: =COUNTA(D2:D8) → days with a note.', w:'COUNTA counts any non-empty cell, including text.' } ] },
  guided:{ act:{ type:'sheet', gen: genBasic(false), cur:'₱', sheetName:'Week 48' }, hints:['Every formula starts with =. The sales are in column C, rows 2 to 8.','Total: =SUM(C2:C8). Now try AVERAGE and MAX the same way.','B10 =SUM(C2:C8) · B11 =AVERAGE(C2:C8) · B12 =MIN(C2:C8)'] },
  practical:{ act:{ type:'sheet', gen: genBasic(true), cur:'₱', sheetName:'Week 49' } },
  mastery:{ questions:[
    txt('Write a formula that adds C2 through C30.', ['=SUM(C2:C30)'], '=SUM(C2:C30)'),
    mc('Cells C2:C6 contain 10, (blank), 20, 30, "n/a". What is =COUNT(C2:C6)?', ['5','4','3','2'], 2, 'COUNT counts only numbers: 10, 20, 30.'),
    mc('Same cells — what is =COUNTA(C2:C6)?', ['5','4','3','2'], 1, 'COUNTA counts non-empty cells: 10, 20, 30, "n/a".'),
    mc('A store was closed one day. To keep the daily average correct, that day\'s sales cell should be…', ['0','Blank','"closed" in the sales column','-1'], 1, 'AVERAGE ignores blanks but counts zeros.'),
    mc('Why use =SUM() instead of typing the total?', ['It looks smarter','It updates automatically when numbers change','Typing is not allowed','It uses less memory'], 1, 'Formulas stay correct when data changes.')
  ] } });

function genRefs(full){ return r => { const ag = shuffle(['Ana','Ben','Carla','Dino','Elle','Fritz','Gwen'], r).slice(0, 6); const rate = pick([0.04, 0.05, 0.06, 0.075], r); const rows = [['Commission rate', '', rate], [], ['Agent','Sales (₱)','Commission','Share of total sales'], ...ag.map(a => [a, ri(r, 40, 220) * 1000]), ['Total']];
  const tasks = [ { range:'C4:C9', ask:'Commission for each agent = Sales × the rate in C1. Write it in C4 with C1 <b>locked</b>, then Fill down to C9.', ref:'=B4*$C$1', abs:'$C$1', tag:'abs-ref', fix:'In C4 type =B4*$C$1, then select C4:C9 and press Ctrl+D (Fill down).' }, { cell:'B10', ask:'Total sales', ref:'=SUM(B4:B9)', must:['SUM'], tag:'sum-basic' } ];
  if (full){ tasks.push({ cell:'C10', ask:'Total commission', ref:'=SUM(C4:C9)', must:['SUM'], tag:'sum-basic' }); tasks.push({ range:'D4:D9', ask:'Each agent\'s share of total sales = their Sales ÷ total in B10 (lock B10). Format as Percent.', ref:'=B4/$B$10', abs:'$B$10', tag:'abs-ref' }); }
  const fmt = { C1:'pct' }; for (let i = 4; i <= 10; i++){ fmt['B' + i] = 'cur'; fmt['C' + i] = 'cur'; fmt['D' + i] = 'pct'; } return { rows, tasks, fmt }; }; }
L({ id:'l3e', level:3, title:'Cell references, percentages & currency', mins:55, skills:['xl-formulas'], apps:['excel','sheets'], keywords:'relative absolute reference dollar sign F4 percentage currency fill down',
  objectives:{ learn:['Relative vs absolute references ($)','Fill a formula down a column correctly','Percentage and currency calculations','Number formats for money and percent'], why:'Copying formulas is how you build sheets fast — and the #1 source of hidden errors.', where:'Commission sheets, VAT, discounts, budgets, shares of total.', expect:'Formulas that stay correct when copied, and numbers formatted as money or %.' },
  tutorial:[
    { h:'Relative references move', b: plain('When you copy =B4*C4 one row down, it becomes =B5*C5. The references move with the formula. That is usually what you want.') },
    { h:'Absolute references stay put', b: P('Sometimes every row must use ONE fixed cell — like a commission rate in C1. Lock it with dollar signs: <code>$C$1</code>.') + `<table><tbody><tr><td><code>C1</code></td><td>moves in both directions</td></tr><tr><td><code>$C$1</code></td><td>never moves (absolute)</td></tr><tr><td><code>$C1</code></td><td>column locked, row moves</td></tr><tr><td><code>C$1</code></td><td>row locked, column moves</td></tr></tbody></table>` + P('Shortcut: put the cursor on the reference and press <kbd>F4</kbd> (Excel; on some laptops <kbd>Fn</kbd>+<kbd>F4</kbd>). In Google Sheets, <kbd>F4</kbd> also works, or type the $ yourself.') + watch('Forgetting $ is invisible in the first row (it works!) and wrong in every row below.') },
    { h:'Fill down', b: UL(['Drag the small square at the bottom-right of the cell (the fill handle) down.','Or select the formula cell + the cells below and press <kbd>Ctrl</kbd>+<kbd>D</kbd>.','Double-clicking the fill handle fills down to the end of the data (Excel).']) },
    { h:'Percentages & money', b: UL(['Percent of total: <code>=B4/$B$10</code> then format as % (Excel ' + MP('Home','%') + ', Sheets ' + MP('Format','Number','Percent') + ').','Add 12% VAT: <code>=B4*1.12</code>. VAT only: <code>=B4*12%</code>.','Discount 15%: <code>=B4*(1-15%)</code>.','% change: <code>=(New-Old)/Old</code>.','Currency: Excel ' + MP('Home','Number Format','Currency') + ' (choose ₱ or $); Sheets ' + MP('Format','Number','Currency') + ' or Custom currency.']) }
  ],
  demo:{ intro:'Commission at 5% (rate in C1).', steps:[
    { d:'C4: =B4*C1 → correct for Ana.', w:'Looks fine… for now.' },
    { d:'Fill down → C5 becomes =B5*C2 (empty!) → ₱0.', w:'The rate reference moved. Classic mistake.' },
    { d:'Fix: C4: =B4*$C$1 (press F4 on C1), fill down.', w:'C5 is now =B5*$C$1 — the rate stays locked.' },
    { d:'Format C4:C9 as Currency and D4:D9 as Percent.', w:'Readable money and percentages.' } ] },
  guided:{ act:{ type:'sheet', gen: genRefs(false), cur:'₱', sheetName:'Commission' }, hints:['The rate is in C1. Every agent needs that SAME cell.','Type =B4*$C$1 in C4. The $ signs lock C1. Then Shift+click C9 and use Fill down.','C4: =B4*$C$1 → Fill down to C9. B10: =SUM(B4:B9).'] },
  practical:{ act:{ type:'sheet', gen: genRefs(true), cur:'₱', sheetName:'Commission' } },
  mastery:{ questions:[
    mc('=B4*$C$1 is copied from row 4 to row 7. It becomes…', ['=B7*$C$4','=B7*$C$1','=B4*$C$1','=E7*$C$1'], 1, 'B4 moves to B7; $C$1 stays.'),
    mc('Which key toggles $ signs on a reference in Excel?', ['F2','F4','F9','F12'], 1, 'F4.'),
    txt('Write a formula for 12% VAT ONLY on the amount in B2.', ['=B2*12%', '=B2*0.12', '=0.12*B2', '=12%*B2', /^=\(?b2\)?\*0?\.12$/i], '=B2*12% (or =B2*0.12).'),
    mc('Old price 200, new price 250. % change formula?', ['=(250-200)/200','=(250-200)/250','=250/200','=200/250'], 0, '(New − Old) ÷ Old = 25%.'),
    mc('$C1 means…', ['Both locked','Column C locked, row moves','Row 1 locked, column moves','Nothing locked'], 1, 'The $ sits before what is locked.')
  ] } });

function genLogic(full){ return r => { const cl = ['Lumen Co.','Ortega Svcs','BrightPath','Cebu Print','Navarro Law','Tan Foods','Isla Café','Rivera Dental'];
  const rows = [['Invoice','Client','Amount (₱)','Days late','Paid?']]; for (let i = 0; i < 8; i++){ const paid = r() < 0.4 ? 'Yes' : 'No'; rows.push(['INV-' + (2101 + i), cl[i], ri(r, 6, 90) * 1000, paid === 'Yes' ? 0 : pick([0, 0, 12, 35, 48, 65, 90], r), paid]); }
  if (!rows.slice(1).some(x => x[3] === 0 && x[4] === 'No')) rows[3][3] = 0, rows[3][4] = 'No';
  rows[0].push('Status','Late fee','Action','Amount per late day');
  const tasks = [ { range:'F2:F9', ask:'Status: "Closed" if Paid? is Yes, otherwise "Open" (IF).', ref:'=IF(E2="Yes","Closed","Open")', must:['IF'], tag:'logic' }, { range:'G2:G9', ask:'Late fee: 5% of Amount if NOT paid AND more than 30 days late, otherwise 0 (IF + AND).', ref:'=IF(AND(E2="No",D2>30),C2*5%,0)', must:['AND'], tag:'logic' } ];
  if (full){ tasks.push({ range:'H2:H9', ask:'Action: "Call client" if more than 60 days late OR Amount over 50,000; otherwise "Email" (IF + OR).', ref:'=IF(OR(D2>60,C2>50000),"Call client","Email")', must:['OR'], tag:'logic' }); tasks.push({ range:'I2:I9', ask:'Amount ÷ Days late — but show 0 instead of an error when Days late is 0 (IFERROR).', ref:'=IFERROR(C2/D2,0)', must:['IFERROR'], tag:'logic' }); }
  const fmt = {}; for (let i = 2; i <= 9; i++){ fmt['C' + i] = 'cur'; fmt['G' + i] = 'cur'; fmt['I' + i] = 'cur'; } return { rows, tasks, fmt }; }; }
const F4L = FCARD('l3f', 'Logical formulas');
L({ id:'l3f', level:3, title:'Logical formulas: IF, AND, OR, IFERROR', mins:60, skills:['xl-formulas'], apps:['excel','sheets'], keywords:'if and or iferror logical test condition',
  objectives:{ learn:['Make the sheet decide with IF','Combine conditions with AND / OR','Hide errors cleanly with IFERROR','Common logical-test mistakes'], why:'IF turns a list into a smart tracker that labels, flags and calculates by itself.', where:'Payment status, overdue flags, reorder alerts, pass/fail, bonuses.', expect:'Labels and flags that are always right without manual checking.' },
  tutorial:[
    F4L('IF','Checks a condition and returns one value if TRUE, another if FALSE.','"Paid" vs "Unpaid", "Reorder" vs "OK", bonus eligible or not.','=IF(logical_test, value_if_true, value_if_false)','<code>=IF(E2="Yes","Closed","Open")</code>','Forgetting quotes around text ("Yes"); using quotes around numbers ("100").'),
    F4L('AND','TRUE only if ALL conditions are true.','Late fee only if unpaid AND over 30 days late.','=AND(condition1, condition2, …)','<code>=IF(AND(E2="No",D2>30),C2*5%,0)</code>','Writing D2>30 AND E2="No" as text instead of inside AND().'),
    F4L('OR','TRUE if ANY condition is true.','Escalate if very late OR very large.','=OR(condition1, condition2, …)','<code>=IF(OR(D2>60,C2>50000),"Call client","Email")</code>','Using OR when you mean AND — read your rule out loud.'),
    F4L('IFERROR','Shows something friendly instead of an error like #DIV/0! or #N/A.','Lookups that may not find a match; dividing by a value that may be 0.','=IFERROR(value, value_if_error)','<code>=IFERROR(C2/D2,0)</code>','Hiding errors you should actually fix. Use it only where an error is expected and acceptable.'),
    { h:'Comparison operators', b: `<table><tbody><tr><td><code>=</code></td><td>equal</td><td><code>&lt;&gt;</code></td><td>not equal</td></tr><tr><td><code>&gt;</code> / <code>&lt;</code></td><td>greater / less than</td><td><code>&gt;=</code> / <code>&lt;=</code></td><td>at least / at most</td></tr></tbody></table>` + plain('Text is compared without caring about capitals: "yes" = "YES".') }
  ],
  demo:{ intro:'An invoice tracker that labels itself.', steps:[
    { d:'F2: =IF(E2="Yes","Closed","Open") → fill down.', w:'Text results need quotes.' },
    { d:'G2: =IF(AND(E2="No",D2>30),C2*5%,0)', w:'Both conditions must be true for a fee.' },
    { d:'H2: =IF(OR(D2>60,C2>50000),"Call client","Email")', w:'Either condition is enough to escalate.' },
    { d:'I2: =C2/D2 shows #DIV/0! when D2 is 0 → wrap: =IFERROR(C2/D2,0).', w:'An expected error, shown cleanly.' } ] },
  guided:{ act:{ type:'sheet', gen: genLogic(false), cur:'₱', sheetName:'Invoices' }, hints:['IF has three parts: test, value if true, value if false. Text goes in quotes.','F2: =IF(E2="Yes","Closed","Open"). For G2, put AND(…) as the test.','G2: =IF(AND(E2="No",D2>30),C2*5%,0) — then Fill down both columns.'] },
  practical:{ act:{ type:'sheet', gen: genLogic(true), cur:'₱', sheetName:'Invoices' } },
  mastery:{ questions:[
    txt('Write a formula for F2: show "Reorder" if stock in B2 is 10 or less, otherwise "OK".', [/^=if\(\s*b2\s*<=\s*10\s*,\s*"reorder"\s*,\s*"ok"\s*\)$/i, /^=if\(\s*b2\s*>\s*10\s*,\s*"ok"\s*,\s*"reorder"\s*\)$/i, /^=if\(\s*b2\s*<\s*11\s*,\s*"reorder"\s*,\s*"ok"\s*\)$/i], 'Example: =IF(B2<=10,"Reorder","OK")', { show:'=IF(B2<=10,"Reorder","OK")' }),
    mc('=AND(5>3, 2>4) returns…', ['TRUE','FALSE','#VALUE!','5'], 1, 'Both must be true; 2>4 is false.'),
    mc('=OR(5>3, 2>4) returns…', ['TRUE','FALSE','#N/A','0'], 0, 'One true condition is enough.'),
    mc('Which formula avoids #DIV/0! when B2 can be 0?', ['=A2/B2','=IFERROR(A2/B2,0)','=IF(A2/B2)','=ERROR(A2/B2)'], 1, 'IFERROR catches the error.'),
    mc('=IF(A2=Yes,"Paid","Unpaid") returns #NAME?. Why?', ['A2 is empty','Yes needs quotes: "Yes"','IF is misspelled','Too many arguments'], 1, 'Text must be in quotes.')
  ] } });

function genCond(full){ return r => { const cats = ['Office','Travel','Meals','Software']; const ven = { Office:['National Book Store','Office Warehouse'], Travel:['Grab','Cebu Pacific','Shell'], Meals:['Jollibee','Starbucks','Mesa'], Software:['Canva','Zoom','Google Workspace'] };
  const rows = [['Date','Category','Vendor','Amount (₱)','Paid by']]; for (let i = 0; i < 20; i++){ const c = pick(cats, r); rows.push([`2026-11-${pad2(ri(r, 2, 28))}`, c, pick(ven[c], r), c === 'Travel' ? ri(r, 5, 90) * 100 : c === 'Software' ? ri(r, 8, 40) * 100 : ri(r, 3, 30) * 100, pick(['Company card','Cash','Company card','Reimburse'], r)]); }
  cats.forEach(c => { if (!rows.slice(1).some(x => x[1] === c)) rows[2][1] = c; });
  rows[0].push('', 'Category', 'Total', 'Count', 'Average'); cats.forEach((c, i) => { rows[i + 1][6] = c; });
  rows[7][6] = 'Travel paid by Company card'; rows[8][6] = 'Expenses over ₱5,000'; rows[9][6] = 'Meals over ₱1,000 (count)';
  const tasks = [ { range:'H2:H5', ask:'Total per category (SUMIF). Tip: lock the data ranges with $ so you can fill down.', ref:'=SUMIF($B$2:$B$21,G2,$D$2:$D$21)', must:['SUMIF'], tag:'cond-calc' }, { range:'I2:I5', ask:'Number of expenses per category (COUNTIF).', ref:'=COUNTIF($B$2:$B$21,G2)', must:['COUNTIF'], tag:'cond-calc' } ];
  if (full){ tasks.push({ range:'J2:J5', ask:'Average expense per category (AVERAGEIF).', ref:'=AVERAGEIF($B$2:$B$21,G2,$D$2:$D$21)', must:['AVERAGEIF'], tag:'cond-calc' }, { cell:'H8', ask:'Total Travel paid by Company card (SUMIFS — two conditions).', ref:'=SUMIFS(D2:D21,B2:B21,"Travel",E2:E21,"Company card")', must:['SUMIFS'], tag:'cond-calc' }, { cell:'H9', ask:'How many expenses are over 5,000 (COUNTIF with ">5000").', ref:'=COUNTIF(D2:D21,">5000")', must:['COUNTIF'], tag:'cond-calc' }, { cell:'H10', ask:'How many Meals expenses are over 1,000 (COUNTIFS).', ref:'=COUNTIFS(B2:B21,"Meals",D2:D21,">1000")', must:['COUNTIFS'], tag:'cond-calc' }); }
  const fmt = {}; for (let i = 2; i <= 21; i++) fmt['D' + i] = 'cur'; ['H2','H3','H4','H5','J2','J3','J4','J5','H8'].forEach(a => fmt[a] = 'cur'); return { rows, tasks, fmt }; }; }
const F5 = FCARD('l3g', 'Conditional calculations');
L({ id:'l3g', level:3, title:'Conditional calculations: SUMIF(S), COUNTIF(S), AVERAGEIF', mins:70, skills:['xl-formulas'], apps:['excel','sheets'], keywords:'sumif sumifs countif countifs averageif criteria',
  objectives:{ learn:['Add up only the rows that match (SUMIF/SUMIFS)','Count matching rows (COUNTIF/COUNTIFS)','Average matching rows (AVERAGEIF)','Write criteria like ">5000" and use cell references as criteria'], why:'"How much did we spend on travel?" is the most common client question about a spreadsheet.', where:'Expense summaries, sales by product/region, attendance counts.', expect:'Summary tables that update when new rows are added.' },
  tutorial:[
    F5('SUMIF','Adds values only where ONE condition matches.','Spending per category, sales per product.','=SUMIF(range, criteria, [sum_range])','<code>=SUMIF(B2:B21,"Travel",D2:D21)</code> → total of D where B is Travel.','Mixing up the order: the condition range comes FIRST, the numbers to add LAST.'),
    F5('SUMIFS','Adds values where SEVERAL conditions all match. Note: the sum range comes FIRST here.','Travel paid by company card; November sales in the North region.','=SUMIFS(sum_range, criteria_range1, criteria1, criteria_range2, criteria2, …)','<code>=SUMIFS(D2:D21,B2:B21,"Travel",E2:E21,"Company card")</code>','Using SUMIF order with SUMIFS. Ranges of different sizes (#VALUE!).'),
    F5('COUNTIF / COUNTIFS','Counts rows that match one / several conditions.','How many orders are pending; how many late days per employee.','=COUNTIF(range, criteria)  /  =COUNTIFS(range1, criteria1, range2, criteria2…)','<code>=COUNTIF(D2:D21,">5000")</code> counts amounts over 5,000.','Forgetting quotes around ">5000".'),
    F5('AVERAGEIF','Averages values where a condition matches.','Average order value per product.','=AVERAGEIF(range, criteria, [average_range])','<code>=AVERAGEIF(B2:B21,"Meals",D2:D21)</code>','#DIV/0! when nothing matches — check spelling of the criteria.'),
    { h:'Criteria tricks', b: UL(['Use a cell as criteria: <code>=SUMIF($B$2:$B$21,G2,$D$2:$D$21)</code> — then fill down for every category.','Comparisons go in quotes: <code>">5000"</code>, <code>"&lt;&gt;Paid"</code>.','Combine with a cell: <code>">"&amp;H1</code>.','Wildcards: <code>"Office*"</code> matches anything starting with Office.']) + watch('Lock the data ranges with $ before filling down, or they slide down and miss rows.') }
  ],
  demo:{ intro:'Expense summary by category.', steps:[
    { d:'G2:G5 already list the categories. H2: =SUMIF($B$2:$B$21,G2,$D$2:$D$21)', w:'G2 is the criteria — relative, so it moves to G3, G4… Data ranges are locked.' },
    { d:'Fill down H2:H5.', w:'Each row now totals its own category.' },
    { d:'I2: =COUNTIF($B$2:$B$21,G2) → how many expenses.', w:'COUNTIF has no sum range.' },
    { d:'H8: =SUMIFS(D2:D21,B2:B21,"Travel",E2:E21,"Company card")', w:'SUMIFS: what to add first, then pairs of (range, condition).' },
    { d:'Check: the category totals should add up to the grand total.', w:'A quick self-check catches range mistakes.' } ] },
  guided:{ act:{ type:'sheet', gen: genCond(false), cur:'₱', sheetName:'November' }, hints:['SUMIF(where to look, what to look for, what to add). Categories are in column B, amounts in D.','H2: =SUMIF($B$2:$B$21,G2,$D$2:$D$21) — the $ signs keep the ranges fixed when you fill down.','H2 =SUMIF($B$2:$B$21,G2,$D$2:$D$21) · I2 =COUNTIF($B$2:$B$21,G2) → Fill down both.'] },
  practical:{ act:{ type:'sheet', gen: genCond(true), cur:'₱', sheetName:'November' } },
  mastery:{ questions:[
    mc('In SUMIF, which argument holds the numbers to add?', ['The first','The second','The third (sum_range)','None'], 2, '=SUMIF(range, criteria, sum_range).'),
    mc('In SUMIFS, which comes first?', ['The criteria range','The sum range','The criteria','A blank'], 1, 'SUMIFS starts with the sum range.'),
    txt('Count how many cells in C2:C50 say "Pending".', ['=COUNTIF(C2:C50,"Pending")'], '=COUNTIF(C2:C50,"Pending")'),
    mc('Correct way to count amounts above 1,000 in D2:D20?', ['=COUNTIF(D2:D20,>1000)','=COUNTIF(D2:D20,">1000")','=COUNT(D2:D20>1000)','=COUNTIF(">1000",D2:D20)'], 1, 'Criteria with operators go in quotes.'),
    mc('You fill down =SUMIF(B2:B21,G2,D2:D21) and lower rows give wrong totals. Why?', ['G2 should be locked','The data ranges slide down — they should be $B$2:$B$21 and $D$2:$D$21','SUMIF cannot be filled','The categories are wrong'], 1, 'Lock the data ranges.')
  ] } });

function genLookup(full){ return r => { const prods = ['Lavender Candle','Rose Soap Bar','Gift Box Small','Gift Box Large','Ribbon Pack','Greeting Card','Scented Sachet','Mini Bouquet','Tea Sampler','Wooden Tray'];
  const rows = [['SKU','Product','Price (₱)','Stock']]; prods.forEach((p, i) => rows.push(['SKU-' + (1001 + i), p, ri(r, 8, 90) * 10, ri(r, 0, 60)]));
  const skus = shuffle(prods.map((_, i) => 'SKU-' + (1001 + i)), r).slice(0, 4); skus.splice(ri(r, 1, 3), 0, 'SKU-1O04');
  rows[0].push('', 'Order SKU', 'Product', 'Price (₱)', 'Qty', 'Line total'); skus.forEach((s, i) => { rows[i + 1][5] = s; rows[i + 1][8] = ri(r, 1, 6); });
  const target = 'SKU-' + (1001 + ri(r, 0, 9)); rows[7][5] = 'Stock of ' + target;
  const tasks = [ { range:'G2:G6', ask:'Product name for each order SKU with VLOOKUP (exact match). Wrap in IFERROR to show "Not found" for the typo SKU.', ref:'=IFERROR(VLOOKUP(F2,$A$2:$D$11,2,FALSE),"Not found")', must:['VLOOKUP','IFERROR'], tag:'lookup' }, { range:'H2:H6', ask:'Price with XLOOKUP, showing 0 if not found (4th argument).', ref:'=XLOOKUP(F2,$A$2:$A$11,$C$2:$C$11,0)', must:['XLOOKUP'], tag:'lookup' } ];
  if (full){ tasks.push({ range:'J2:J6', ask:'Line total = Price × Qty.', ref:'=H2*I2', tag:'sum-basic' }); tasks.push({ cell:'G8', ask:`Stock of ${target} using INDEX + MATCH (exact match, 0).`, ref:`=INDEX(D2:D11,MATCH("${target}",A2:A11,0))`, must:['INDEX','MATCH'], tag:'lookup' }); }
  const fmt = {}; for (let i = 2; i <= 11; i++) fmt['C' + i] = 'cur'; for (let i = 2; i <= 6; i++){ fmt['H' + i] = 'cur'; fmt['J' + i] = 'cur'; } return { rows, tasks, fmt }; }; }

  objectives:{ learn:['Pull information from a table with VLOOKUP','The modern, safer XLOOKUP','INDEX + MATCH (works everywhere, any direction)','Handle "not found" cleanly'], why:'Lookups connect lists: orders to prices, employees to departments, SKUs to products.', where:'Order sheets, inventory, CRM exports, invoices.', expect:'Correct matches every time — and clear "Not found" messages instead of errors.' },

function genText(full){ return r => { const rows = [['Raw name','Customer code','First','Last','Clean name','Branch','ID number','Year','Email username']]; const used = new Set();
  for (let i = 0; i < 7; i++){ let f, l; do { f = pick(FIRST, r); l = pick(LAST.filter(x => !/ /.test(x)), r); } while (used.has(f + l)); used.add(f + l); const k = ri(r, 0, 3); const raw = k === 0 ? '  ' + f.toLowerCase() + '   ' + l.toUpperCase() + ' ' : k === 1 ? f.toUpperCase() + '  ' + l.toLowerCase() : k === 2 ? ' ' + f + ' ' + l.toLowerCase() : f.toLowerCase() + ' ' + l.toLowerCase() + '  '; rows.push([raw, pick(['CEB','MNL','DVO','ILO'], r) + '-' + pick(['2024','2025','2026'], r) + '-' + String(ri(r, 1, 9999)).padStart(4, '0'), f, l]); }
  rows.push([]); rows.push(['All last names (one cell)']);
  const tasks = [ { range:'E2:E8', ask:'Clean name: remove extra spaces and capitalize each word (PROPER + TRIM).', ref:'=PROPER(TRIM(A2))', must:['TRIM','PROPER'], tag:'text-fn' }, { range:'F2:F8', ask:'Branch = first 3 characters of the code (LEFT).', ref:'=LEFT(B2,3)', must:['LEFT'], tag:'text-fn' }, { range:'G2:G8', ask:'ID number = last 4 characters (RIGHT).', ref:'=RIGHT(B2,4)', must:['RIGHT'], tag:'text-fn' } ];
  if (full){ tasks.push({ range:'H2:H8', ask:'Year = the 4 characters starting at position 5 (MID).', ref:'=MID(B2,5,4)', must:['MID'], tag:'text-fn' }, { range:'I2:I8', ask:'Email username = first.last in lowercase, e.g. maria.santos (CONCAT + LOWER).', ref:'=CONCAT(LOWER(C2),".",LOWER(D2))', must:['CONCAT'], tag:'text-fn' }, { cell:'B10', ask:'All last names in one cell separated by comma + space (TEXTJOIN).', ref:'=TEXTJOIN(", ",TRUE,D2:D8)', must:['TEXTJOIN'], tag:'text-fn' }); }
  return { rows, tasks }; }; }

function genDate(full){ return r => { const tasks0 = ['Website copy review','Supplier contract renewal','Q4 newsletter','Office move checklist','Year-end inventory count','Client onboarding pack','Holiday schedule']; const rows = [['Task','Start','Due','Completed']];
  tasks0.forEach((t, i) => { const s = ri(r, 2, 26); const due = ri(r, 1, 25); const dm = due < 8 ? 12 : 11; const dd = dm === 12 ? due : Math.max(s + 2, due); const done = r() < 0.35; rows.push([t, `2026-11-${pad2(Math.min(s, 27))}`, `2026-${dm}-${pad2(Math.min(dd, 30))}`, done ? `2026-11-${pad2(Math.min(dd, 30))}` : '']); });
  if (!rows.slice(1).some(x => !x[3] && x[2] < '2026-12-02')){ rows[2][2] = '2026-11-27'; rows[2][1] = '2026-11-10'; rows[2][3] = ''; }
  rows[0].push('Days until due','Working days (start→due)','Due month','Status');
  rows.push([]); rows.push(['Project kickoff date (15 Jan 2027)']); rows.push(['Year of first start date']);
  const tasks = [ { range:'E2:E8', ask:'Days until due = Due − TODAY() (negative means past due). Today in this sheet is 2 Dec 2026.', ref:'=C2-TODAY()', must:['TODAY'], tag:'date-fn' }, { range:'F2:F8', ask:'Working days from Start to Due (NETWORKDAYS).', ref:'=NETWORKDAYS(B2,C2)', must:['NETWORKDAYS'], tag:'date-fn' } ];
  if (full){ tasks.push({ range:'G2:G8', ask:'Month number of the Due date (MONTH).', ref:'=MONTH(C2)', must:['MONTH'], tag:'date-fn' }, { range:'H2:H8', ask:'Status: "Done" if Completed is not blank; else "Overdue" if Due is before TODAY(); else "On track" (nested IF).', ref:'=IF(D2<>"","Done",IF(C2<TODAY(),"Overdue","On track"))', must:['IF','TODAY'], tag:'date-fn' }, { cell:'B10', ask:'Build the date 15 Jan 2027 with DATE.', ref:'=DATE(2027,1,15)', must:['DATE'], tag:'date-fn' }, { cell:'B11', ask:'Year of the first task\'s Start date (YEAR).', ref:'=YEAR(B2)', must:['YEAR'], tag:'date-fn' }); }
  return { rows, tasks, fmt: { B10:'date' } }; }; }

function genSales(seed, n=40){ const r = rng(seed); const rows = []; for (let i = 0; i < n; i++){ const m = pick([10, 11, 12], r); const units = ri(r, 1, 25); const price = { Candles:350, Soaps:180, 'Gift Boxes':890, Cards:120, Teas:420 }; const p = pick(PRODS, r); rows.push({ date: dt(2026, m, ri(r, 1, 28)), id: 'ORD-' + (5000 + i), product: p, region: pick(REG, r), units, price: price[p] }); } return rows; }

const CITIES = { 'Cebu City':['cebu','Cebu city','CEBU CITY','Cebu City'], 'Mandaue City':['mandaue','Mandaue city','MANDAUE','Mandaue City'], 'Lapu-Lapu City':['Lapu Lapu','lapu-lapu','Lapu-Lapu City','LLC'], 'Talisay City':['talisay','Talisay','Talisay City'] };
function genCustomers(seed){ const r = rng(seed); const recs = []; const used = new Set(); while (recs.length < 46){ const f = pick(FIRST, r), l = pick(LAST, r); if (used.has(f + l)) continue; used.add(f + l); const city = pick(Object.keys(CITIES), r); const ph = '9' + ri(r, 15, 99) + ' ' + ri(r, 100, 999) + ' ' + ri(r, 1000, 9999); recs.push({ name: f + ' ' + l, email: (f + '.' + l).toLowerCase().replace(/ /g, '') + '@' + pick(['gmail.com','yahoo.com','outlook.com'], r), phone: '+63 ' + ph, city }); }
  const messy = x => { const k = ri(r, 0, 4); const name = k === 0 ? x.name.toLowerCase() : k === 1 ? '  ' + x.name : k === 2 ? x.name.toUpperCase() : x.name; const p = x.phone.replace('+63 ', ''); const pk = ri(r, 0, 3); const phone = pk === 0 ? '0' + p : pk === 1 ? '0' + p.replace(/ /g, '') : pk === 2 ? '(0' + p.slice(0, 3) + ') ' + p.slice(4, 7) + '-' + p.slice(8) : x.phone; return [name, r() < 0.3 ? x.email.toUpperCase() : x.email, phone, pick(CITIES[x.city], r)]; };
  const raw = recs.map(messy); [3, 11, 25].forEach(i => raw.push(raw[i].slice())); const nd = messy(recs[30]); nd[0] = recs[30].name.toLowerCase() + '  '; raw.push(nd);
  return { raw: shuffle(raw, r), recs: recs.slice().sort((a, b) => a.name.localeCompare(b.name)) }; }

    brief:`Hi! Here's our customer export — it's messy. Please deliver one clean database:\n\n1. A sheet named <b>Customers</b> with columns exactly: <b>Customer ID | Name | Email | Phone | City</b>\n2. Every customer only once (remove duplicates — some differ only by capitals/spaces).\n3. Names in Proper Case, no extra spaces. Emails lowercase.\n4. Phones as <b>+63 917 555 1234</b>.\n5. Cities exactly one of: Cebu City, Mandaue City, Lapu-Lapu City, Talisay City.\n6. Sorted A–Z by Name, with IDs <b>CUST-001</b>, CUST-002… in that order.\n7. Header bold, frozen, filters on.`, from:'Angela — Bloom & Basket',

      const sorted = names.every((n, i) => !i || names[i - 1].toLowerCase().localeCompare(n.toLowerCase()) <= 0); const ids = rowsI.every((r, i) => raw(r, 0) === 'CUST-' + String(i + 1).padStart(3, '0'));
      return [ chk(H.every((h, i) => hdr.cols[i] === h), 'Columns are exactly Customer ID | Name | Email | Phone | City', { detail:'Found: ' + esc(hdr.cols.filter(Boolean).join(' | ')), tag:'xl-format' }),

        chk(!badN.length, 'Names are clean Proper Case', { detail: badN.slice(0, 6).map(n => '<code>' + esc(n) + '</code>').join(', '), fix:'=PROPER(TRIM(A2)) then paste values.', tag:'xl-clean' }),

const CATS = Object.keys(CATMAP);
function genExpenses(seed){ const r = rng(seed); const desc = { 'Office Supplies':['Printer ink','Bond paper','Folders & pens','Stapler & clips'], Software:['Canva Pro','Zoom subscription','Google Workspace','Accounting app'], Travel:['Grab to client','Ferry fare','Fuel','Parking'], Meals:['Client lunch','Team merienda','Coffee meeting','Overtime dinner'], Utilities:['Electricity','Internet','Water','Mobile load'] };
  const rows = []; for (let i = 0; i < 40; i++){ const c = CATS[i % 5] && pick(CATS, r); const m = i < 20 ? 10 : 11; const amt = Math.round((c === 'Software' ? ri(r, 400, 3000) : c === 'Travel' ? ri(r, 150, 4500) : c === 'Utilities' ? ri(r, 1200, 6500) : ri(r, 120, 2500)) * 100) / 100 + (r() < 0.3 ? 0.5 : 0); rows.push({ date: dt(2026, m, ri(r, 1, 28)), desc: pick(desc[c], r), cat: c, raw: pick(CATMAP[c], r), amt }); }

    brief:`Hi! Attached are our Oct–Nov expenses. Please:\n\n1. On the <b>Expenses</b> sheet, fix the Category column so every row uses exactly one of: <b>${CATS.join(', ')}</b>.\n2. Format Amount with 2 decimals (currency is fine).\n3. Add a sheet named <b>Summary</b> showing each category's total (label = category name, total in the cell to its right, using SUMIF).\n4. On Summary, add labelled cells: <b>Total expenses</b>, <b>October total</b>, <b>November total</b> (SUMIFS on dates), and <b>Highest category</b> (the name of the category with the largest total — a formula is best).`, from:'Rey — Dela Cruz Print Shop',

function genInventory(seed){ const r = rng(seed); const names = ['Lavender Candle','Rose Soap','Gift Box S','Gift Box L','Ribbon Pack','Greeting Card','Tea Sampler','Wooden Tray','Mini Bouquet','Scented Sachet']; const prods = names.map((n, i) => ({ sku: 'BB-' + (201 + i), name: n, open: ri(r, 10, 60), reorder: pick([10, 15, 20], r) })); const mov = []; for (let i = 0; i < 34; i++){ const p = pick(prods, r); const type = r() < 0.35 ? 'In' : 'Out'; mov.push({ date: dt(2026, 11, ri(r, 1, 28)), sku: p.sku, type, qty: type === 'In' ? ri(r, 5, 30) : ri(r, 1, 18) }); } mov.sort((a, b) => a.date - b.date);
  prods.forEach(p => { p.in = mov.filter(x => x.sku === p.sku && x.type === 'In').reduce((a, x) => a + x.qty, 0); p.out = mov.filter(x => x.sku === p.sku && x.type === 'Out').reduce((a, x) => a + x.qty, 0); p.rem = p.open + p.in - p.out; p.status = p.rem <= p.reorder ? 'Reorder' : 'OK'; }); return { prods, mov }; }

    starter:{ name:'Inventory_Nov.xlsx', build: async seed => { const g = genInventory(seed); return xlsxBlob([{ name:'Products', rows: [['SKU','Product','Opening Stock','Reorder Level'], ...g.prods.map(p => [p.sku, p.name, p.open, p.reorder])], cols:[10, 18, 14, 14] }, { name:'Movements', rows: [['Date','SKU','Type','Qty'], ...g.mov.map(x => [x.date, x.sku, x.type, x.qty])], cols:[12, 10, 8, 6] }]); } },
    brief:'Hi! Please turn our Products sheet into a live inventory tracker. Add these columns to <b>Products</b> (headers exactly):\n\n• <b>Stock In</b> and <b>Stock Out</b> — totals from the Movements sheet (SUMIFS)\n• <b>Remaining</b> = Opening Stock + Stock In − Stock Out\n• <b>Status</b> = "Reorder" when Remaining is at or below the Reorder Level, otherwise "OK" (IF formula)\n• <b>Reorder Status</b> — a dropdown with Not ordered, Ordered, Received\n\nAnd please highlight low-stock items with conditional formatting.', from:'Angela — Bloom & Basket',

L({ id:'l3p4', level:3, title:'Project 4 — Employee attendance tracker', mins:100, skills:['xl-formulas'], apps:['excel','sheets'], keywords:'project attendance countif networkdays percentage absences tardiness',

    brief:'Hi! Please complete the November attendance sheet. On the <b>November</b> sheet, add these columns after the last day (headers exactly):\n\n• <b>Present</b>, <b>Late</b>, <b>Absent</b> — COUNTIF of P, L, A\n• <b>Attendance %</b> = (Present + Late) ÷ working days, formatted as a percentage\n\nAlso add a cell labelled <b>Working days</b> with NETWORKDAYS for November 2026, and a cell labelled <b>Most absences</b> showing the employee with the most absences.', from:'Priya — Northline Consulting',

/* ================= LEVEL 4: WORD & GOOGLE DOCS ================= */
function docChecks(m, o){
  const items = []; const t = m.text;
  if (o.headings) items.push(chk(m.headings.length >= o.headings, `Uses real Heading styles (${m.headings.length} found, need ${o.headings}+)`, { detail: m.headings.slice(0, 6).map(h => '<code>' + esc(h.text.slice(0, 40)) + '</code>').join(', '), why: 'Heading styles create structure: navigation pane, automatic table of contents, consistent look. Bold text is not a heading.', fix: 'Word: Home › Styles › Heading 1/2. Google Docs: Format › Paragraph styles (or the "Normal text" dropdown).', tag:'doc-format' }));
  if (o.fonts) items.push(chk(m.fonts.size <= o.fonts, `Consistent fonts (${m.fonts.size || 1} font${m.fonts.size === 1 ? '' : 's'} used)`, { detail: [...m.fonts].map(esc).join(', '), why: 'Mixed fonts look careless and unprofessional.', fix: 'Select all (Ctrl+A) and pick one body font; let Heading styles handle headings.', tag:'doc-format' }));
  if (o.sizes) items.push(chk(m.sizes.size <= o.sizes, `Consistent body text size`, { detail: 'Body sizes found: ' + [...m.sizes].sort((a, b) => a - b).join(', ') + ' pt', fix: 'Use one body size (10–12 pt).', tag:'doc-format' }));
  if (o.margins) items.push(chk(m.margins && ['top','bottom','left','right'].every(k => m.margins[k] >= 0.9 && m.margins[k] <= 1.1), 'Margins are 1 inch (2.54 cm)', { detail: m.margins ? Object.entries(m.margins).map(([k, v]) => k + ' ' + v.toFixed(2) + '"').join(', ') : '', fix: 'Word: Layout › Margins › Normal. Docs: File › Page setup.', tag:'doc-format' }));
  if (o.list) items.push(chk(m.lists >= o.list, `Uses a real bulleted/numbered list (${m.lists} list items)`, { why: 'Real lists indent and align properly; typed dashes do not.', fix: 'Home › Bullets/Numbering (Docs: Format › Bullets & numbering).', tag:'doc-format' }));
  if (o.table) items.push(chk(m.tables >= 1, 'Contains a real table', { fix: 'Insert › Table, or select tab-separated text › Insert › Table › Convert Text to Table (Word).', tag:'doc-format' }));
  if (o.pageNum) items.push(chk(m.pageNum, 'Page numbers in the header or footer', { fix: 'Word: Insert › Page Number. Docs: Insert › Page numbers.', tag:'doc-format' }));
  if (o.header) items.push(chk(m.headers.length > 0 || m.footers.length > 0, 'Has a header or footer (e.g. document title, company, version)', { tag:'doc-format' }));
  if (o.blank !== false){ let run = 0, maxRun = 0; m.paras.forEach(p => { if (!p.text.trim() && !p.inTable) { run++; maxRun = Math.max(maxRun, run); } else run = 0; }); items.push(chk(maxRun < 3, 'No stacks of empty lines used for spacing', { detail: maxRun >= 3 ? maxRun + ' empty paragraphs in a row' : '', why: 'Empty lines break layout when anything changes.', fix: 'Use paragraph spacing (Layout › Spacing) or a page break (Ctrl+Enter).', tag:'doc-format' })); }
  if (o.words) items.push(chk(m.words >= o.words[0] && m.words <= o.words[1], `Length ${m.words} words (expected ${o.words[0]}–${o.words[1]})`, { tag:'doc-format' }));
  (o.must || []).forEach(([re, label, x]) => items.push(chk(re.test(t), label, Object.assign({ tag:'doc-format' }, x || {}))));
  return items;
}

L({ id:'l4a', level:4, title:'Document formatting: styles, layout, lists, headers & footers', mins:70, skills:['word'], apps:['word','docs'], keywords:'word google docs font paragraph headings styles margins spacing table header footer page numbers bullets',
  objectives:{ learn:['Fonts, sizes and paragraph spacing','Heading styles (and why bold text is not a heading)','Margins, page layout, tables and lists','Headers, footers and page numbers'], why:'Clients judge documents in 3 seconds. Clean formatting = trust.', where:'Letters, policies, reports, SOPs, proposals.', expect:'One font, real headings, aligned lists, page numbers — like a professional office produced it.' },

  guided:{ act:{ type:'proof', text:'Sunrise Dental Clinic reminds patients 7 days before every visit. Staff must [[allways|always]] use the patient\'s preferred name and never include treatment details in an SMS. If a patient replies to cancel, offer two new [[slot|slots]]. Every reminder is logged in [[teh|the]] scheduling system. Questions go to the clinic [[maneger|manager]].', instructions:'Warm-up proofreading: click every word that has a spelling or grammar error.' }, hints:['Read each word slowly — spelling first.','Look for a missing letter and a word that should be plural.','Errors: allways, slot (→ slots), teh, maneger.'] },
  practical:{ act:{ type:'upload', kind:'docx', title:'Format a messy document',

    brief:'Hi! This policy document looks terrible. Please make it professional:\n\n• One consistent body font and size.\n• A real Title, and Heading 1 for each section (PURPOSE, WHO THIS APPLIES TO, Reminder schedule, RULES — sentence case is fine).\n• Turn the reminder schedule into a real table.\n• Turn the rules into a real bulleted list.\n• Remove the empty-line gaps; use proper spacing.\n• 1-inch margins and page numbers in the footer.\n• Keep all the text — don\'t delete content.', from:'Dr. Lim — Sunrise Dental Clinic',

  ] } });

L({ id:'l4b', level:4, title:'Business letters & client-facing documents', mins:55, skills:['word','communication'], apps:['word','docs'], keywords:'business letter block format salutation closing client document',
  objectives:{ learn:['The parts of a business letter','Block format layout','Tone and structure for client-facing documents','Common letter mistakes'], why:'Letters still matter: notices, confirmations, references, formal requests.', where:'Real estate, clinics, legal-adjacent offices, HR.', expect:'A letter the client can sign and send without edits.' },
  tutorial:[
    { h:'Parts of a business letter (block format)', b: `<ol class="steps"><li><b>Sender details / letterhead</b> (company name, address)</li><li><b>Date</b> — written out: 3 December 2026 or December 3, 2026</li><li><b>Recipient</b> name, title, company, address</li><li><b>Subject line</b> (optional): Re: Lease renewal — Unit 4B</li><li><b>Salutation</b>: Dear Ms. Santos,</li><li><b>Body</b>: purpose → details → next step</li><li><b>Closing</b>: Sincerely, / Kind regards,</li><li><b>Signature block</b>: name, title, contact</li></ol>` + plain('Block format = everything aligned left, a blank line between parts, no indents.') },
    { h:'Writing the body', b: UL(['First paragraph: why you are writing.','Middle: the facts (dates, amounts, what is needed).','Last: the clear next step and deadline.','Short paragraphs, plain words, polite but direct.']) },
    { h:'Common mistakes', b: UL(['Wrong or missing date','"Dear Sir/Madam" when you know the name','Mixing fonts','Forgetting the signature block','Promising things the client did not approve']) }
  ],
  demo:{ intro:'A lease renewal reminder letter.', steps:[
    { d:'Letterhead: Harbor Key Realty, address, phone.', w:'Who it is from.' },
    { d:'Date: December 3, 2026. Recipient block for Ms. Ana Santos.', w:'Formal, complete.' },
    { d:'Re: Lease renewal — Unit 4B, 18 Oak Street', w:'The reader knows the topic instantly.' },
    { d:'Body: lease ends 31 Jan; renewal terms enclosed; please reply by 15 Dec.', w:'Purpose, facts, deadline.' },
    { d:'Kind regards, + Marco Uy, Property Manager, phone/email.', w:'Complete signature block.' } ] },
