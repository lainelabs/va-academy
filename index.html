  practical:{ act:{ type:'upload', kind:'docx', title:'Write a business letter',
    brief:'Hi! Please draft a letter for me to sign, in block format:\n\n• From: Harbor Key Realty, 210 Congress Ave, Austin, TX 78701\n• To: Mr. Daniel Brooks, 4521 Cedar Lane, Austin, TX 78745\n• Purpose: his property viewing at 18 Oak Street is confirmed for <b>Saturday, December 12, 2026 at 10:00 AM</b>. He should bring a photo ID. Parking is on the street. If he needs to reschedule, he can call (512) 555-0198 by Thursday, December 10.\n• Sign as: Marco Uy, Leasing Agent\n\nUse today\'s date, one font, 1-inch margins, and save as .docx.', from:'Marco — Harbor Key Realty',
    deliver:['Block format with all parts','Correct facts from the brief','One font, 1" margins','120–350 words'],
    check: async m => docChecks(m, { fonts:2, margins:true, blank:true, words:[100, 350], must:[ [/Harbor Key Realty/i, 'Letterhead / sender company'], [/(January|February|March|April|May|June|July|August|September|October|November|December) \d{1,2}, \d{4}|\d{1,2} (January|February|March|April|May|June|July|August|September|October|November|December) \d{4}/, 'Date written out in full'], [/Daniel Brooks/i, 'Recipient name'], [/4521 Cedar Lane/i, 'Recipient address'], [/Dear (Mr\.?|Daniel)/i, 'Salutation "Dear Mr. Brooks,"'], [/December 12/i, 'Correct viewing date', { crit:true }], [/10:00|10 ?AM|10 a\.m\./i, 'Correct time', { crit:true }], [/photo ID/i, 'Mentions photo ID'], [/555-0198/, 'Reschedule phone number'], [/(Sincerely|Kind regards|Best regards|Regards|Respectfully),?/i, 'Closing'], [/Marco Uy/i, 'Signature block name'] ] }),
    aiRubric:[{ id:'tone', label:'Professional, warm tone suitable for a client' }, { id:'structure', label:'Clear purpose, details and next step' }], aiTask:'Business letter confirming a property viewing for a real estate client' } },
  portfolio:{ cat:'Administrative Documents', title:'Business Letter — Viewing Confirmation', shows:'A block-format business letter prepared for a client signature.', skills:['Business writing','Word formatting','Accuracy'] },
  mastery:{ questions:[ mc('Block format means…', ['Everything centered','Everything left-aligned, no indents','Two columns','Justified text'], 1, 'Left-aligned.'), mc('Best salutation when you know the name?', ['To whom it may concern','Dear Ms. Santos,','Hey Ana!','Dear Sir/Madam'], 1, 'Use the name.'), mc('Where does the date go?', ['After the signature','Near the top, before the recipient address','In the footer','Nowhere'], 1, 'Top.'), mc('The client\'s note says "bring ID". Your letter should…', ['Skip it','Include it accurately','Add a fee','Change it'], 1, 'Facts exactly as given.'), mc('Which closing is professional?', ['Cheers mate','Kind regards,','XOXO','Bye'], 1, 'Kind regards.') ] } });

L({ id:'l4c', level:4, title:'Meeting minutes from rough notes', mins:60, skills:['word','communication'], apps:['word','docs'], keywords:'meeting minutes notes action items decisions agenda attendees',
  objectives:{ learn:['What minutes must record','Turn messy notes into clear minutes','Action items with owners and due dates','Professional minutes layout'], why:'Minutes are how teams remember what they decided. VAs are often the note-taker.', where:'Consulting, agencies, boards, any team meeting.', expect:'Accurate, neutral minutes with crystal-clear action items — sent within 24 hours.' },
  tutorial:[

  practical:{ act:{ type:'upload', kind:'docx', title:'Write the meeting minutes',
    brief:'Hi! Here are my rough notes from today. Please turn them into professional minutes in Word/Docs (.docx):\n\n<pre style="white-space:pre-wrap">' + esc(NOTES) + '</pre>\nInclude: title, date/time/platform, attendees and apologies, a section per agenda item with decisions, an <b>action items table</b> (Action | Owner | Due), and the next meeting. Use Heading styles.', from:'Priya — Northline Consulting',

L({ id:'l4d', level:4, title:'Reports, SOPs, PDF export & proofreading', mins:70, skills:['word','qa'], apps:['word','docs'], keywords:'report sop standard operating procedure pdf proofreading table of contents',
  objectives:{ learn:['Structure a simple business report','Write a Standard Operating Procedure (SOP)','Export a final PDF','Proofread systematically'], why:'SOPs let clients delegate; reports show results. Both must be error-free.', where:'Process documentation, monthly reports, onboarding guides.', expect:'Clear steps anyone can follow, and zero typos in anything client-facing.' },
  tutorial:[
    { h:'Simple report structure', b: `<ol class="steps"><li>Title page or title block (title, prepared for/by, date)</li><li>Summary (the answer first, 3–5 lines)</li><li>Findings / details with headings, tables, charts</li><li>Recommendations / next steps</li><li>Appendix (raw data) if needed</li></ol>` },
    { h:'SOPs (Standard Operating Procedures)', b: plain('An SOP is a recipe for a business task, so anyone can do it the same way every time.') + UL(['<b>Title</b>, version, date, owner','<b>Purpose</b> — why this process exists','<b>Scope</b> — when it applies, who uses it','<b>Tools / access needed</b>','<b>Procedure</b> — numbered steps, one action per step, starting with a verb ("Open…", "Check…")','<b>Quality check / notes</b>']) + P('Write it while you do the task. Test it: could a new VA follow it without asking you?') },
    { h:'Export to PDF', b: P('Final versions go out as PDF: Word ' + MP('File','Save As','PDF') + ' · Docs ' + MP('File','Download','PDF document') + '. Open the PDF once to check page breaks and images.') },
    { h:'Proofreading system', b: `<ol class="steps"><li>Run spell check (Word: <kbd>F7</kbd>; Docs: ' + MP('Tools','Spelling and grammar') + ').</li><li>Read once for meaning.</li><li>Read once for numbers, dates and names — against the source.</li><li>Read once for consistency (same date format, same terms, same capitalization).</li><li>Read the headings and the first line of each paragraph aloud.</li></ol>` + watch('Spell check does not catch wrong words that are real words ("form" vs "from", "manger" vs "manager").') }
  ],
  demo:{ intro:'Writing an SOP for "Sending weekly invoice reminders".', steps:[
    { d:'Title: SOP — Weekly Invoice Reminders · v1.0 · 4 Dec 2026 · Owner: VA team', w:'Version and owner so updates are tracked.' },
    { d:'Purpose: Get unpaid invoices paid faster without bothering paid clients.', w:'One sentence why.' },
    { d:'Scope: Every Monday; all invoices more than 7 days overdue.', w:'When and what.' },
    { d:'Procedure: 1. Open the invoice tracker. 2. Filter Status = Unpaid and Days late > 7. 3. … (numbered list)', w:'One action per step, starting with a verb.' },
    { d:'Quality check: Confirm no paid client received a reminder; log the date sent.', w:'How to know it was done right.' } ] },
  guided:{ act:{ type:'proof', tag:'proofreading', source:'Facts: Report for Northline Consulting, period November 2026. 42 support tickets (38 resolved). Average response time 3.5 hours. Prepared by the VA team on 2 December 2026.', text:'Monthly Support Report — Northline Consulting\nPeriod: [[October|November]] 2026\n\nIn November the team handled 42 support tickets, of which [[83|38]] were resolved. The average response time was 3.5 hours, which is [[withing|within]] our target. [[Their|There]] were no urgent escalations.\n\nRecommendations: update the FAQ page and [[reveiw|review]] the ticket categories.\n\nPrepared by the VA team on 2 [[Dezember|December]] 2026.', instructions:'Proofread this report against the source facts. Click every error — spelling, grammar AND wrong facts.' }, hints:['Compare every number and date with the source facts.','Real-word errors: one homophone hides here.','Errors: October, 83, withing, Their, reveiw, Dezember.'] },
  practical:{ act:{ type:'upload', kind:'docx', title:'Write an SOP',
    brief:'Hi! I want to delegate our appointment-reminder process. Please write an SOP document for <b>"Sending appointment reminder SMS"</b> based on this:\n\nEvery weekday at 4 PM the VA opens the clinic booking system, filters tomorrow\'s appointments, checks each patient\'s mobile number and SMS consent, sends the reminder template (name, time, clinic address — never treatment details), marks "Reminder sent" in the booking, and at the end reports any failed messages to the front desk. If consent is missing, do not send — note it for the front desk.\n\nInclude: title, version + date, Purpose, Scope, Tools needed, Procedure as a numbered list (at least 6 steps), and a Quality check section. Add page numbers and a header or footer.', from:'Dr. Lim — Sunrise Dental Clinic',
    deliver:['Title, version and date','Purpose, Scope, Tools, Procedure, Quality check headings','Numbered procedure (6+ steps)','Header/footer with page numbers'],
    check: async m => docChecks(m, { headings:5, fonts:3, list:6, pageNum:true, header:true, words:[180, 900], must:[ [/version|v\d/i, 'Version number'], [/\b20\d\d\b/, 'Date'], [/purpose/i, 'Purpose section'], [/scope/i, 'Scope section'], [/tools|access|requirements/i, 'Tools / access section'], [/procedure|steps/i, 'Procedure section'], [/quality|check/i, 'Quality check section'], [/consent/i, 'Consent rule included', { crit:true, why:'Sending SMS without consent can break privacy rules.' }], [/treatment/i, 'Rule about never including treatment details'], [/4 ?PM|4:00/i, 'Timing (4 PM weekdays)'] ] }),

/* ================= LEVEL 5: POWERPOINT & GOOGLE SLIDES ================= */
function pptChecks(m, o){ const items = []; const S = m.slides;
  items.push(chk(S.length >= o.min && S.length <= (o.max || 99), `${S.length} slides (expected ${o.min}–${o.max || o.min + 6})`, { tag:'slides' }));
  const noTitle = S.map((s, i) => !s.title ? i + 1 : 0).filter(Boolean); items.push(chk(!noTitle.length, 'Every slide has a title (in the title placeholder)', { detail: noTitle.length ? 'Slides without a title: ' + noTitle.join(', ') : '', why:'Titles tell the audience the point of each slide and make the deck navigable.', fix:'Use layouts with a Title placeholder (Home › Layout) and type the title there.', tag:'slides' }));
  const wordy = S.map((s, i) => s.words > (o.maxWords || 60) ? i + 1 : 0).filter(Boolean); items.push(chk(!wordy.length, `No walls of text (max ~${o.maxWords || 60} words per slide)`, { detail: wordy.length ? 'Too wordy: slide ' + wordy.join(', ') : '', why:'People read OR listen — not both. Long text slides lose the audience.', fix:'Keep 3–5 short bullets; move detail into the speaker notes.', tag:'slides' }));
  items.push(chk(m.fonts.size <= 3, `Consistent fonts (${m.fonts.size || 'theme'} font${m.fonts.size === 1 ? '' : 's'})`, { detail: [...m.fonts].map(esc).join(', '), fix:'Use the theme fonts; avoid changing fonts slide by slide.', tag:'slides' }));
  if (o.notes) items.push(chk(S.filter(s => words(s.notes) >= 5).length >= o.notes, `Speaker notes on at least ${o.notes} slides`, { fix:'Click below the slide (PowerPoint: View › Notes; Slides: "Click to add speaker notes").', tag:'slides' }));
  if (o.pic) items.push(chk(S.some(s => s.pic) || m.files.some(f => /^ppt\/media\//.test(f)), 'Includes at least one image', { tag:'slides' }));
  if (o.chart) items.push(chk(S.some(s => s.chart || s.table), 'Includes a chart or table for the numbers', { why:'Numbers are clearer as a chart or table than in sentences.', fix:'Insert › Chart (or Table).', tag:'slides' }));
  (o.must || []).forEach(([re, label, x]) => items.push(chk(re.test(m.text), label, Object.assign({ tag:'slides' }, x || {}))));
  return items; }

const INBOX_MAIN = { type:'inbox', owner:'Angela Ramos — Bloom & Basket (online gift shop, Cebu)', now:'Monday 7 December 2026, 8:30 AM (PHT)', facts: BB_FACTS, emails: EMAILS };
L({ id:'l6a', level:6, title:'Inbox basics: Gmail & Outlook, labels, filters, search & phishing', mins:60, skills:['email-mgmt'], apps:['gmail','outlook'], keywords:'gmail outlook label folder filter rule archive search operators spam phishing',
  objectives:{ learn:['Find your way around Gmail and Outlook','Labels vs folders, archive vs delete','Filters/rules that sort mail automatically','Search operators and spotting phishing'], why:'Inbox management is the most-requested admin VA service.', where:'Every client with email — which is every client.', expect:'An inbox where nothing important is missed and the client sees only what needs them.' },
  tutorial:[
    { h:'Gmail vs Outlook in one minute', b: `<table><thead><tr><th></th><th>Gmail</th><th>Outlook</th></tr></thead><tbody><tr><td>Organize</td><td><b>Labels</b> (one email can have several)</td><td><b>Folders</b> (one place) + Categories (colour tags)</td></tr><tr><td>Auto-sort</td><td><b>Filters</b>: search box › ⚙ Show search options › Create filter</td><td><b>Rules</b>: Settings › Mail › Rules › Add new rule</td></tr><tr><td>Done with it</td><td><b>Archive</b> (out of inbox, still searchable)</td><td><b>Archive</b> button / Archive folder</td></tr><tr><td>Mark important</td><td>Star ⭐ / Important</td><td>Flag 🚩</td></tr></tbody></table>` + plain('Archive is your friend. Delete only spam and true junk.') },
    { h:'A simple label/folder system', b: `<div class="ftree">@Action — needs a reply or task\n@Waiting — waiting on someone else\n@Client-review — Angela must see\nCustomers\nSuppliers\nFinance\nReceipts</div>` + P('The "@" keeps action labels at the top. Agree the system with your client and write it in your SOP.') },
    { h:'Search like a pro', b: `<table><tbody><tr><td><code>from:luzcandle.example</code></td><td>emails from that sender/domain</td></tr><tr><td><code>subject:invoice</code></td><td>"invoice" in the subject</td></tr><tr><td><code>has:attachment</code></td><td>emails with attachments</td></tr><tr><td><code>older_than:30d</code> / <code>after:2026/11/01</code></td><td>by date (Gmail)</td></tr><tr><td><code>is:unread</code></td><td>unread only</td></tr></tbody></table>` + P('Outlook understands <code>from:</code>, <code>subject:</code>, <code>hasattachments:yes</code>, <code>received:</code>.') },
    { h:'Spotting phishing', b: UL(['<b>Check the real address</b>, not the display name: "Shopify Support" &lt;shopify-support@secure-shopify-verify.co&gt; is fake.','Urgency + threats ("suspended in 24 hours").','Requests for passwords, OTPs, gift cards or payment changes.','Links whose address doesn\'t match the company (hover to preview).','"Boss" emails from personal addresses asking for secret favours.']) + watch('Never click, reply or forward phishing to the client as a normal email. Report it (Gmail: ⋮ › Report phishing; Outlook: Report › Report phishing) and warn the client separately if it impersonates them.') },
    { h:'Daily inbox routine', b: `<ol class="steps"><li>Scan for urgent (deadlines today, upset customers, money).</li><li>Delete/report spam; archive newsletters.</li><li>Reply to what you can handle.</li><li>Label/flag what needs the client — with a short summary.</li><li>Send the client a 3-line inbox summary.</li></ol>` }
  ],
  demo:{ intro:'Creating a Gmail filter for supplier emails.', steps:[
    { d:'In the search box type: from:(luzcandle.example OR ribbonworld.example)', w:'Test the search first to see what it catches.' },
    { d:'Click the sliders icon › Create filter.', w:'The filter uses the same criteria.' },
    { d:'Choose: Apply the label "Suppliers" + Never send to Spam. Tick "Also apply to matching conversations".', w:'Sorts old and new emails.' },
    { d:'Outlook: Settings › Mail › Rules › Add new rule › From contains … › Move to folder "Suppliers".', w:'Same idea, Outlook wording.' } ] },
  guided:{ act:{ type:'inbox', owner:'Angela Ramos — Bloom & Basket', now:'Monday 7 December 2026, 8:30 AM (PHT)', facts: BB_FACTS, instructions:'Warm-up: sort these 6 emails. Draft replies where needed.', emails: [EMAILS[2], EMAILS[4], EMAILS[6], EMAILS[16], EMAILS[13], EMAILS[19]] }, hints:['First find anything with a deadline today, and anything suspicious.','Look at the real sender address of "Shopify Support". Payments and business decisions go to the client.','Urgent: Angela\'s numbers request and Paolo\'s address. Phishing: the "Shopify" email. Newsletter: archive. Price increase: flag for Angela.'] },
  practical:{ act: quiz([
    txt('Write a Gmail search for unread emails from anyone at luzcandle.example.', [/^(is:unread\s+from:\(?@?luzcandle\.example\)?|from:\(?@?luzcandle\.example\)?\s+is:unread)$/i], 'from:luzcandle.example is:unread', { show:'from:luzcandle.example is:unread' }),
    txt('Write a Gmail search for emails with attachments and "invoice" in the subject.', [/^(has:attachment\s+subject:\(?invoice\)?|subject:\(?invoice\)?\s+has:attachment)$/i], 'subject:invoice has:attachment', { show:'subject:invoice has:attachment' }),
    ord('Put the steps to create a Gmail filter in order.', ['Type the search criteria in the search box','Click the search options (sliders) icon','Click "Create filter"','Choose actions (apply label, skip inbox…)','Click "Create filter" to save'], 'Search → options → create → actions → save.'),
    mc('What is the difference between Archive and Delete in Gmail?', ['None','Archive removes from the inbox but keeps it searchable; Delete moves it to Trash (removed after 30 days)','Archive deletes permanently','Delete keeps it in the inbox'], 1, 'Archive is safe; deleted mail disappears after 30 days.'),
    mc('"PayPal Security" <security@paypa1-alerts.com> says your account is limited; click to restore. You…', ['Click and check','Report phishing and do not click','Forward to the client to click','Reply asking if it is real'], 1, 'paypa1 with a number 1 is fake.', { crit:[0,2], critMsg:'Clicked or passed on a phishing link.' }),
    multi('Which are phishing warning signs?', ['Display name and real address don\'t match','Asks for an OTP or password','Sent from the company\'s real domain about an order you placed','Threatens suspension within hours','Asks you to buy gift cards secretly'], [0,1,3,4], 'Real-domain order emails are normal; the others are red flags.'),
    mc('In Outlook, automatic sorting is set up with…', ['Labels','Rules','Stars','Snooze'], 1, 'Outlook calls them Rules.'),
    mc('Best label system starts with…', ['Hundreds of labels','A few action labels (@Action, @Waiting, @Client-review) plus a few topic labels','No labels','A label per sender'], 1, 'Simple and action-focused.')
  ], { shuffle:false }) },
  mastery:{ questions:[ mc('Gmail organizes with…', ['Folders only','Labels','Rules','Pins'], 1, 'Labels.'), mc('Search operator for attachments in Gmail?', ['has:attachment','file:yes','attach:true','with:file'], 0, 'has:attachment.'), mc('First thing to check on a suspicious email?', ['The logo','The real sender address','The font','The time'], 1, 'Display names can be faked.'), mc('Newsletters with no value should be…', ['Flagged','Archived/unsubscribed','Replied to','Forwarded'], 1, 'Archive/unsubscribe.'), mc('An email "from your client" on a personal Gmail asks for gift card codes. You…', ['Buy them','Verify through a known channel and report it','Reply with codes','Ignore forever without telling anyone'], 1, 'Verify + report + warn.', { crit:[0,2], critMsg:'Fell for an impersonation scam.' }) ] } });

L({ id:'l6b', level:6, title:'Writing professional emails', mins:65, skills:['email-writing','communication'], apps:['gmail','outlook'], keywords:'email writing subject line cc bcc attachment signature template follow up reminder confirmation status update schedule send',
  objectives:{ learn:['Subject lines that get read','A 4-part email structure','CC, BCC, attachments and signatures','Templates: confirmations, follow-ups, reminders, invitations, clarifications'], why:'Emails are your voice to clients and their customers.', where:'Every working day.', expect:'Short, clear emails that get the right action — never sloppy, never rude.' },
  tutorial:[
    { h:'Subject lines', b: UL(['Specific: "Confirmed: Viewing at 18 Oak St, Sat 12 Dec 10 AM"','Action words when you need something: "Action needed by Fri: approve holiday promo"','Keep the thread\'s subject when replying; start a new email for a new topic.']) },
    { h:'The 4-part structure', b: `<ol class="steps"><li><b>Greeting</b>: Hi Mark, / Dear Ms. Lim,</li><li><b>Purpose</b> in the first line</li><li><b>Details</b>: short paragraphs or bullets</li><li><b>Next step + sign-off</b>: what happens next, by when · Best regards, Name</li></ol>` + plain('If the reader only reads the first two lines, they should still know what you need.') },
    { h:'To, CC, BCC', b: UL(['<b>To</b>: people who must act.','<b>CC</b>: people who should know (visible to everyone).','<b>BCC</b>: hidden recipients — use for mass emails to protect addresses; never to secretly copy someone into a sensitive conversation.','<b>Reply all</b> only when everyone needs your reply.']) + watch('Emailing 50 customers with everyone in "To" exposes all their addresses — a privacy breach.') },
    { h:'Attachments, signatures, scheduling', b: UL(['Name attachments clearly; mention them in the text ("attached is…"). Attach BEFORE writing to avoid forgetting.','Signature: name, role, company, phone/website — set in Gmail ' + MP('Settings','See all settings','General','Signature') + ' / Outlook ' + MP('Settings','Mail','Compose and reply') + '.','Schedule send: Gmail arrow next to Send › Schedule send; Outlook ⌄ › Schedule send. Send during the recipient\'s working hours.']) },
    { h:'Ready-made templates', b: P('<b>Confirmation:</b> "This confirms your appointment on [day, date] at [time, time zone] at [place/link]. Please [prep]. If you need to reschedule, reply by [date]."<br><b>Follow-up:</b> "Following up on my email of [date] about [topic]. Could you [action] by [date]? Happy to help if anything is unclear."<br><b>Reminder:</b> "A friendly reminder that [thing] is due on [date]."<br><b>Clarification:</b> "To make sure I get this right: 1) … 2) … I\'ll proceed with [default] unless you prefer otherwise."') + P('Gmail: save templates via ' + MP('Settings','Advanced','Templates') + '; Outlook: ' + MP('My Templates') + ' or Quick Parts.') }
  ],
  demo:{ intro:'Writing an appointment confirmation.', steps:[
    { d:'Subject: Confirmed: Product shoot — Thu 10 Dec, 10:00 AM', w:'All key facts in the subject.' },
    { d:'"Hi Rico, thanks for the quick reschedule — Thursday 10 December at 10:00 AM works for Angela."', w:'Purpose first.' },
    { d:'"Location: our Mandaue warehouse, 45 Plaridel St. Parking is at the back."', w:'Details the reader needs.' },
    { d:'"If anything changes, just reply here. Best regards, [Name], Assistant to Angela Ramos"', w:'Next step and a clear signature.' } ] },
  guided:{ act: quiz([ mc('Best subject line?', ['Hello','Question','Action needed by Fri 11 Dec: approve December newsletter','URGENT!!!'], 2, 'Specific + action + deadline.'), mc('You email 40 customers about a holiday closure. Put their addresses in…', ['To','CC','BCC','Subject'], 2, 'BCC protects their privacy.', { crit:[0,1], critMsg:'Exposed customer email addresses to everyone.' }) ]), hints:['Could the reader act on the subject alone?','Think privacy: should customers see each other\'s emails?','Action subject line; BCC.'] },
  practical:{ act: wr({ parts:[
    { title:'Appointment confirmation', prompt:'Confirm Mr. Daniel Brooks\'s property viewing: 18 Oak Street, Saturday 12 December 2026 at 10:00 AM (Austin time). Bring photo ID. Write as Marco\'s assistant at Harbor Key Realty. Include a subject line on the first line ("Subject: …").', minWords:50, maxWords:160, rubric:[ { id:'subj', label:'Has a specific subject line', any:[/^subject:.{10,}/im] }, { auto:'greet' }, { id:'facts', label:'Correct date, time and address', all:[/(12 Dec|December 12)/i, /10(:00)? ?(AM|a\.m\.)/i, /18 Oak/i] }, { id:'id', label:'Mentions photo ID', any:[/photo ID|ID/i] }, { id:'next', label:'Explains how to reschedule or ask questions', any:[/reschedul|question|reply|call|let (me|us) know/i] }, { auto:'close' } ], model:'Subject: Confirmed: Viewing at 18 Oak Street — Sat 12 Dec, 10:00 AM\n\nHi Mr. Brooks,\n\nThis confirms your property viewing at 18 Oak Street on Saturday, 12 December 2026 at 10:00 AM (Austin time). Marco Uy will meet you at the front entrance.\n\nPlease bring a photo ID. Street parking is available.\n\nIf you need to reschedule, just reply to this email or call (512) 555-0198.\n\nBest regards,\n[Your name]\nAssistant to Marco Uy, Harbor Key Realty' },
    { title:'Polite follow-up', prompt:'On 1 December you emailed Teresa Go (the accountant) asking for the signed engagement letter. No reply yet. Angela needs it by Friday 11 December. Write a polite follow-up with a subject line.', minWords:40, maxWords:140, rubric:[ { id:'subj', label:'Subject line', any:[/^subject:.{8,}/im] }, { auto:'greet' }, { id:'ref', label:'References the earlier email/date', any:[/1 Dec|December 1|last week|earlier|previous/i] }, { id:'ask', label:'Clear ask with the Friday deadline', all:[/engagement letter/i, /(Friday|11 Dec|December 11)/i] }, { id:'kind', label:'Polite, not pushy (no guilt or caps)', none:[/still (have not|haven\'t)|as I said|again!|ASAP!/i] }, { auto:'close' } ], model:'Subject: Follow-up: signed engagement letter (needed by Fri 11 Dec)\n\nHi Teresa,\n\nI hope your week is going well. I\'m following up on my email of 1 December about the signed engagement letter. Could you send it by Friday, 11 December so Angela can finalize the setup?\n\nIf it\'s easier, I can resend the document. Thank you!\n\nBest regards,\n[Your name]' },
    { title:'Request for clarification', prompt:'Angela writes: "Please send the new price list to all our suppliers." There are two price lists in the shared drive (Retail 2027 and Wholesale 2027), and you are not sure whether "suppliers" means the 6 product suppliers or also the 2 courier companies. Write your reply to Angela.', minWords:40, maxWords:150, rubric:[ { auto:'greet' }, { id:'which', label:'Asks which price list (Retail or Wholesale)', all:[/retail/i, /wholesale/i] }, { id:'who', label:'Asks who counts as suppliers (couriers?)', any:[/courier/i] }, { id:'qs', label:'Questions are clear (2+ question marks or numbered)', minQ:2 }, { id:'default', label:'Offers a default or timing', any:[/I(\'ll| will)|unless|today|by \d|once you confirm/i] }, { auto:'close' } ], model:'Hi Angela,\n\nHappy to send it! Two quick checks first:\n1. Which list should go out — Retail 2027 or Wholesale 2027?\n2. Should I send it only to our 6 product suppliers, or also to the 2 courier companies?\n\nOnce you confirm, I\'ll send it within the hour (BCC, so suppliers don\'t see each other\'s addresses).\n\nThanks,\n[Your name]' } ] }) },
  portfolio:{ cat:'Email Management', title:'Professional Email Samples', shows:'Appointment confirmation, follow-up and clarification emails written to business standards.', skills:['Email writing','Tone','Clarity'] },
  mastery:{ questions:[ mc('Where should the main purpose of an email appear?', ['Last line','First line or two','Subject only','P.S.'], 1, 'Purpose first.'), mc('CC is for people who…', ['Must act','Should be informed','Must be hidden','Spam'], 1, 'Informed.'), mc('When to use Reply all?', ['Always','Only when everyone needs your reply','Never','For thanks'], 1, 'Only when needed.'), mc('Best time to send to a client in London from Manila?', ['Your 9 AM (their 1 AM)','Schedule send for their working hours','Midnight','Any time'], 1, 'Respect their hours.'), mc('You forgot the attachment. Best fix?', ['Send again with "Attached, sorry — here is the file" quickly','Ignore','Send 3 emails','Call'], 0, 'Quick, short correction.') ] } });

L({ id:'l6c', level:6, title:'Difficult customers, complaints & apologies', mins:50, skills:['customer-service','email-writing'], apps:['gmail','outlook'], keywords:'complaint angry customer apology de-escalate refund escalation',
  objectives:{ learn:['The LAST method: Listen, Apologize, Solve, Thank','Calming an angry customer in writing','What you can and cannot promise','When and how to escalate'], why:'How a complaint is handled decides whether the customer comes back — and what they post online.', where:'Customer support inboxes, reviews, chat.', expect:'Fast, calm, kind replies that solve the problem within your authority.' },
  tutorial:[
    { h:'The LAST method', b: `<table><tbody><tr><td><b>L</b>isten</td><td>Show you understood the actual problem (repeat the key facts).</td></tr><tr><td><b>A</b>pologize</td><td>Sincerely, for the experience — even if it was the courier\'s fault.</td></tr><tr><td><b>S</b>olve</td><td>Say exactly what happens next and by when.</td></tr><tr><td><b>T</b>hank</td><td>Thank them for telling you (and for photos/details).</td></tr></tbody></table>` },
    { h:'Words that calm vs words that inflame', b: P('✅ "I\'m sorry your gift arrived damaged — that\'s not the experience we want for you."<br>✅ "Here\'s what I\'m doing right now…"<br>❌ "Unfortunately that is our policy." ❌ "You should have…" ❌ "Calm down."') },
    { h:'Stay within your authority', b: UL(['Never promise refunds, discounts or compensation unless the client gave you written rules.','Say what you WILL do: "I\'m confirming the replacement or refund with our manager and will update you by 3 PM today."','Escalate to the client: threats of legal action, media/social posts, safety issues, abusive messages, anything above your limits.']) + watch('A promise you can\'t keep turns one complaint into two.') },
    { h:'Speed matters', b: P('Reply to complaints within a few business hours — even if it is only to acknowledge and give a time for the full answer.') }
  ],
  demo:{ intro:'Reply to: "Your courier was 3 days late and the cake was ruined. Terrible service!"', steps:[
    { d:'Listen: "I\'m so sorry — your order #BB-1060 arrived three days late and the cake was ruined."', w:'Repeat the facts so they feel heard.' },
    { d:'Apologize: "That\'s really disappointing, especially for a special occasion."', w:'Empathy without excuses.' },
    { d:'Solve: "I\'ve flagged this to our manager to arrange a refund or replacement, and I\'ll update you by 4 PM today."', w:'Concrete next step and time — no unauthorized promise.' },
    { d:'Thank: "Thank you for letting us know — it helps us fix this with the courier."', w:'End on a positive note.' } ] },
  guided:{ act: quiz([ mc('Best first sentence to an angry customer?', ['"As per our policy…"','"I\'m sorry your order arrived damaged — I understand how frustrating that is."','"That\'s the courier\'s fault."','"Please calm down."'], 1, 'Acknowledge and empathize first.'), mc('A customer demands a full refund. You have no refund authority. You say…', ['"Refund approved!"','"I\'m checking the best resolution with our manager and will update you by [time]."','"No refunds."','Ignore'], 1, 'Stay within authority, give a time.', { crit:[0], critMsg:'Promised a refund without authority.' }) ]), hints:['Lead with empathy.','You can promise ACTION and TIME, not money.','Empathy first; no unauthorized refund.'] },
  practical:{ act: wr({ title:'Respond to a complaint', prompt:'Write the reply to this customer for Bloom & Basket. Use the LAST method. You may NOT approve refunds — the owner decides. Facts: the owner usually replies within the same day.', ctx:'Subject: Worst experience ever\n\nI paid ₱3,200 for a Christmas gift box (order #BB-1066) that was supposed to arrive Friday. It came today, Monday, with the ribbon crushed and one soap missing. I\'m posting a review about this. I want my money back.\n— Ramon Cruz', minWords:80, maxWords:220,
    rubric:[ { auto:'greet' }, { id:'listen', label:'Repeats the key facts (late, crushed ribbon, missing soap, order #BB-1066)', all:[/BB-1066/, /(late|Friday|delay)/i, /(soap|missing)/i] }, { id:'sorry', label:'Sincere apology', any:[/(sorry|apolog)/i] }, { id:'solve', label:'Concrete next step with a time (e.g. "by 5 PM today")', any:[/(today|by \d|within|tomorrow|this afternoon)/i] }, { id:'auth', label:'Does NOT promise a refund itself', none:[/(refund (has been|is|was|will be) (processed|approved|issued|sent)|we will refund you|I (have|\'ve) (processed|approved|issued))/i], crit:true, critMsg:'Promised a refund without authority.', why:'Only the owner can approve refunds.', fix:'Say you are arranging the best resolution with the owner and give a time.' }, { id:'calm', label:'No defensiveness or blaming ("policy", "courier\'s fault")', none:[/(our policy|not our fault|courier\'s fault|you should have)/i] }, { id:'thanks', label:'Thanks the customer', any:[/thank/i] }, { auto:'close' } ],
    model:'Hi Ramon,\n\nI\'m very sorry. Your gift box (order #BB-1066) should have arrived on Friday, and instead it came today with the ribbon crushed and one soap missing. That\'s not what you paid for, especially for a Christmas gift.\n\nI\'ve already sent the details to our owner, Angela, so we can make this right — either a replacement or a refund — and I will update you with her decision by 5 PM today.\n\nThank you for telling us directly; it helps us fix this with our courier.\n\nBest regards,\n[Your name]\nBloom & Basket Customer Care' }) },
  portfolio:{ cat:'Email Management', title:'Customer Complaint Response', shows:'De-escalating a complaint with the LAST method while staying within authority.', skills:['Customer service','Empathy','Professional writing'] },
  mastery:{ questions:[ mc('LAST stands for…', ['Look, Ask, Send, Track','Listen, Apologize, Solve, Thank','Log, Archive, Sort, Tag','Late, Angry, Sad, Tired'], 1, 'Listen, Apologize, Solve, Thank.'), mc('Customer threatens legal action. You…', ['Argue','Escalate to the client promptly','Ignore','Offer money'], 1, 'Escalate.'), mc('Which phrase inflames?', ['"Here\'s what I\'m doing now"','"That\'s our policy, nothing I can do"','"Thank you for letting us know"','"I\'m sorry"'], 1, 'Policy-hiding sounds dismissive.'), mc('How fast should a complaint get a first reply?', ['Within days','Within a few business hours','Next week','Never'], 1, 'Fast acknowledgement.'), mc('You can promise…', ['Refunds','Discounts','An action and a time for an update','Free products'], 2, 'Action + time.') ] } });

L({ id:'l6d', level:6, title:'Inbox management simulation (20 emails)', mins:90, skills:['email-mgmt','email-writing','priorities'], apps:['gmail','outlook'], keywords:'inbox simulation triage categorize urgency flag reply',
  objectives:{ learn:['Triage a real-looking inbox end to end','Decide category, urgency and action for each email','Draft replies that use only the facts you have','Flag only what truly needs the client'], why:'This is what clients actually hire you for — and a common hiring test.', where:'Daily inbox management.', expect:'Nothing urgent missed, no scam clicked, no unauthorized promise, replies ready to send.' },
  tutorial:[
    { h:'How to approach 20 emails', b: `<ol class="steps"><li><b>Skim all subjects first</b> (2 minutes). Spot deadlines, upset customers, money, scams.</li><li>Handle scams and newsletters fast.</li><li>Do the urgent replies.</li><li>Draft the rest; flag what needs the client with a one-line summary.</li></ol>` + plain('Speed comes from deciding once per email: Do it, Delegate (flag), Defer (schedule), or Delete/archive.') },
    { h:'Urgency guide', b: `<table><tbody><tr><td><b>Urgent — today</b></td><td>Deadline today/tomorrow morning, upset customer, money/suspension, something ships today</td></tr><tr><td><b>Soon — this week</b></td><td>Has a deadline in a few days, needs a reply but not instantly</td></tr><tr><td><b>Low</b></td><td>No deadline, nice to reply</td></tr><tr><td><b>None</b></td><td>No action: newsletters, spam</td></tr></tbody></table>` },
    { h:'Flag rules', b: UL(['Flag: decisions about money, staff, prices, approvals, schedule changes for the owner, impersonation attempts.','Don\'t flag: things you fully handled, routine replies, newsletters.']) + watch('If you flag everything, the client stops trusting your flags.') }
  ],
  demo:{ intro:'Three quick triage decisions.', steps:[
    { d:'"Where is my order #BB-1042?" — birthday Wednesday → Customer · Urgent · Reply now (check courier, promise update time).', w:'Deadline + upset customer.' },
    { d:'"Store will be suspended — verify now" from secure-shopify-verify.co → Spam/phishing · None · Report phishing.', w:'Fake domain, threat, urgency.' },
    { d:'Internet "FINAL NOTICE" from the real billing domain, suspension 9 Dec → Finance · Urgent · Flag to client.', w:'Real bill, client pays.' } ] },
  guided:{ act:{ type:'inbox', owner:INBOX_MAIN.owner, now:INBOX_MAIN.now, facts:BB_FACTS, instructions:'Practice set of 8 emails. Use the business facts for replies.', emails:[EMAILS[0], EMAILS[3], EMAILS[5], EMAILS[7], EMAILS[8], EMAILS[11], EMAILS[15], EMAILS[18]] }, hints:['Spot the two scams first: check sender addresses and what they ask for.','Money, staffing and refunds → the client decides (flag). Missing details → request info.','Scams: GCash prize, "Angela" on Gmail. Flag: internet bill, Jessa sick, broken jar. Request info: bulk order. Schedule: supplier call invite.'] },
  practical:{ act: INBOX_MAIN },
  portfolio:{ cat:'Email Management', title:'Inbox Management Simulation (20 emails)', shows:'Triage of a 20-email business inbox: categories, urgency, actions, flags and drafted replies, including phishing detection.', skills:['Inbox triage','Prioritization','Phishing awareness','Email writing'] },
  mastery:{ questions:[ mc('First pass through a full inbox should be…', ['Reply to the first email in detail','Skim every subject to spot urgent items and scams','Delete everything old','Flag all'], 1, 'Skim first.'), mc('A supplier asks to confirm a delivery for a PO the client already approved. You…', ['Flag to client','Confirm and add it to the calendar','Ignore','Report phishing'], 1, 'Within your role.'), mc('Bulk order inquiry with no date or address →', ['Quote anyway','Request missing info in one message','Ignore','Flag'], 1, 'Ask once, clearly.'), mc('A customer emails an address correction for an order shipping today →', ['Archive','Reply now and update the order immediately','Next week','Flag only'], 1, 'Urgent fix.'), mc('Which needs the client\'s personal attention?', ['A newsletter','A staff member out sick with orders due','A thank-you note','A confirmed invite'], 1, 'Staffing decision.') ] } });

/* ================= LEVEL 7: CALENDAR ================= */
const CAL_G = { type:'calendar', owner:'Priya Nair — Northline Consulting, London', tzLabel:'London time (GMT, UTC+0)', off:0, days:['Mon 7 Dec','Tue 8 Dec','Wed 9 Dec','Thu 10 Dec','Fri 11 Dec'], start:8, end:18,
  tzNote:'This week: London = UTC+0 (GMT). Manila = UTC+8 — 8 hours AHEAD of London.',
  events:[ { id:'g1', title:'Team meeting', day:0, s:'09:30', e:'10:30' }, { id:'g2', title:'Gym (personal)', day:1, s:'08:00', e:'09:00' }, { id:'g3', title:'Client lunch', day:2, s:'13:00', e:'14:00' }, { id:'g4', title:'Workshop', day:3, s:'09:00', e:'12:00' } ],

L({ id:'l7a', level:7, title:'Calendar basics: events, reminders, recurring events & invitations', mins:50, skills:['calendar'], apps:['gcal','outlook'], keywords:'google calendar outlook event reminder recurring invitation meeting link availability',

L({ id:'l7b', level:7, title:'Time zones for international clients', mins:50, skills:['timezones'], apps:['gcal','outlook'], keywords:'time zone utc gmt est pst aest daylight saving conversion',
  objectives:{ learn:['UTC offsets and how to convert','Daylight saving time (DST) traps','Writing times so nobody gets confused','Calendar time-zone settings'], why:'Most VA clients are in another country. A one-hour mistake means a missed meeting.', where:'Scheduling, deadlines ("EOD"), sending emails at the right time.', expect:'Every time written with its zone, and zero conversion mistakes.' },
  tutorial:[
    { h:'UTC: the reference clock', b: plain('UTC is the world\'s reference time. Every place is UTC plus or minus some hours.') + `<table><thead><tr><th>Place</th><th>Standard</th><th>When DST is on</th></tr></thead><tbody><tr><td>Manila (PHT)</td><td>UTC+8</td><td>no DST</td></tr><tr><td>London (GMT/BST)</td><td>UTC+0</td><td>UTC+1 (late Mar–late Oct)</td></tr><tr><td>New York (EST/EDT)</td><td>UTC−5</td><td>UTC−4 (Mar–Nov)</td></tr><tr><td>Austin/Chicago (CST/CDT)</td><td>UTC−6</td><td>UTC−5 (Mar–Nov)</td></tr><tr><td>Denver (MST/MDT)</td><td>UTC−7</td><td>UTC−6 (Mar–Nov)</td></tr><tr><td>Los Angeles (PST/PDT)</td><td>UTC−8</td><td>UTC−7 (Mar–Nov)</td></tr><tr><td>Sydney (AEST/AEDT)</td><td>UTC+10</td><td>UTC+11 (Oct–Apr)</td></tr></tbody></table>` + P('Exact DST change dates differ by country and year — always double-check with a tool like timeanddate.com or your calendar.') },
    { h:'How to convert (3 steps)', b: `<ol class="steps"><li>Find both offsets <b>for that date</b> (DST!).</li><li>Difference = their offset − your offset.</li><li>Add the difference to your time (cross midnight → change the day).</li></ol>` + P('Example: 9:00 PM Manila (UTC+8) on Tue → New York in December (UTC−5): difference −13 h → 8:00 AM Tue New York.') },
    { h:'Write times clearly', b: UL(['Always add the zone: "Thu 10 Dec, 3:00 PM PHT / 2:00 AM EST".','For two parties, show both times.','"EOD" — ask whose end of day.','Avoid ambiguous dates like 04/05 — write "4 May" or "April 5".']) },
    { h:'Calendar settings', b: UL(['Google Calendar: ' + MP('Settings','Time zone') + '; add a secondary time zone to see two clocks side by side.','Outlook: ' + MP('Settings','Calendar','View','Time zones') + ' — add an additional time zone.','When creating an event, you can set the event\'s own time zone.']) }
  ],
  demo:{ intro:'Client in Austin wants a call at 9:00 AM their time on Wednesday 9 Dec. What time is it in Manila?', steps:[
    { d:'Austin in December = CST = UTC−6 (US DST ended in November).', w:'Check DST for the date.' },
    { d:'Manila = UTC+8. Difference = +14 hours.', w:'Their offset minus your offset.' },
    { d:'9:00 AM Wed + 14 h = 11:00 PM Wed Manila.', w:'Same day here, late evening.' },
    { d:'Write: "Wed 9 Dec — 9:00 AM CST (Austin) / 11:00 PM PHT (Manila)".', w:'Both times, no confusion.' } ] },
  guided:{ act: quiz([ txt('It is 10:00 AM in London (UTC+0) in December. What time is it in Manila (UTC+8)? Answer like 6:00 PM.', [/^6(:00)?\s*pm$/i, /^18:00$/], '10:00 + 8 h = 6:00 PM.', { show:'6:00 PM' }), mc('Sydney in December is UTC+11 because…', ['It always is','Australian daylight saving time is on (AEDT)','A mistake','Winter time'], 1, 'Southern hemisphere summer = DST.') ]), hints:['Add the difference in offsets.','Manila is 8 hours ahead of London.','6:00 PM; Sydney is on summer time in December.'] },
  practical:{ act: quiz([
    txt('Client in New York (UTC−5, December) wants a call at 8:00 PM Manila time (UTC+8) on Thursday. What time and day is that in New York? Answer like "7:00 AM Thursday".', [/^7(:00)?\s*am\s*(thu(rsday)?)?$/i], '8:00 PM − 13 h = 7:00 AM Thursday.', { show:'7:00 AM Thursday' }),
    txt('A Sydney client (UTC+11, December) asks for 9:00 AM Monday Sydney time. What is that in Manila (UTC+8)? Answer like "6:00 AM Monday".', [/^6(:00)?\s*am\s*(mon(day)?)?$/i], 'Sydney is 3 h ahead: 9 AM − 3 h = 6 AM Monday Manila.', { show:'6:00 AM Monday' }),
    txt('Austin client (UTC−6, December) deadline: "EOD Friday" = 5:00 PM Friday Austin. In Manila (UTC+8) that is…? Answer like "7:00 AM Saturday".', [/^7(:00)?\s*am\s*(sat(urday)?)?$/i], '+14 h → 7:00 AM Saturday Manila.', { show:'7:00 AM Saturday' }),
    mc('A London client in JULY (BST, UTC+1). 3:00 PM London = ? Manila (UTC+8).', ['10:00 PM','11:00 PM','9:00 PM','8:00 AM'], 0, '+7 h in summer (not +8).'),
    mc('Best way to write a meeting time for a client in Denver and a contractor in Manila?', ['"Tomorrow at 9"','"Tue 8 Dec, 9:00 AM MST (Denver) / 12:00 AM Wed PHT (Manila)"','"9 AM my time"','"Morning"'], 1, 'Both zones, day included.'),
    mc('Which tool feature helps you see your client\'s time all day?', ['Secondary time zone in calendar settings','Dark mode','Labels','Snooze'], 0, 'Show two time zones.'),
    mc('Your Los Angeles client (UTC−8 in Dec) wants weekly calls inside your 9 AM–6 PM Manila hours (UTC+8). Which LA time works?', ['9:00 AM LA','5:00 PM LA','1:00 PM LA','11:00 AM LA'], 1, '5 PM LA = 9 AM next day Manila (+16 h).')
  ], { shuffle:false }) },
  mastery:{ questions:[ mc('Manila\'s offset?', ['UTC+8','UTC+7','UTC−8','UTC+9'], 0, 'UTC+8, no DST.'), mc('First step in any conversion?', ['Guess','Check both offsets for that specific date','Ask Google "time"','Use last month\'s offset'], 1, 'DST changes offsets.'), mc('Client says "EOD". You…', ['Assume your EOD','Ask whose end of day (and confirm time + zone)','Ignore','Do it tomorrow'], 1, 'Confirm.'), mc('New York in summer is…', ['UTC−5','UTC−4','UTC−6','UTC+4'], 1, 'EDT = UTC−4.'), mc('04/05/2027 is risky because…', ['It is too short','US reads April 5, many countries read 4 May','It is a weekend','No reason'], 1, 'Write the month name.') ] } });

L({ id:'l7c', level:7, title:'Conflicts & full scheduling simulation', mins:75, skills:['calendar','timezones','communication'], apps:['gcal','outlook'], keywords:'calendar conflict double booking reschedule simulation',
  objectives:{ learn:['Spot and resolve conflicts','Decide what can move and what cannot','Combine time-zone and availability constraints','Explain changes and options to the client'], why:'Real scheduling is a puzzle: fixed events, movable ones, other people\'s time zones.', where:'Executive assistance, real estate, sales teams.', expect:'A clash-free week, a clear note of what changed, and options for anything impossible.' },
  tutorial:[
    { h:'Fixed vs movable', b: UL(['<b>Fixed</b>: medical appointments, open houses, client-set times, travel.','<b>Movable</b>: internal calls, flexible check-ins — but only within the other person\'s stated availability.','When something must give, move the most flexible item and tell everyone affected.']) },
    { h:'Resolving a conflict', b: `<ol class="steps"><li>List every constraint (days, earliest/latest, time zones, buffers, protected time).</li><li>Find all slots that satisfy them.</li><li>If none: can a movable event shift? If still none: flag with 2–3 options.</li><li>Update invites and notify people.</li></ol>` },
    { h:'The note to your client', b: P('"Hi Marco — this week is set. Changes: I moved the Brooks call to Thu 2 PM (he\'s free Thu afternoons) so the contractor could come Wed 2–3:30. I couldn\'t fit the board call: Friday 3–5 is the open house. Options: Fri 1:00 PM, Thu 3:30 PM, or Mon 14 Dec 3 PM — which do you prefer?"') }
  ],
  demo:{ intro:'The contractor can only come Wed 2:00–3:30, but the Brooks call is Wed 2–3.', steps:[
    { d:'Contractor = fixed (only slot). Brooks = movable (any Wed/Thu afternoon).', w:'Move the flexible one.' },
    { d:'Free Wed/Thu afternoon slots for Brooks: Wed 3:30 PM, Thu 1–6 PM (except other bookings).', w:'Check his rule.' },
    { d:'Move Brooks to Thu 2:00 PM; book contractor Wed 2:00–3:30.', w:'Both satisfied.' },
    { d:'Tell Marco and send Brooks the updated invite.', w:'Never move silently.' } ] },
  guided:{ act: quiz([ mc('Which should move first in a conflict?', ['The doctor\'s appointment','The open house','A flexible internal call','The client-set closing meeting'], 2, 'Move the most flexible.'), mc('Sydney (UTC+11) contact free 8 AM–6 PM their time. Client is in Austin (UTC−6). Which Austin time works?', ['9:00 AM','3:00 PM','11:00 AM','1:00 PM'], 1, 'Austin 3 PM = Sydney 8 AM next day (+17 h).') ]), hints:['What has the most flexibility?','Sydney is 17 hours ahead of Austin in December.','Flexible call; 3 PM Austin.'] },
  practical:{ act: CAL_MAIN },
  portfolio:{ cat:'Calendar Management', title:'Weekly Business Calendar — Conflict Resolution', shows:'Scheduling six requests across three time zones, moving a flexible meeting, and flagging an impossible request with options.', skills:['Calendar management','Time zones','Problem-solving','Client communication'] },
  mastery:{ questions:[ mc('A request is impossible this week. You…', ['Force it in','Flag it with 2–3 alternative options','Ignore it','Cancel something fixed'], 1, 'Flag with options.'), mc('After moving a meeting you must…', ['Do nothing','Update the invite and notify the client and attendees','Delete the old one silently','Email only yourself'], 1, 'Notify.'), mc('Protected lunch 12–1. A request fits only at 12:30. You…', ['Book it','Offer other options or ask the client','Book and apologize later','Ignore'], 1, 'Respect protected time.'), mc('Double-booking means…', ['Two events overlapping for the same person','Two calendars','Two reminders','Recurring'], 0, 'Overlap.'), mc('Best place to record why you moved something?', ['Nowhere','In your note to the client (and the event description)','A sticky note','Social media'], 1, 'Communicate.') ] } });

/* ================= LEVEL 8: RESEARCH ================= */
L({ id:'l8a', level:8, title:'Search skills & judging sources', mins:55, skills:['research'], keywords:'google search operators site filetype quotes source reliability verify outdated',
  objectives:{ learn:['Search operators that find exactly what you need','How to judge if a source is reliable','How to verify business information','How to spot outdated information'], why:'Clients trust your research to make decisions. Wrong or invented info is worse than none.', where:'Supplier lists, lead lists, price comparisons, competitor research.', expect:'Accurate, current, verifiable information — with sources.' },
  tutorial:[
    { h:'Search operators', b: `<table><tbody><tr><td><code>"office chairs"</code></td><td>exact phrase</td></tr><tr><td><code>site:dti.gov.ph</code></td><td>only that website</td></tr><tr><td><code>catering -wedding</code></td><td>exclude a word</td></tr><tr><td><code>filetype:pdf price list</code></td><td>only PDFs</td></tr><tr><td><code>courier (Cebu OR Mandaue)</code></td><td>either word</td></tr><tr><td><code>intitle:"price list"</code></td><td>words in the page title</td></tr></tbody></table>` + P('Also use Google\'s <b>Tools › Any time › Past year</b> to filter out old results.') },
    { h:'Is this source reliable? (CRAP test)', b: `<table><tbody><tr><td><b>C</b>urrent</td><td>When was it updated? Prices/contacts older than a year are suspect.</td></tr><tr><td><b>R</b>eliable</td><td>Official website, government registry, the company\'s own profile beat random directories.</td></tr><tr><td><b>A</b>uthority</td><td>Who wrote it? Do they know?</td></tr><tr><td><b>P</b>urpose</td><td>Is it selling something or an ad disguised as advice?</td></tr></tbody></table>` },
    { h:'Verifying a business', b: UL(['Official website (and its Contact page)','Google Business Profile / Maps — recent reviews and photos','Active social pages (recent posts = still operating)','Government registries where relevant (e.g. DTI/SEC in the Philippines, state business search in the US)','When in doubt: call or email to confirm']) + watch('Directory sites often show closed businesses and old numbers. Cross-check with at least one primary source.') },
    { h:'Never invent', b: plain('If you can\'t find something (a price, an email), write "Not listed — requested via contact form" — never guess or make it up.') + P('Record the <b>source URL</b> and the <b>date you checked</b> for every row. That is what makes research trustworthy.') }
  ],
  demo:{ intro:'Finding office-furniture suppliers that deliver to Cebu.', steps:[
    { d:'Search: "office furniture" supplier Cebu -used', w:'Exact phrase + location + exclusion.' },
    { d:'Open a result — check the website footer for address, phone, last update.', w:'Primary source.' },
    { d:'Check Google Maps: reviews from last month, photos of the showroom.', w:'Still operating.' },
    { d:'Prices not listed → note "Quote on request", record source URL + today\'s date.', w:'Honest gaps are fine; guesses are not.' } ] },
  guided:{ act: quiz([ txt('Write a search for PDF price lists for printing services.', [/^filetype:pdf\s+(printing( services)?|"printing services")\s+"?price list"?$/i, /^"?price list"?\s+(printing( services)?|"printing services")\s+filetype:pdf$/i, /^(printing( services)?|"printing services")\s+"?price list"?\s+filetype:pdf$/i, /filetype:pdf/i], 'Example: printing services "price list" filetype:pdf', { show:'printing services "price list" filetype:pdf' }), mc('Which source is most reliable for a company\'s current phone number?', ['A 2019 directory listing','The company\'s official website contact page','A forum comment','A random blog'], 1, 'Primary, official sources first.') ]), hints:['filetype: limits results to a file type.','Official pages beat third-party lists.','Use filetype:pdf; official website.'] },
  practical:{ act: quiz([
    mc('You find a supplier\'s phone on a directory last updated 2021. The official site shows a different number. Which do you record?', ['The directory number','The official website number (with its URL and today\'s date)','Both without saying which','Neither'], 1, 'Official and current wins; cite it.'),
    mc('A competitor\'s price is not online anywhere. You…', ['Estimate a price','Write "Not published — quote on request" and note how to get it','Use last year\'s price from memory','Skip the competitor'], 1, 'Never invent data.', { crit:[0,2], critMsg:'Recorded invented information.' }),
    multi('Signs a business may be closed or outdated?', ['Last social post 3 years ago','Recent Google reviews','Website copyright 2018 and broken links','"Permanently closed" on Maps','Active online store with new products'], [0,2,3], 'Old posts, stale site and "closed" labels are red flags.'),
    txt('Search only government websites in the Philippines (gov.ph) for "business permit requirements".', [/site:gov\.ph/i], 'site:gov.ph "business permit requirements"', { show:'site:gov.ph "business permit requirements"' }),
    mc('A "Top 10 best couriers" article is written by one of the couriers in the list. Using the CRAP test, the problem is…', ['Currency','Purpose (it is promotional)','Length','Font'], 1, 'Biased purpose.'),
    mc('For every row of research you should record…', ['Only the company name','The source URL and the date you checked','Your opinion','Nothing'], 1, 'Source + date = verifiable.')
  ], { shuffle:false }) },
  mastery:{ questions:[ mc('Operator for an exact phrase?', ['Quotes " "','site:','-','OR'], 0, 'Quotes.'), mc('Exclude "wedding" from catering results:', ['catering -wedding','catering NOT wedding only','catering wedding-','catering ~wedding'], 0, 'Minus sign.'), mc('Most important research rule?', ['Be fast','Never invent information; cite sources','Use one source','Copy directories'], 1, 'Accuracy and honesty.'), mc('Filter Google results to the last year:', ['Tools › Any time › Past year','Settings › Language','Images tab','News tab only'], 0, 'Tools menu.'), mc('Verify a business is still operating:', ['Recent reviews/posts and an official site','An old directory','A 2015 article','A guess'], 0, 'Recent signals.') ] } });

const RESEARCH_HEAD = ['Company','Website','Phone','Email','City','Products/Services','Source URL','Date checked','Notes'];
L({ id:'l8b', level:8, title:'Research assignment: build a verified supplier list', mins:150, skills:['research','xl-data'], keywords:'research supplier list leads organize spreadsheet sources verify',
  objectives:{ learn:['Plan a research task','Collect consistent fields for each result','Record sources and dates','Deliver an organized, verified spreadsheet'], why:'Supplier and lead lists are among the most common paid VA research tasks.', where:'Procurement, sales lead generation, event planning.', expect:'Real, current, verifiable entries — and honest gaps marked clearly.' },
  tutorial:[
    { h:'Plan before you search', b: UL(['Define the fields (columns) first.','Define "qualified": e.g. must deliver to the city, must have a working phone.','Set a time box (e.g. 2 hours for 20 suppliers) and report if it will take longer.']) },
    { h:'Collect consistently', b: UL(['Same format in every row (phone formats, city names).','One supplier per row; no merged cells.','Notes column for useful context ("minimum order 50 pcs").','Mark gaps honestly: "Not listed".']) },
    { h:'Verify', b: UL(['Open every source link yourself.','Prefer official websites, Google Business Profiles, official social pages.','Remove duplicates (same company listed twice under different names).']) + watch('Copying a directory without checking — or using AI to "generate" suppliers — produces fake or closed businesses. Clients find out fast.') }
  ],

    { d:'Copy: company name (as on the site), website, phone, email, city, products.', w:'Fields in the agreed order.' },
    { d:'Source URL = the exact page where you found the details. Date checked = today.', w:'Anyone can re-verify.' },
    { d:'Email not listed → "Not listed — contact form only" in Notes; leave Email blank or write "Not listed".', w:'Honest gap.' } ] },
  guided:{ act: quiz([ ord('Order the research workflow.', ['Agree the fields and criteria with the client','Search with operators and open official sources','Record each supplier with source URL and date checked','Remove duplicates and check formats','Spot-check 3 entries again and send with a short summary'], 'Plan → search → record → clean → verify → deliver.') ]), hints:['Start with what the client wants.','Verification comes before sending.','Plan, search, record, clean, verify & send.'] },
  practical:{ act:{ type:'upload', kind:'xlsx', title:'Verified supplier list (real research)', attest:'I personally opened every source link, and every row is real, current information I found — nothing is invented, guessed or AI-generated.',
    get brief(){ return `Hi! I'm opening a small café and need suppliers. Please research <b>20 real suppliers</b> (coffee beans, packaging/cups, bakery ingredients or kitchen equipment) that serve <b>${esc(S().settings.researchLocation || 'your city')}</b>.\n\nDeliver an Excel/Sheets file with a sheet named <b>Suppliers</b> and these columns exactly:\n<b>${RESEARCH_HEAD.join(' | ')}</b>\n\nRules: real businesses only, one per row, Source URL = the page you used, Date checked = the day you verified it. If something isn't published, write "Not listed" — don't guess. (You can change the research location in Settings.)`; }, from:'Training client — Kapehan Café (fictional)',
    deliver:['Sheet "Suppliers" with the 9 exact columns','20+ rows, no duplicates','Every row has a working-looking Source URL (https://)','Date checked = real recent dates','Gaps marked "Not listed", nothing invented'],
    check: async (m, seed, W) => { const sh = W.sheet('Suppliers'); if (!sh) return [chk(false, 'Sheet named "Suppliers" exists', { crit:true })]; const hdr = W.header(sh); const rows = W.dataRows(sh); const items = [];
      items.push(chk(RESEARCH_HEAD.every((h, i) => (hdr.cols[i] || '').toLowerCase() === h.toLowerCase()), 'Columns exactly as requested', { detail:'Found: ' + esc(hdr.cols.filter(Boolean).join(' | ')), tag:'research' }));
      items.push(chk(rows.length >= 20, `At least 20 suppliers (${rows.length} found)`, { tag:'research' }));
      const v = (r, c) => { const x = sh.ws[XL.addr(c, r)]; return x ? String(x.w ?? x.v).trim() : ''; }; const raw = (r, c) => { const x = sh.ws[XL.addr(c, r)]; return x ? x : null; };
      const names = rows.map(r => v(r, 0).toLowerCase().replace(/[^a-z0-9]/g, '')); const dupN = names.filter((n, i) => n && names.indexOf(n) !== i);
      items.push(chk(!dupN.length, 'No duplicate companies', { detail: dupN.length ? dupN.length + ' duplicate(s)' : '', tag:'research' }));
      const urls = rows.map(r => v(r, 6)); const badU = urls.filter(u => !/^https?:\/\/[^\s/]+\.[^\s]+/i.test(u));
      items.push(chk(!badU.length, 'Every row has a Source URL starting with http(s)://', { detail: badU.length + ' row(s) missing or malformed', why:'Without a source, nobody can check the information.', tag:'research' }));
      const fake = rows.filter(r => /example\.(com|org)|lorem|test\.com|sample/i.test(v(r, 1) + v(r, 6) + v(r, 3)) || /123-?4567|000-?0000|555-?55-?55/.test(v(r, 2)));
      items.push(chk(!fake.length, 'No placeholder or fake-looking data', { detail: fake.length + ' suspicious row(s) (example.com, 123-4567, lorem…)', crit: fake.length > 0, why:'Fabricated research is the most serious research failure.', tag:'research' }));
      const now = Date.now(); const badD = rows.filter(r => { const c = raw(r, 7); if (!c || typeof c.v !== 'number') return true; const ms = (c.v - 25569) * 864e5; return ms > now + 2 * 864e5 || ms < now - 45 * 864e5; });
      items.push(chk(!badD.length, 'Date checked is a real date within the last ~6 weeks', { detail: badD.length + ' row(s) with missing, text or old dates', fix:'Type dates like ' + todayISO() + ' so they are real dates.', tag:'research' }));
      const blanks = rows.filter(r => [0, 1, 2, 4, 5].some(c => !v(r, c)));
      items.push(chk(!blanks.length, 'Company, Website, Phone, City and Products filled (or "Not listed")', { detail: blanks.length + ' row(s) with blanks', tag:'research' }));
      return items; },
    aiRubric:[{ id:'consistency', label:'Entries are consistent, relevant to a café, and look like genuine businesses (AI cannot verify links — it only reviews plausibility)' }] } },
  portfolio:{ cat:'Research Projects', title:'Verified Supplier List (20 suppliers)', shows:'Real-world supplier research with consistent fields, source URLs and verification dates.', skills:['Online research','Source verification','Spreadsheet organization'] },
  mastery:{ questions:[ mc('A supplier\'s email is not published. You…', ['Guess info@company.com','Write "Not listed" and note the contact form','Leave the row out silently','Use a personal email you found on a forum'], 1, 'Honest gaps.', { crit:[0], critMsg:'Guessed contact data.' }), mc('Why record the date checked?', ['Decoration','Information changes; the date shows how current it is','Excel needs it','No reason'], 1, 'Currency.'), mc('Research is taking twice the estimated time. You…', ['Keep going silently','Tell the client: progress so far, revised estimate, ask whether to continue','Stop','Make up the rest'], 1, 'Communicate.'), mc('Two rows: "ABC Packaging Corp." and "ABC Packaging" with the same phone. They are…', ['Different companies','Likely duplicates — merge','Both wrong','Fine as is'], 1, 'Same business.'), mc('Can AI chatbots be used to generate supplier lists?', ['Yes, just paste them in','Only as a starting idea; every entry must be verified from real sources — AI often invents businesses','Always reliable','Never think about it'], 1, 'Verify everything.') ] } });

L({ id:'l8c', level:8, title:'Comparing providers & writing a research report', mins:120, skills:['research','word'], keywords:'comparison report criteria recommendation sources competitor',

  practical:{ act:{ type:'upload', kind:'docx', title:'Provider comparison report (real research)', attest:'All facts, prices and sources in my report are real and checked by me — nothing invented.',
    get brief(){ return `Hi! Please compare <b>three real options</b> for ONE of these and recommend one:\n• courier/delivery services serving ${esc(S().settings.researchLocation || 'your city')}, or\n• online invoicing/accounting tools for a very small business, or\n• video-meeting tools for a 5-person team.\n\nReport (.docx) with: title + date, Summary/Recommendation, Criteria, a comparison <b>table</b>, Recommendation with reasons and caveats, and a <b>Sources</b> section with at least 3 links and the dates you accessed them. 300–900 words. Use Heading styles.`; }, from:'Training client (fictional)',
    deliver:['Heading styles','Comparison table','Recommendation section','Sources with 3+ links and access dates','300–900 words'],
    check: async m => { const urls = (m.text.match(/https?:\/\/\S+/g) || []).length; return [ ...docChecks(m, { headings:4, table:true, words:[300, 900], fonts:3, must:[ [/recommend/i, 'Recommendation section'], [/criteria/i, 'Criteria section'], [/sources|references/i, 'Sources section'], [/accessed|checked|retrieved/i, 'Access dates for sources'] ] }), chk(urls >= 3 || (m.links || 0) >= 3, `At least 3 source links (${Math.max(urls, m.links || 0)} found)`, { why:'Sources make your claims checkable.', fix:'Paste the full URLs or insert hyperlinks (Ctrl+K).', tag:'research' }) ]; },
    aiRubric:[{ id:'reasoned', label:'Recommendation follows logically from the criteria and the comparison' }, { id:'facts', label:'Facts and opinions are separated; caveats are honest' }], aiTask:'Provider comparison research report' } },
  portfolio:{ cat:'Research Projects', title:'Provider Comparison Report', shows:'A sourced comparison of three real providers with criteria, table and a reasoned recommendation.', skills:['Research','Analysis','Report writing','Source citation'] },
  mastery:{ questions:[ mc('Insert a hyperlink in Word:', ['Ctrl+K','Ctrl+H','Ctrl+L','Ctrl+P'], 0, 'Ctrl+K.'), mc('A good recommendation includes…', ['Only the winner','The choice, the reasons, and honest caveats','A guess','All options equally'], 1, 'Reasons + caveats.'), mc('Prices in your report should include…', ['Nothing else','The date checked and a note to confirm before buying','Rounded guesses','Old prices'], 1, 'Prices change.'), mc('Criteria should be…', ['Different per option','The same for every option','Secret','Unlimited'], 1, 'Fair comparison.'), mc('Sources section lists…', ['Your feelings','Titles, links and access dates','Only Wikipedia','Nothing'], 1, 'Verifiable.') ] } });

L({ id:'l10a', level:10, title:'Customer communication: inquiries, follow-ups & records', mins:55, skills:['customer-service','email-writing'], keywords:'customer inquiry follow up response template record interaction',
  objectives:{ learn:['Answer inquiries quickly and completely','Follow up without being pushy','Use templates without sounding robotic','Record every interaction'], why:'Customers judge the whole business by response speed and clarity.', where:'Shops, real estate, clinics, agencies.', expect:'Fast, accurate, friendly replies — and a record of every conversation.' },
  tutorial:[
    { h:'Answering an inquiry', b: `<ol class="steps"><li>Thank them and use their name.</li><li>Answer every question they asked (re-read their message).</li><li>Add the one next step (book a call, link, form).</li><li>Sign off with your name and the business.</li></ol>` + watch('The #1 complaint about support: "They didn\'t answer my actual question."') },
