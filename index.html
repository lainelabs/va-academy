<title>VA Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>/*
VOICE: a calm, exacting training supervisor — plain words, short chunks, no fluff.
IDEA: an office training binder clipped to a desk — a navy cover spine (sidebar) and clean white work sheets.
PICTURE: the working tools themselves (inbox, grid, calendar, board) are the picture on each screen.
COLOUR and TYPE: deep sea navy ground for the spine, white sheets, sky blue for progress, signal pink for "fix this". Hanken Grotesk.
LAYOUT: fixed spine left, sheet column right (max 1180px); stacks below 900px with a top menu button.
*/
:root{color-scheme:light dark;
--navy:#0a2540;--navy2:#123a5f;--sky:#8fd3ff;--sky2:#2b8ed1;--pink:#ff5c8a;--pinkd:#c8285a;--green:#1f9d6a;--amber:#b7791f;
--bg:light-dark(#ffffff,#06182a);--sheet:light-dark(#ffffff,#0b2238);--soft:light-dark(#f3f6f9,#0f2a44);--line:light-dark(#dfe5ec,#1d3b58);
--ink:light-dark(#0b1a2b,#e9f1f8);--mute:light-dark(#526375,#9fb3c6);--link:light-dark(#1769aa,#8fd3ff);
--okbg:light-dark(#e6f6ef,#0f3326);--badbg:light-dark(#ffe8ef,#3a1424);--warnbg:light-dark(#fff4dc,#3a2c10);--infobg:light-dark(#e8f5ff,#0f2f4a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.15;margin:0 0 .5em;text-wrap:balance}
h1{font-size:clamp(28px,3.4vw,40px);font-weight:600;letter-spacing:-.01em}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0 0 .8em}
small,.mute{color:var(--mute)}
code,kbd{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.92em}
code{background:var(--soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--sheet)}
pre{overflow-x:auto;background:var(--soft);padding:12px;border-radius:8px}

/* layout */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#dce9f5;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 30px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;color:#fff;text-decoration:none}
.brand b{font-size:17px;letter-spacing:.01em}.brand span{display:block;font-size:12px;color:var(--sky)}
.navgrp{font-size:12px;color:#8aa4bd;margin:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#dce9f5;text-decoration:none;font-size:15px;min-height:40px}
.nav a:hover{background:#ffffff14}
.nav a.on{background:var(--sky);color:var(--navy);font-weight:600}
.nav a svg{flex:none;width:18px;height:18px}
.main{display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:10px clamp(14px,3vw,32px);background:var(--bg);border-bottom:1px solid var(--line)}
.top .menu{display:none}
.search{position:relative;flex:1;max-width:460px}
.search input,.search input[type=search]{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:16px}
.search svg{position:absolute;left:10px;top:11px;width:18px;height:18px;color:var(--mute)}
.sres{position:absolute;top:44px;left:0;right:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px #0003;max-height:60vh;overflow:auto;z-index:30}
.sres a{display:block;padding:9px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.sres a:hover{background:var(--soft)}
.sync{font-size:13px;color:var(--mute);white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:6px}
.sync.ok i{background:var(--green)}
.view{padding:clamp(16px,3vw,36px);max-width:1180px;width:100%}
@media(max-width:560px){.top .sync{display:none}#mentorBtn span{display:none}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:280px;z-index:50;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none;box-shadow:0 0 0 100vmax #0007}.top .menu{display:inline-flex}.sync span{display:none}}

/* bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--sky2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme=dark] .btn.pri,.btn.pri.sky{background:var(--sky);border-color:var(--sky);color:var(--navy)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy)}}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
:focus-visible{outline:3px solid var(--sky2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.soft{background:var(--soft)}
.card h3{margin-bottom:.35em}
.band{background:var(--navy);color:#fff;border-radius:16px;padding:clamp(18px,3vw,30px);margin-bottom:20px;position:relative;overflow:hidden}
.band h1{color:#fff}.band p{color:#cfe0ee}
.band .mute{color:#9fbad2}
.band .btn{background:#fff;color:var(--navy);border-color:#fff}
.band .btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--green)}
.tag.bad{background:var(--badbg);color:var(--pinkd)}
.tag.warn{background:var(--warnbg);color:var(--amber)}
.tag.info{background:var(--infobg);color:var(--sky2)}
:root[data-theme=dark] .tag.bad{color:#ff8fae}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sky2);border-radius:99px}
.bar.pk>i{background:var(--pink)}.bar.gr>i{background:var(--green)}
.kpi{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{font-size:14px;font-weight:500}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:13px;color:var(--mute)}
.note{border-radius:10px;padding:12px 14px;background:var(--infobg);margin:10px 0;font-size:15px}
.note.ok{background:var(--okbg)}.note.bad{background:var(--badbg)}.note.warn{background:var(--warnbg)}
.note b:first-child{display:block;margin-bottom:2px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.lock{opacity:.55}
.hr{height:1px;background:var(--line);margin:18px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
input[type=text],input[type=number],input[type=email],input[type=date],input[type=time],input[type=url],input[type=search],select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--sheet);font-size:16px;min-height:42px;width:100%}
textarea{min-height:140px;line-height:1.5;resize:vertical}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--sky2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--sheet);cursor:pointer;font-size:14px;min-height:36px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.menu-path{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:14px}
.menu-path b{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-weight:600}
.menu-path i{font-style:normal;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--sky2)}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}

/* lesson player */
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:6px 0 18px}
.stepper button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;min-height:36px}
.stepper button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--soft);font-size:12px}
.stepper button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.stepper button.on b{background:var(--sky);color:var(--navy)}
.stepper button.done b{background:var(--green);color:#fff}
.tut{display:grid;gap:14px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--sheet)}
.tcard h3{display:flex;gap:10px;align-items:baseline}
.tcard h3 em{font-style:normal;font-size:13px;color:var(--sky2);font-weight:700}
.plain{background:var(--infobg);border-radius:10px;padding:10px 14px;margin:10px 0}
.plain b{color:var(--sky2)}
.watch{background:var(--badbg);border-radius:10px;padding:10px 14px;margin:10px 0}
.steps{margin:8px 0;padding-left:22px}.steps li{margin:5px 0}
.demo-step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.demo-step>b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px}
.demo-step .why{font-size:14px;color:var(--mute);margin-top:4px}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.hintbox{background:var(--warnbg);border-radius:10px;padding:10px 14px;margin:6px 0;font-size:15px}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

/* quiz */
.q{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--sheet)}
.q .ctx{background:var(--soft);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--sky2)}
.opt.sel{border-color:var(--navy);background:var(--infobg)}
.opt.right{border-color:var(--green);background:var(--okbg)}
.opt.wrong{border-color:var(--pink);background:var(--badbg)}
.order li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--sheet)}
.order li span{flex:1}
.order{list-style:none;padding:0;margin:8px 0}

/* report */
.report .item{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.report .item>i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:#fff;background:var(--green)}
.report .item.no>i{background:var(--pink)}
.report .item.crit>i{background:#8b0f33}
.report .det{font-size:14.5px;margin-top:4px}
.report .det p{margin:3px 0}
.score-ring{display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:22px;background:conic-gradient(var(--c,var(--sky2)) calc(var(--p)*1%),var(--soft) 0)}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--sheet);display:grid;place-items:center}

/* spreadsheet */
.xl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sheet)}
.xl-bar{display:flex;gap:6px;align-items:center;padding:6px;border-bottom:1px solid var(--line);background:var(--soft)}
.xl-bar .nb{width:70px;text-align:center;font-family:ui-monospace,Consolas,monospace;font-size:14px;min-height:34px;padding:4px}
.xl-bar .fx{font-style:italic;color:var(--mute);font-weight:700;padding:0 4px}
.xl-bar input.fb{flex:1;font-family:ui-monospace,Consolas,monospace;font-size:15px;min-height:34px;padding:4px 8px}
.xl-wrap{overflow:auto;max-height:440px}
.xl table{border-collapse:separate;border-spacing:0;font-size:14px;width:auto;font-variant-numeric:tabular-nums}
.xl th,.xl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:28px;min-width:86px;max-width:220px}
.xl th{background:var(--soft);text-align:center;font-weight:600;color:var(--mute);font-size:12.5px;position:sticky;top:0;z-index:2}
.xl td.rh{background:var(--soft);text-align:center;min-width:38px;color:var(--mute);font-size:12.5px;position:sticky;left:0;z-index:1}
.xl td.c{padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell}
.xl td.c.num{text-align:right}
.xl td.c.hd{font-weight:700;background:light-dark(#eef4fa,#122f4b)}
.xl td.c.task{background:light-dark(#fff8e1,#3a3010)}
.xl td.c.sel{outline:2px solid var(--sky2);outline-offset:-2px}
.xl td.c.rng{background:light-dark(#dcefff,#16406a)}
.xl td.c.err{color:var(--pinkd)}
.xl td.c.edit{padding:0}
.xl td.c.edit input{width:100%;height:27px;border:0;border-radius:0;padding:2px 5px;font-family:ui-monospace,Consolas,monospace;font-size:14px;min-height:0;outline:2px solid var(--sky2)}
.xl-tabs{display:flex;gap:2px;padding:4px 6px;border-top:1px solid var(--line);background:var(--soft);font-size:13px}
.xl-tabs span{padding:3px 10px;background:var(--sheet);border-radius:0 0 6px 6px;font-weight:600}

/* inbox */
.inbox{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:560px;background:var(--sheet)}
.ilist{border-right:1px solid var(--line);overflow-y:auto;max-height:720px}
.imail{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:2px}
.imail:hover{background:var(--soft)}
.imail.on{background:var(--infobg)}
.imail .fr{display:flex;gap:6px;font-size:14px}
.imail .fr b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imail .sub{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imail .pv{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imail.unread .sub{font-weight:700}
.iread{padding:16px 18px;overflow-y:auto;max-height:720px}
.iread .hdr{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.iread .body{white-space:pre-wrap;font-size:15px;line-height:1.6}
.iact{background:var(--soft);border-radius:12px;padding:14px;margin-top:16px;display:grid;gap:10px}
@media(max-width:760px){.inbox{grid-template-columns:1fr}.ilist{max-height:260px;border-right:0;border-bottom:1px solid var(--line)}}

/* calendar */
.cal{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet);font-size:12.5px}
.cal .ch{background:var(--soft);padding:6px;text-align:center;font-weight:700;border-bottom:1px solid var(--line);font-size:13px}
.cal .tcol{position:relative;border-right:1px solid var(--line)}
.cal .tcol div{position:absolute;right:4px;font-size:11px;color:var(--mute);transform:translateY(-6px)}
.cal .dcol{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 40px}
.cal .ev{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 5px;overflow:hidden;font-size:12px;line-height:1.25;border-left:4px solid var(--navy);background:var(--infobg);color:var(--ink)}
.cal .ev.mine{border-color:var(--pink);background:var(--badbg)}
.cal .ev.clash{outline:2px solid var(--pink)}
.cal .ev b{display:block;font-size:12px}

/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--soft);border-radius:12px;padding:10px;min-height:240px}
.kcol h4{font-size:14px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.kcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px;cursor:pointer}
.kcard:hover{border-color:var(--sky2)}
.kcard .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.kcol.drop{outline:2px dashed var(--sky2)}

/* files */
.fs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px}
@media(max-width:860px){.fs{grid-template-columns:1fr}}
.frow{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) 34px;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.frow select,.frow input{min-height:36px;padding:5px 8px;font-size:14px}
.frow .fn{font-family:ui-monospace,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}
@media(max-width:700px){.frow{grid-template-columns:28px minmax(0,1fr) 34px}.frow select,.frow input{grid-column:2/4}}
.ftree{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--soft);border-radius:10px;padding:12px;white-space:pre-wrap}

/* proof */
.proof{line-height:2.1;font-size:16px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px}
.proof span.w{cursor:pointer;border-radius:4px;padding:1px 1px}
.proof span.w:hover{background:var(--soft)}
.proof span.w.on{background:var(--warnbg);text-decoration:underline wavy var(--pink)}
.proof span.w.hit{background:var(--okbg)}
.proof span.w.miss{background:var(--badbg)}

/* modal / toast / drawer */
.modal-bg{position:fixed;inset:0;background:#0009;z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--sheet);border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #0006}
.modal.wide{max-width:980px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;z-index:90;font-size:15px;box-shadow:0 8px 24px #0004;max-width:90vw}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--sheet);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;box-shadow:-10px 0 40px #0003;transform:translateX(105%);transition:transform .2s}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--navy);color:#fff}
.drawer header b{flex:1}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:12px;max-width:92%;white-space:pre-wrap;font-size:15px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff}
.msg.ai{align-self:flex-start;background:var(--soft)}
.chatin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chatin textarea{min-height:46px;height:46px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--soft)}
.timer.low{background:var(--badbg);color:var(--pinkd)}
.thread .cm{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--sheet)}
.thread .cm.client{border-left:4px solid var(--navy)}
.thread .cm.me{border-left:4px solid var(--sky2);background:var(--soft)}
.thread .cm .who{font-size:13px;color:var(--mute);margin-bottom:6px}
.thread .cm .body{white-space:pre-wrap}
.sched td{font-size:14px}
.lvl{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.lvl .num{width:48px;height:48px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.lvl.done .num{background:var(--green)}
.lvl.locked .num{background:var(--soft);color:var(--mute)}
.lrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);border:1px solid transparent}
.lrow:hover{border-color:var(--line);background:var(--soft)}
.lrow .t{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.p{background:var(--sky2)}.dot.ok{background:var(--green)}.dot.bad{background:var(--pink)}

function toast(msg, ms=2800){ $$('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function modal({title, body, actions=[{label:'Close'}], wide=false, onOpen}){
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className='modal-bg';
    bg.innerHTML = `<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><div class="mbody">${body}</div><div class="row" style="justify-content:flex-end;margin-top:18px">${actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(bg);
    const close = v => { bg.remove(); resolve(v); };
    bg.addEventListener('click', e => { if (e.target === bg) close(null); const b = e.target.closest('[data-i]'); if (b){ const a = actions[+b.dataset.i]; const v = a.value !== undefined ? a.value : a.label; if (a.collect) close(a.collect(bg)); else close(v); } });
    if (onOpen) onOpen(bg);
  });
}

/* ---------- Persistence ---------- */
const DEFAULT_STATE = () => ({
  v:1, updatedAt:0,
  profile:{ name:'', started: Date.now() },

const Store = {
  state: DEFAULT_STATE(), uid:null, ref:null, db:null, mode:'local', writing:false, pending:false, portfolio:[],
  loadLocal(){ try { const s = localStorage.getItem('vaa-state'); if (s) this.state = Object.assign(DEFAULT_STATE(), JSON.parse(s)); const p = localStorage.getItem('vaa-pf'); if (p) this.portfolio = JSON.parse(p); } catch(e){} },
  base:'',
  async init(){
    this.loadLocal();
    try {
      if (window.claude && window.claude.use){
        const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
        if (user && db){ const id = await user.id(); if (id){ this.backend = 'claude'; await this.attach(db, id, 'data/users/' + id); } }
      } else if (window.VAA_FIREBASE && window.VAA_FIREBASE.apiKey && !/PASTE/.test(window.VAA_FIREBASE.apiKey)){ this.backend = 'firebase'; await Fire.init(); }
    } catch(e){ this.mode = 'local'; }

  },
  /* connect to a document store (Claude db or Firestore) and merge with local progress */
  async attach(db, uid, base){
    this.uid = uid; this.db = db; this.base = base; this.ref = db.doc(base + '/progress');
    const snap = await this.ref.get();
    if (snap.exists){ const d = snap.data(); if (d && d.state && (d.updatedAt||0) > (this.state.updatedAt||0)) { try { this.state = Object.assign(DEFAULT_STATE(), JSON.parse(d.state)); localStorage.setItem('vaa-state', d.state); } catch(e){} } }
    const col = await db.collection(base).get();
    const pf = col.docs.filter(d => d.id.startsWith('pf-')).map(d => d.data()).filter(Boolean);
    if (pf.length || !this.portfolio.length) this.portfolio = pf.map(x => Object.assign({}, x)).sort((a,b)=>(b.updated||0)-(a.updated||0));
    else for (const p of this.portfolio) this.savePf(p);
    this.mode = 'cloud';
    if (!snap.exists || (snap.data() || {}).updatedAt < this.state.updatedAt) this.flush();
  },
  detach(){ this.uid = null; this.db = null; this.ref = null; this.base = ''; this.mode = 'local'; Shell.sync(); },
  save(){ this.state.updatedAt = Date.now(); try { localStorage.setItem('vaa-state', JSON.stringify(this.state)); } catch(e){} this.flushSoon(); },
  flushSoon: null,
  async flush(){
    if (!this.ref) return;
    if (this.writing){ this.pending = true; return; }
    this.writing = true;
    try { await this.ref.set({ state: JSON.stringify(this.state), updatedAt: this.state.updatedAt }); this.mode='cloud'; }
    catch(e){
      if (e && (e.code === 'invalid_argument' || e.code === 'quota_exceeded') && !this.trimmed){ this.trimmed = true; const st = this.state; st.history = st.history.slice(0, 80); st.career.interviews = (st.career.interviews || []).slice(-10); for (const k in st.sim) if (st.sim[k].log) st.sim[k].log = st.sim[k].log.slice(-12); for (const k in st.acts) st.acts[k].attempts = st.acts[k].attempts.slice(-8); this.writing = false; return this.flush(); }
      if (e && e.code === 'quota_exceeded') toast('Your saved progress is too large. Clear old history in Settings.'); this.mode = 'local'; }
    this.writing = false; Shell.sync();
    if (this.pending){ this.pending = false; this.flush(); }
  },
  async savePf(item){
    item.updated = Date.now();
    const i = this.portfolio.findIndex(p => p.id === item.id); if (i >= 0) this.portfolio[i] = item; else this.portfolio.unshift(item);
    try { localStorage.setItem('vaa-pf', JSON.stringify(this.portfolio)); } catch(e){}
    if (this.db && this.uid){ try { await this.db.doc(this.base + '/' + item.id).set(item); } catch(e){ toast(e && e.code==='invalid_argument' ? 'That item is too large to save (attachments must be small).' : 'Portfolio item saved on this device only.'); } }
  },
  async delPf(id){
    this.portfolio = this.portfolio.filter(p => p.id !== id);
    try { localStorage.setItem('vaa-pf', JSON.stringify(this.portfolio)); } catch(e){}
    if (this.db && this.uid){ try { await this.db.doc(this.base + '/' + id).delete(); } catch(e){} }
  }
};

TASK GIVEN TO THE TRAINEE:
${task}
${context ? 'CONTEXT:\n' + context : ''}
RUBRIC (score each 0-4; 4 = what a demanding client would accept without edits, 3 = minor fixes, 2 = noticeable problems, 1 = poor, 0 = missing):
${rubric.map(r => '- ' + r.id + ': ' + r.label).join('\n')}
TRAINEE ANSWER:
"""${answer}"""
Rules: Do not invent facts about the trainee. If the answer makes up information the task did not give (prices, dates, names, promises), lower "accuracy" or the closest criterion and say so. In "improved", rewrite only the weakest part as an example (max 80 words) — do NOT rewrite the whole answer.

/* Minimal .docx writer (paragraph list) using JSZip */
async function makeDocx(paras){
  const JSZip = await Lib.load('jszip'); const z = new JSZip();
  const x = s => esc(s);

/* ---------- Progress, skills, mistakes ---------- */
const PASS = 85;
const Progress = {
  act(key){ return S().acts[key] || null; },
  record(key, result, meta={}){
    const st = S(); const a = st.acts[key] || (st.acts[key] = { attempts:[], best:0, passed:false });
    const pass = result.score >= PASS && !(result.critical && result.critical.length);
    result.pass = pass;
    a.attempts.push({ s: Math.round(result.score), p: pass, ts: Date.now(), d: Math.round((result.dur||0)/1000), c: (result.critical||[]).length, h: meta.hints||0 });
    if (a.attempts.length > 20) a.attempts = a.attempts.slice(-20);
    a.best = Math.max(a.best, Math.round(result.score)); if (pass) a.passed = true;
    const cut = (x, n) => String(x || '').slice(0, n);
    a.last = { s: Math.round(result.score), p: pass, items: (result.items||[]).filter(i=>!i.ok).slice(0,8).map(i=>({label:cut(i.label,160), why:cut(i.why,260), fix:cut(i.fix,260)})) };
    a.skills = meta.skills || a.skills || [];
    a.ctx = meta.ctx || a.ctx || 'lesson';
    for (const it of (result.items||[])){
      if (!it.ok && it.tag){ const m = st.mistakes[it.tag] || (st.mistakes[it.tag] = { label: it.label, why: it.why||'', fix: it.fix||'', count:0, route: meta.route||'' , fixed:0}); m.count++; m.last = Date.now(); m.label = it.mistake || it.label; if (it.why) m.why = it.why; if (it.fix) m.fix = it.fix; if (meta.route) m.route = meta.route; m.fixed = 0; }
      else if (it.ok && it.tag && st.mistakes[it.tag]){ st.mistakes[it.tag].fixed = (st.mistakes[it.tag].fixed||0) + 1; }
    }
    st.history.unshift({ ts: Date.now(), k: key, l: meta.label || key, s: Math.round(result.score), p: pass, t: meta.kind || 'practical' });
    if (st.history.length > 250) st.history.length = 250;
    Store.save();
    return pass;
  },
  lesson(id){ return S().lessons[id] || (S().lessons[id] = { visited:[], stage:0 }); },
  lessonState(id){
    const L = S().lessons[id]; const pr = S().acts[id + ':practical'], ms = S().acts[id + ':mastery'];
    if (pr && pr.passed && ms && ms.passed) return 'passed';
    if (pr && pr.attempts.length && !pr.passed && pr.attempts[pr.attempts.length-1].s < PASS) return 'needs';
    if (ms && ms.attempts.length && !ms.passed) return 'needs';
    if (pr || ms || (L && L.visited && L.visited.length > 1)) return 'progress';
    if (L && L.visited && L.visited.length) return 'started';
    return 'new';
  },
  levelLessons(n){ return VA.lessons.filter(l => l.level === n); },
  levelDone(n){ const ls = this.levelLessons(n); return ls.length > 0 && ls.every(l => this.lessonState(l.id) === 'passed'); },
  levelOpen(n){ if (n <= 1) return true; return this.levelDone(n - 1); },
  passedCount(){ return VA.lessons.filter(l => this.lessonState(l.id) === 'passed').length; },
  skillState(sk){
    const ls = VA.lessons.filter(l => (l.skills||[]).includes(sk.id));
    if (!ls.length) return 'not started';
    const st = ls.map(l => this.lessonState(l.id));
    if (st.every(s => s === 'new')) return 'not started';
    const anyNeeds = st.includes('needs');
    const recurring = Object.entries(S().mistakes).some(([t, m]) => (sk.tags||[]).includes(t) && m.count >= 2 && !(m.fixed >= 2));
    if (st.every(s => s === 'passed')){
      const applied = Object.values(S().acts).some(a => a.passed && a.ctx !== 'lesson' && (a.skills||[]).includes(sk.id));
      if (recurring) return 'needs improvement';
      return applied ? 'mastered' : 'competent';
    }
    if (anyNeeds || recurring) return 'needs improvement';
    const anyTried = ls.some(l => S().acts[l.id + ':practical'] || S().acts[l.id + ':guided']);
    return anyTried ? 'practicing' : 'learning';
  },
  allAttempts(filter){ const out = []; for (const [k, a] of Object.entries(S().acts)) if (!filter || filter(k, a)) for (const t of a.attempts) out.push(Object.assign({k}, t)); return out; }
};

function startTimer(el, seconds, onEnd){
  const end = Date.now() + seconds*1000; let done = false;

function ring(p){ const c = p >= PASS ? 'var(--green)' : p >= 60 ? 'var(--amber)' : 'var(--pink)'; return `<div class="ring" style="--p:${clamp(p,0,100)};--c:${c}"><span>${Math.round(p)}</span></div>`; }
function renderReport(result, {title='Evaluation', retry, next, extra=''}={}){

/* AI review block for written work. Returns {html, score} or null */
async function aiReviewBlock(task, rubric, answer, context){
  if (!AI.ok()) return null;
  try {
    const g = await AI.grade({task, context, rubric, answer});
    const crit = (g.criteria||[]);
    const avg = crit.length ? crit.reduce((s,c)=>s+(+c.score||0),0) / (crit.length*4) * 100 : 0;
    const html = `<div class="card soft" style="margin-top:12px"><div class="row"><b>${icon('spark')} AI supervisor review</b><span class="tag info">${Math.round(avg)}%</span><span class="mute" style="font-size:13px">AI feedback can be wrong. Use it as a second opinion.</span></div>
      <table style="margin-top:8px"><tbody>${crit.map(c=>`<tr><td style="width:40%">${esc((rubric.find(r=>r.id===c.id)||{label:c.id}).label)}</td><td class="n" style="width:60px">${esc(c.score)}/4</td><td>${esc(c.comment)}</td></tr>`).join('')}</tbody></table>
      ${(g.strengths||[]).length?`<p style="margin-top:8px"><b>Strengths:</b> ${g.strengths.map(esc).join(' · ')}</p>`:''}
      ${(g.fixes||[]).length?`<p><b>Fix next:</b> ${g.fixes.map(esc).join(' · ')}</p>`:''}
      ${g.improved?`<div class="note"><b>Example rewrite of your weakest part</b>${esc(g.improved)}</div>`:''}</div>`;
    return { html, score: avg, criteria: crit };
  } catch(e){ return null; }
}

    else if (act.shuffle !== false) qs = shuffle(qs, r);

    qs.forEach((q, i) => { if (q.t === 'order') orders[i] = shuffle(q.o.map((_, j) => j), r); });
    const optOrder = qs.map(q => (q.t === 'mc' || q.t === 'multi' || !q.t) && act.shuffleOpts !== false && !q.fixed ? shuffle(q.o.map((_, j) => j), r) : (q.o||[]).map((_, j) => j));
    const draw = () => {
      el.innerHTML = `${act.intro ? `<p>${act.intro}</p>` : ''}${qs.map((q, i) => this.qHTML(q, i, optOrder[i], orders[i])).join('')}<div class="row"><button class="btn pri" data-sub>Submit answers</button><span class="mute" style="font-size:14px">${qs.length} question${qs.length>1?'s':''} · pass mark ${PASS}%</span></div><div data-out></div>`;
    };
    draw();
    el.addEventListener('click', e => {
      const o = e.target.closest('.opt'); if (o && !el.dataset.done){ const qi = +o.dataset.q, q = qs[qi];
        if (q.t === 'multi'){ o.classList.toggle('sel'); o.querySelector('input').checked = o.classList.contains('sel'); }
        else { $$(`.opt[data-q="${qi}"]`, el).forEach(x => { x.classList.remove('sel'); x.querySelector('input').checked = false; }); o.classList.add('sel'); o.querySelector('input').checked = true; } return; }
      const mv = e.target.closest('[data-mv]'); if (mv && !el.dataset.done){ const qi = +mv.dataset.q, idx = +mv.dataset.i, d = +mv.dataset.mv; const ord = orders[qi]; const j = idx + d; if (j < 0 || j >= ord.length) return; [ord[idx], ord[j]] = [ord[j], ord[idx]]; const ul = $(`ol[data-ord="${qi}"]`, el); ul.outerHTML = this.orderHTML(qs[qi], qi, ord); return; }
      if (e.target.closest('[data-sub]') && !el.dataset.done){
        const unanswered = qs.map((q,i)=>i).filter(i => { const q = qs[i]; if (q.t === 'order') return false; if (q.t === 'text') return !($(`[data-tq="${i}"]`, el).value.trim()); return !$(`.opt.sel[data-q="${i}"]`, el); });
        if (unanswered.length){ toast('Answer every question first (' + unanswered.length + ' left).'); return; }
        el.dataset.done = '1'; this.grade(el, act, ctx, qs, optOrder, orders, t0);
      }
    });
  },
  qHTML(q, i, oo, ord){
    const head = `<div class="row" style="justify-content:space-between"><b>${i+1}. ${q.q}</b>${q.t==='order'?'<span class="tag info">Put in order</span>':q.t==='multi'?'<span class="tag info">Choose all that apply</span>':''}</div>${q.ctx?`<div class="ctx">${q.ctx}</div>`:''}`;
    let body = '';
    if (q.t === 'order') body = this.orderHTML(q, i, ord);
    else if (q.t === 'text') body = `<input type="text" data-tq="${i}" placeholder="${esc(q.ph||'Type your answer')}" style="margin-top:8px">`;
    else body = oo.map(j => `<label class="opt" data-q="${i}" data-j="${j}"><input type="${q.t==='multi'?'checkbox':'radio'}" name="q${i}" tabindex="-1"><span>${q.o[j]}</span></label>`).join('');
    return `<div class="q" data-qi="${i}">${head}${body}<div class="qfb"></div></div>`;
  },
  orderHTML(q, i, ord){ return `<ol class="order" data-ord="${i}">${ord.map((j, k) => `<li><b>${k+1}</b><span>${q.o[j]}</span><button class="btn sm" data-mv="-1" data-q="${i}" data-i="${k}" aria-label="Move up">↑</button><button class="btn sm" data-mv="1" data-q="${i}" data-i="${k}" aria-label="Move down">↓</button></li>`).join('')}</ol>`; },
  grade(el, act, ctx, qs, optOrder, orders, t0){
    let pts = 0; const items = [], critical = [];
    qs.forEach((q, i) => {
      const box = $(`.q[data-qi="${i}"]`, el); let got = 0, yours = '', right = '';
      if (q.t === 'order'){
        const ord = orders[i]; const pos = ord.filter((j, k) => j === k).length; got = pos === ord.length ? 1 : pos / ord.length * 0.6;
        yours = ord.map(j => q.o[j]).join(' → '); right = q.o.join(' → ');
      } else if (q.t === 'text'){
        const v = $(`[data-tq="${i}"]`, el).value.trim(); yours = esc(v);
        const norm = s => s.toLowerCase().replace(/\s+/g, '').replace(/[;]/g, ',');
        got = (q.a || []).some(a => a instanceof RegExp ? a.test(v) : norm(a) === norm(v)) ? 1 : 0;
        right = esc((q.a||[]).filter(a => !(a instanceof RegExp))[0] || q.show || '');
      } else {
        const sel = $$(`.opt.sel[data-q="${i}"]`, el).map(o => +o.dataset.j);
        const ans = Array.isArray(q.a) ? q.a : [q.a];
        if (q.t === 'multi'){ const c = sel.filter(j => ans.includes(j)).length, w = sel.filter(j => !ans.includes(j)).length; got = Math.max(0, (c - w) / ans.length); if (got < 1) got = Math.min(got, 0.5); }
        else got = ans.includes(sel[0]) ? 1 : 0;
        $$(`.opt[data-q="${i}"]`, el).forEach(o => { const j = +o.dataset.j; if (ans.includes(j)) o.classList.add('right'); else if (sel.includes(j)) o.classList.add('wrong'); });
        yours = sel.map(j => q.o[j]).join('; '); right = ans.map(j => q.o[j]).join('; ');
        if (q.crit && sel.some(j => q.crit.includes(j))) critical.push(q.critMsg || 'A choice in question ' + (i+1) + ' would put a client or their data at serious risk.');
      }
      pts += got;
      box.querySelector('.qfb').innerHTML = `<div class="note ${got>=1?'ok':'bad'}" style="margin-bottom:0"><b>${got>=1?'Correct':'Not quite'}${got>0&&got<1?' (partial credit)':''}</b>${got<1&&q.t!=='mc'&&q.t?`<div>Correct answer: ${right}</div>`:''}${q.why||''}</div>`;
      items.push({ ok: got >= 1, label: String(q.q).replace(/<[^>]+>/g,'').slice(0, 120), detail: got < 1 ? `<p>Your answer: ${yours || '—'}</p><p>Correct: ${right}</p>` : '', why: got < 1 ? (q.why||'') : '', fix: got < 1 ? (q.fix||'') : '', impact: got < 1 ? (q.impact||'') : '', tag: q.tag, crit: q.crit && critical.length && got < 1 && q.t !== 'multi' ? true : false });
    });
    const score = pts / qs.length * 100;
    const res = { score, items, critical, dur: Date.now() - t0, summary: `You answered ${items.filter(i=>i.ok).length} of ${qs.length} fully correct.` };
    ctx.onResult(res, el.querySelector('[data-out]'));
  }
};

/* ===== Engine: written response with rubric (auto checks + optional AI review) ===== */
const AUTO = {
  greet: { re:/^\s*(hi|hello|dear|good (morning|afternoon|evening)|greetings)\b/i, label:'Opens with a professional greeting', why:'A greeting sets a polite tone before you get to business.', fix:'Start with "Hi [Name]," or "Dear [Name]," on its own line.' },
  close: { re:/(regards|thank you|thanks|sincerely|best|cheers|warmly)[,.!]?\s*(\n|$)/i, label:'Ends with a sign-off', why:'A sign-off tells the reader the message is complete and who it is from.', fix:'End with "Best regards," then your name on the next line.' },
  noCaps: { test: s => !/\b(?!(PDF|CRM|SOP|KPI|ASAP|FAQ|PHP|USD|AUD|GBP|AM|PM|ETA|ID|URL|VA|CEO|HR|IT|UK|US|OK|EOD|EST|PST|CST|GMT|UTC|AEDT|PHT|MST|CC|BCC|RSVP|SKU|POS)\b)[A-Z]{4,}\b/.test(s) && (s.match(/!/g)||[]).length <= 1, label:'Calm, professional tone (no shouting caps, at most one "!")', why:'All-caps words and many exclamation marks read as shouting or panic.', fix:'Use normal sentence case. Keep exclamation marks for a single friendly line, if any.' },
  noSlang: { test: s => !/\b(gonna|wanna|u|ur|pls|plz|thx|lol|asap!!|btw|kinda|ya|yup|nope)\b/i.test(s), label:'No text-speak or slang', why:'Clients read slang as careless, even in quick messages.', fix:'Write words in full: "please", "thank you", "you".' }
};
VA.engines.written = {
  render(el, act, ctx){
    const parts = act.parts || [act]; const t0 = Date.now();
    el.innerHTML = `${parts.map((p, i) => `<div class="card" style="margin-bottom:14px">${parts.length>1?`<span class="tag info">Part ${i+1} of ${parts.length}</span>`:''}<h3 style="margin-top:6px">${p.title||'Your task'}</h3><p>${p.prompt}</p>${p.ctx?`<div class="q"><div class="ctx" style="margin:0">${p.ctx}</div></div>`:''}${p.rubric?`<details style="margin:8px 0"><summary class="mute">How this is graded</summary><ul>${p.rubric.map(r=>`<li>${esc(r.label)}${r.crit?' <span class="tag bad">critical</span>':''}</li>`).join('')}</ul></details>`:''}<textarea data-w="${i}" placeholder="${esc(p.ph||'Write your response here…')}" style="min-height:${p.tall?260:170}px"></textarea><div class="row" style="justify-content:space-between"><small class="mute" data-wc="${i}">0 words</small>${p.minWords?`<small class="mute">Aim for ${p.minWords}–${p.maxWords||p.minWords*4} words</small>`:''}</div></div>`).join('')}<div class="row"><button class="btn pri" data-sub>Submit for evaluation</button>${AI.ok()?'<span class="mute" style="font-size:14px">Includes an AI supervisor review.</span>':'<span class="mute" style="font-size:14px">Auto-checked against the rubric. The AI review is off in this view.</span>'}</div><div data-out></div>`;
    el.addEventListener('input', e => { const t = e.target.closest('[data-w]'); if (t) $(`[data-wc="${t.dataset.w}"]`, el).textContent = words(t.value) + ' words'; });
    el.addEventListener('click', async e => {
      if (!e.target.closest('[data-sub]') || el.dataset.busy) return;
      const ans = parts.map((p, i) => $(`[data-w="${i}"]`, el).value.trim());
      if (ans.some((a, i) => words(a) < Math.min(8, parts[i].minWords || 8))){ toast('Write a complete response for every part first.'); return; }
      el.dataset.busy = '1'; const btn = e.target.closest('[data-sub]'); btn.disabled = true; btn.textContent = 'Evaluating…';
      const res = await this.grade(parts, ans); res.dur = Date.now() - t0;
      res.output = { type:'text', text: ans.map((a, i) => (parts.length>1?'Part ' + (i+1) + ':\n':'') + a).join('\n\n') };
      btn.textContent = 'Submitted';
      ctx.onResult(res, el.querySelector('[data-out]'));
    });
  },
  autoCheck(p, a){
    const items = [], crit = [];
    for (const r of (p.rubric||[])){
      let ok = null;
      if (r.auto){ const au = typeof r.auto === 'string' ? AUTO[r.auto] : r.auto; if (au.re) ok = au.re.test(a); else if (au.test) ok = au.test(a); }
      if (r.any) ok = r.any.some(x => (x instanceof RegExp ? x : new RegExp(x, 'i')).test(a));
      if (r.all) ok = r.all.every(x => (x instanceof RegExp ? x : new RegExp(x, 'i')).test(a));
      if (r.none) ok = !r.none.some(x => (x instanceof RegExp ? x : new RegExp(x, 'i')).test(a));
      if (r.minQ) ok = (a.match(/\?/g)||[]).length >= r.minQ;
      if (r.len) { const w = words(a); ok = w >= r.len[0] && w <= r.len[1]; }
      if (ok === null) continue;
      const au = typeof r.auto === 'string' ? AUTO[r.auto] : {};
      items.push({ ok, label: r.label || au.label, why: r.why || au.why || '', fix: r.fix || au.fix || '', impact: r.impact || '', tag: r.tag, crit: !ok && r.crit });
      if (!ok && r.crit) crit.push(r.critMsg || r.label);
    }
    return { items, crit };
  },
  async grade(parts, ans){
    let items = [], critical = [], autoPct = [], aiParts = [], aiPct = [];
    for (let i = 0; i < parts.length; i++){
      const p = parts[i], a = ans[i];
      if (p.minWords){ const w = words(a); const ok = w >= p.minWords * 0.8 && w <= (p.maxWords || p.minWords * 4) * 1.25; p.rubric = p.rubric || []; items.push({ ok, label: (parts.length>1?'Part ' + (i+1) + ': ':'') + 'Length is right for the task (' + w + ' words)', why: 'Too short usually means missing information; too long means the client has to dig for the point.', fix: 'Aim for ' + p.minWords + '–' + (p.maxWords || p.minWords*4) + ' words: say what is needed, nothing more.' }); }
      const ac = this.autoCheck(p, a);
      ac.items.forEach(it => { if (parts.length > 1) it.label = 'Part ' + (i+1) + ': ' + it.label; });
      items = items.concat(ac.items); critical = critical.concat(ac.crit);
      const aiRub = (p.rubric||[]).filter(r => r.ai !== false).map((r, k) => { const lab = r.label || (typeof r.auto === 'string' && AUTO[r.auto] ? AUTO[r.auto].label : 'Criterion ' + (k + 1)); return { id: r.id || ('c' + k), label: lab }; });
      if (!aiRub.length) aiRub.push({id:'quality', label:'Overall professional quality'});
      const rv = await aiReviewBlock(p.title + ': ' + p.prompt.replace(/<[^>]+>/g,''), [...aiRub, {id:'accuracy', label:'Uses only the facts given (no invented details) and answers what was asked'}, {id:'tone', label:'Professional, clear, friendly tone'}], a, p.ctx ? p.ctx.replace(/<[^>]+>/g,'') : '');
      if (rv){ aiParts.push((parts.length>1?`<p class="mute" style="margin:12px 0 0">Part ${i+1}</p>`:'') + rv.html); aiPct.push(rv.score); }
    }
    const autoScore = items.length ? items.filter(i => i.ok).length / items.length * 100 : 70;
    const score = aiPct.length ? autoScore * 0.5 + (aiPct.reduce((s,x)=>s+x,0) / aiPct.length) * 0.5 : autoScore;
    const model = parts.map((p, i) => p.model ? `<details style="margin-top:10px"><summary><b>See a model answer${parts.length>1?' (part ' + (i+1) + ')':''}</b></summary><div class="ctx" style="white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:8px;margin-top:6px">${esc(p.model)}</div><p class="mute" style="font-size:14px">There is more than one good answer. Compare structure and tone, not exact words.</p></details>` : '').join('');
    return { score, items, critical, ai: aiParts.join('') + model, summary: aiPct.length ? 'Score = 50% rubric auto-checks + 50% AI supervisor review.' : 'Score is based on the rubric checks the system can verify automatically. Compare your work with the model answer for the rest.' };
  }
};

/* ===== Formula engine + interactive spreadsheet practice ===== */
const XL = (() => {
  class XErr { constructor(e){ this.e = e; } toString(){ return this.e; } }
  const err = e => { throw new XErr(e); };
  const colNum = s => { let n = 0; for (const ch of s.toUpperCase()) n = n*26 + (ch.charCodeAt(0) - 64); return n - 1; };
  const colName = n => { let s = ''; n++; while (n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const addr = (c, r) => colName(c) + (r + 1);
  const parseA = a => { const m = /^\$?([A-Z]{1,3})\$?(\d+)$/i.exec(a); return m ? { c: colNum(m[1]), r: +m[2] - 1 } : null; };
  const toSerial = (y, m, d) => Date.UTC(y, m - 1, d) / 864e5 + 25569;
  const fromSerial = s => { const d = new Date(Math.round((s - 25569) * 864e5)); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), wd: d.getUTCDay() }; };
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function literal(raw){
    if (raw === null || raw === undefined || raw === '') return null;
    if (typeof raw === 'number' || typeof raw === 'boolean') return raw;
    const s = String(raw).trim();
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return +s.replace(/,/g, '');
    if (/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return +s;
    if (/^-?\d*\.?\d+%$/.test(s)) return parseFloat(s) / 100;
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s); if (m) return { date: toSerial(+m[1], +m[2], +m[3]) };
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s); if (m) return { date: toSerial(+m[3], +m[1], +m[2]) };
    if (/^true$/i.test(s)) return true; if (/^false$/i.test(s)) return false;
    return String(raw);
  }
  /* tokenizer */
  function tokenize(f){
    const t = []; let i = 0;
    while (i < f.length){
      const ch = f[i];
      if (/\s/.test(ch)){ i++; continue; }
      if (ch === '"'){ let j = i + 1, s = ''; while (j < f.length){ if (f[j] === '"'){ if (f[j+1] === '"'){ s += '"'; j += 2; continue; } break; } s += f[j++]; } if (j >= f.length) err('#ERROR! (missing closing quote)'); t.push({ t:'str', v:s }); i = j + 1; continue; }
      let m;
      const rest = f.slice(i);
      if ((m = /^\$?([A-Z]{1,3})\$?(\d+)\s*:\s*\$?([A-Z]{1,3})\$?(\d+)/i.exec(rest))){ t.push({ t:'range', a: { c: colNum(m[1]), r: +m[2]-1 }, b: { c: colNum(m[3]), r: +m[4]-1 } }); i += m[0].length; continue; }
      if ((m = /^\$?([A-Z]{1,3})\s*:\s*\$?([A-Z]{1,3})(?![\w(])/i.exec(rest)) && !/^[A-Z]+\(/i.test(rest)){ t.push({ t:'range', a: { c: colNum(m[1]), r: 0 }, b: { c: colNum(m[2]), r: 9999 } }); i += m[0].length; continue; }
      if ((m = /^\d*\.?\d+(e[+-]?\d+)?/i.exec(rest))){ t.push({ t:'num', v: +m[0] }); i += m[0].length; continue; }
      if ((m = /^([A-Z][A-Z0-9.]*)\s*\(/i.exec(rest))){ t.push({ t:'fn', v: m[1].toUpperCase() }); i += m[0].length; continue; }
      if ((m = /^\$?([A-Z]{1,3})\$?(\d+)(?![\w])/i.exec(rest))){ t.push({ t:'ref', c: colNum(m[1]), r: +m[2]-1 }); i += m[0].length; continue; }
      if ((m = /^(TRUE|FALSE)(?![\w(])/i.exec(rest))){ t.push({ t:'bool', v: m[1].toUpperCase() === 'TRUE' }); i += m[0].length; continue; }
      if ((m = /^(<=|>=|<>|[-+*/^&=<>%(),;])/.exec(rest))){ t.push({ t: m[0] === ';' ? ',' : m[0] }); i += m[0].length; continue; }
      if ((m = /^[A-Z_][A-Z0-9_]*/i.exec(rest))) err('#NAME? ("' + m[0] + '" is not a function or cell — check spelling)');
      err('#ERROR! (unexpected "' + ch + '")');
    }
    return t;
  }
  /* parser → AST */
  function parse(f){
    const t = tokenize(f); let p = 0;
    const peek = () => t[p], next = () => t[p++], is = v => t[p] && t[p].t === v;
    const expect = v => { if (!is(v)) err('#ERROR! (expected "' + v + '")'); return next(); };
    function cmp(){ let l = cat(); while (t[p] && ['=','<>','<','>','<=','>='].includes(t[p].t)){ const o = next().t; l = { k:'bin', o, l, r: cat() }; } return l; }
    function cat(){ let l = add(); while (is('&')){ next(); l = { k:'bin', o:'&', l, r: add() }; } return l; }
    function add(){ let l = mul(); while (is('+') || is('-')){ const o = next().t; l = { k:'bin', o, l, r: mul() }; } return l; }
    function mul(){ let l = pw(); while (is('*') || is('/')){ const o = next().t; l = { k:'bin', o, l, r: pw() }; } return l; }
    function pw(){ let l = un(); while (is('^')){ next(); l = { k:'bin', o:'^', l, r: un() }; } return l; }
    function un(){ if (is('-')){ next(); return { k:'neg', x: un() }; } if (is('+')){ next(); return un(); } return pct(); }
    function pct(){ let x = prim(); while (is('%')){ next(); x = { k:'pct', x }; } return x; }
    function prim(){
      const k = next(); if (!k) err('#ERROR! (formula ends too early)');
      if (k.t === 'num') return { k:'v', v:k.v };
      if (k.t === 'str') return { k:'v', v:k.v };
      if (k.t === 'bool') return { k:'v', v:k.v };
      if (k.t === 'ref') return { k:'ref', c:k.c, r:k.r };
      if (k.t === 'range') return { k:'rng', a:k.a, b:k.b };
      if (k.t === '('){ const e = cmp(); expect(')'); return e; }
      if (k.t === 'fn'){ const args = []; if (!is(')')){ do { if (is(',') || is(')')) args.push({ k:'v', v:null, empty:true }); else args.push(cmp()); } while (is(',') && next()); } expect(')'); return { k:'fn', n:k.v, args }; }
      err('#ERROR! (unexpected "' + k.t + '")');
    }
    const ast = cmp(); if (p < t.length) err('#ERROR! (extra "' + (t[p].t === 'num' ? t[p].v : t[p].t) + '" — check commas and brackets)');
    return ast;
  }
  /* sheet */
  class Sheet {
    constructor(opts={}){ this.raw = {}; this.fmt = {}; this.cache = {}; this.stack = new Set(); this.today = opts.today; this.maxR = 0; this.maxC = 0; this.cur = opts.cur || '$'; }
    set(a, v){ this.raw[a] = v; const p = parseA(a); if (p){ this.maxR = Math.max(this.maxR, p.r); this.maxC = Math.max(this.maxC, p.c); } this.cache = {}; }
    load(rows){ rows.forEach((row, r) => row.forEach((v, c) => { if (v !== null && v !== undefined && v !== '') this.set(addr(c, r), v); })); }
    rawAt(a){ return this.raw[a]; }
    val(a){
      if (a in this.cache) return this.cache[a];
      const raw = this.raw[a]; let v;
      if (typeof raw === 'string' && raw.startsWith('=')){
        if (this.stack.has(a)) return new XErr('#CIRCULAR! (formula refers to its own cell)');
        this.stack.add(a);
        try { v = this.evalNode(parse(raw.slice(1))); if (v && v.k === 'R') v = this.cell(v.a.c, v.a.r); if (v === null) v = 0; }
        catch(e){ v = e instanceof XErr ? e : new XErr('#ERROR!'); }
        this.stack.delete(a);
      } else { v = literal(raw); if (v && v.date !== undefined){ if (!this.fmt[a]) this.fmt[a] = 'date'; v = v.date; } }
      this.cache[a] = v; return v;
    }
    cell(c, r){ return this.val(addr(c, r)); }
    evalNode(n){
      switch (n.k){
        case 'v': return n.v;
        case 'ref': { const v = this.cell(n.c, n.r); if (v instanceof XErr) throw v; return v; }
        case 'rng': return { k:'R', a: { c: Math.min(n.a.c, n.b.c), r: Math.min(n.a.r, n.b.r) }, b: { c: Math.max(n.a.c, n.b.c), r: Math.min(Math.max(n.a.r, n.b.r), Math.max(this.maxR, 0)) } };
        case 'neg': return -num(this.scalar(n.x));

      const texts = tagAll(d, 't').map(t => t.textContent).join(' ').trim();
      const relf = f.replace('slides/', 'slides/_rels/') + '.rels'; let notes = '';
      if (zip.file(relf)){ const rx = await zip.file(relf).async('string'); const m = /Target="\.\.\/notesSlides\/(notesSlide\d+\.xml)"/.exec(rx); if (m && zip.file('ppt/notesSlides/' + m[1])){ const nd = XMLP(await zip.file('ppt/notesSlides/' + m[1]).async('string')); const parts = []; tagAll(nd, 'sp').forEach(sp => { const ph = tagAll(sp, 'ph')[0]; if (ph && /sldNum|sldImg/.test(ph.getAttribute('type') || '')) return; parts.push(tagAll(sp, 't').map(t => t.textContent).join(' ')); }); notes = parts.join(' ').trim(); } }

  },

};

/* Helper API for spreadsheet checks */
function WB(m){
  const norm = s => String(s ?? '').trim().toLowerCase().replace(/[:\s]+$/, '').replace(/\s+/g, ' ');
  const api = {
    m, sheets: m.sheets,
    sheet(re){ if (!re) return m.sheets[0]; const r = re instanceof RegExp ? re : new RegExp('^\\s*' + re + '\\s*$', 'i'); return m.sheets.find(s => r.test(s.name)); },
    cell(sh, a){ return sh && sh.ws[a] ? sh.ws[a] : null; },
    v(sh, a){ const c = api.cell(sh, a); return c ? c.v : null; },
    rows(sh){ if (!sh) return []; const out = []; for (let r = 0; r <= sh.maxR; r++){ const row = []; for (let c = 0; c <= sh.maxC; c++){ const a = XL.addr(c, r); row.push(sh.ws[a] || null); } out.push(row); } return out; },
    _find(test, sh){ const list = sh ? [sh] : m.sheets; for (const pass of [0, 1]) for (const s of list){ for (const [a, c] of Object.entries(s.ws)){ if (a[0] === '!') continue; if (c && c.t === 's' && (pass || !c.f) && test(c.v)) { const p = XL.parseA(a); return { sh: s, a, r: p.r, c: p.c }; } } } return null; },
    find(label, sh){ const want = norm(label); return api._find(v => norm(v) === want, sh); },
    findLike(re, sh){ return api._find(v => re.test(String(v)), sh); },
    near(label, sh){ const f = typeof label === 'string' ? api.find(label, sh) : api.findLike(label, sh); if (!f) return null; for (let dc = 1; dc <= 4; dc++){ const a = XL.addr(f.c + dc, f.r); const c = f.sh.ws[a]; if (c && c.v !== '' && c.v !== null) return { sh: f.sh, a, cell: c, label: f }; } const a = XL.addr(f.c, f.r + 1); const c = f.sh.ws[a]; if (c) return { sh: f.sh, a, cell: c, label: f }; return { sh: f.sh, a: null, cell: null, label: f }; },
    header(sh){ if (!sh) return { r: -1, cols: [] }; let best = { r: 0, n: -1, cols: [] }; for (let r = 0; r <= Math.min(4, sh.maxR); r++){ const cols = []; let n = 0; for (let c = 0; c <= sh.maxC; c++){ const x = sh.ws[XL.addr(c, r)]; cols.push(x && x.t === 's' ? String(x.v).trim() : ''); if (x && x.t === 's') n++; } if (n > best.n) best = { r, n, cols }; } return best; },
    colIdx(sh, re){ const h = api.header(sh); return h.cols.findIndex(c => re.test(c)); },
    col(sh, re){ const h = api.header(sh); const i = h.cols.findIndex(c => re.test(c)); if (i < 0) return null; const out = []; for (let r = h.r + 1; r <= sh.maxR; r++){ out.push({ a: XL.addr(i, r), cell: sh.ws[XL.addr(i, r)] || null, r }); } return out; },
    dataRows(sh){ const h = api.header(sh); const out = []; for (let r = h.r + 1; r <= sh.maxR; r++){ let any = false; for (let c = 0; c <= sh.maxC; c++){ const x = sh.ws[XL.addr(c, r)]; if (x && x.v !== '' && x.v !== null) { any = true; break; } } if (any) out.push(r); } return out; },
    frozen(sh){ return !!sh && /<pane[^>]*state="frozen(Split)?"/.test(sh.xml); },
    filter(sh){ return !!sh && (/<autoFilter\b/.test(sh.xml) || /<tableParts\b[^>]*count="[1-9]/.test(sh.xml)); },
    cf(sh){ return !!sh && /<(x14:)?conditionalFormatting\b/.test(sh.xml); },
    dv(sh){ if (!sh) return 0; return (sh.xml.match(/<(x14:)?dataValidation\b/g) || []).length; },
    dvList(sh){ return !!sh && /<(x14:)?dataValidation\b[^>]*type="list"/.test(sh.xml); },
    charts(){ return m.files.filter(f => /^xl\/charts\/chart\d*\.xml$/.test(f)).length; },
    images(){ return m.files.filter(f => /^xl\/media\//.test(f)).length; },
    pivots(){ return m.files.filter(f => /^xl\/pivotTables\//.test(f)).length; },
    isFormula(c){ return !!(c && c.f); },
    num(c){ return c && typeof c.v === 'number' ? c.v : null; },
    eq(a, b, tol=0.011){ return typeof a === 'number' && typeof b === 'number' && Math.abs(a - b) <= tol; },
    fmtIs(c, re){ return !!(c && c.z && re.test(String(c.z))); },
    text(maxChars=6000){ let out = ''; for (const s of m.sheets){ out += '## Sheet: ' + s.name + '\n'; for (let r = 0; r <= Math.min(s.maxR, 60); r++){ const row = []; for (let c = 0; c <= Math.min(s.maxC, 12); c++){ const x = s.ws[XL.addr(c, r)]; row.push(x ? (x.f ? '=' + x.f + ' → ' : '') + (x.w ?? x.v) : ''); } out += row.join(' | ') + '\n'; if (out.length > maxChars) break; } } return out.slice(0, maxChars); }
  };
  return api;
}
const chk = (ok, label, o={}) => Object.assign({ ok: !!ok, label }, o, ok ? { why:'', fix:'', impact:'' } : {});

  z.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');

  z.file('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  z.file('xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy-mm-dd"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`);
  sheets.forEach((s, i) => {
    const rows = s.rows.map((row, r) => `<row r="${r + 1}">${row.map((v, c) => { if (v === null || v === undefined || v === '') return ''; const a = XL.addr(c, r); if (v instanceof Date) return `<c r="${a}" s="1"><v>${XL.toSerial(v.getFullYear(), v.getMonth() + 1, v.getDate())}</v></c>`; if (typeof v === 'number') return `<c r="${a}"><v>${v}</v></c>`; if (typeof v === 'boolean') return `<c r="${a}" t="b"><v>${v ? 1 : 0}</v></c>`; return `<c r="${a}" t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`; }).join('')}</row>`).join('');

${replies.map(m => `ID ${m.id}\nORIGINAL EMAIL from ${m.from}: ${m.subject}\n${m.body}\nWHAT A GOOD REPLY MUST DO: ${m.key.goal || ''}\nTRAINEE DRAFT:\n"""${st[m.id].reply}"""`).join('\n\n---\n\n')}

          else { let h = 0; if (AUTO.greet.re.test(rp)) h++; if (AUTO.close.re.test(rp)) h++; const kw = (k.kw || []); const hit = kw.filter(x => new RegExp(x, 'i').test(rp)).length; if (!kw.length || hit >= Math.ceil(kw.length / 2)) h++; if (words(rp) >= 25 && words(rp) <= 220) h++; rs = h / 2; if (h < 4) wrong.push('Reply is missing: ' + [!AUTO.greet.re.test(rp) && 'greeting', !AUTO.close.re.test(rp) && 'sign-off', kw.length && hit < Math.ceil(kw.length/2) && 'the key details (' + (k.goal || '') + ')', !(words(rp) >= 25 && words(rp) <= 220) && 'a suitable length (25–220 words)'].filter(Boolean).join(', ')); } }

      if (k.noReplyCrit && words(s.reply) > 5 && new RegExp(k.noReplyCrit, 'i').test(s.reply)) critical.push('"' + m.subject + '": your draft shares or promises something you are not allowed to.');

    }

    const out = { score, items, critical, dur: Date.now() - t0, summary: `${items.filter(i => i.ok).length} of ${items.length} emails handled perfectly · ${Math.round(pts)} / ${max} points.${Object.keys(aiScores).length ? ' Replies were reviewed by the AI supervisor.' : ' Replies were checked against a rubric (greeting, sign-off, key details, length).'}`, output: { type:'text', text: act.emails.map(m => `${m.subject}\n  ${st[m.id].cat} | ${st[m.id].urg} | ${st[m.id].act}${st[m.id].flag ? ' | FLAGGED' : ''}${st[m.id].reply ? '\n  Reply: ' + st[m.id].reply.replace(/\n/g, '\n  ') : ''}`).join('\n\n') } };

  }

const T = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const HM = m => { const h = Math.floor(m / 60), mm = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; return ((h + 11) % 12 + 1) + ':' + pad2(mm) + ' ' + ap; };

  render(el, act, ctx){

     <div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);margin-top:12px" data-cg><div><div data-cal></div></div><div class="card"><h3>Requests to schedule</h3>${act.requests.map(q => `<div class="q" style="padding:12px"><b>${esc(q.title)}</b> <span class="tag">${q.dur} min</span><div class="mute" style="font-size:14px;margin:4px 0">${q.text}</div><div class="row"><select data-d="${q.id}" aria-label="Day" style="width:auto;flex:1">${['<option value="">Day…</option>', ...days.map((d, i) => `<option value="${i}">${esc(d)}</option>`)].join('')}</select><select data-t="${q.id}" aria-label="Start time" style="width:auto;flex:1"><option value="">Start…</option>${times.map(m => `<option value="${m}">${HM(m)}</option>`).join('')}</select></div><label class="row" style="font-size:14px;margin-top:6px"><input type="checkbox" data-fl="${q.id}"> Can't fit — flag to client with options</label></div>`).join('')}
     ${Object.keys(moves).length ? `<h3>Movable existing events</h3>${act.events.filter(e => e.movable).map(e => `<div class="q" style="padding:12px"><b>${esc(e.title)}</b><div class="mute" style="font-size:14px">${esc(e.moveNote || 'You may move this if needed.')}</div><div class="row"><select data-md="${e.id}" style="width:auto;flex:1">${days.map((d, i) => `<option value="${i}" ${i === e.day ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select><select data-mt="${e.id}" style="width:auto;flex:1">${times.map(m => `<option value="${m}" ${m === T(e.s) ? 'selected' : ''}>${HM(m)}</option>`).join('')}</select></div></div>`).join('')}` : ''}
     <label class="f">Note to the client explaining your decisions${act.noteRequired ? ' (required)' : ''}<textarea data-note placeholder="Hi … I scheduled … I could not fit … because … Options: …"></textarea></label></div></div>
     <div class="row" style="margin-top:12px"><button class="btn pri" data-sub>Submit schedule</button></div><div data-out></div>`;
    const evs = () => { const out = []; (act.events || []).forEach(e => { const mv = moves[e.id]; out.push({ id: e.id, title: e.title, day: mv ? +mv.day : e.day, s: mv ? +mv.start : T(e.s), e: (mv ? +mv.start : T(e.s)) + (T(e.e) - T(e.s)), mine: false, buffer: e.buffer || 0 }); }); act.requests.forEach(q => { const p = place[q.id]; if (!p.flag && p.day !== '' && p.start !== '') out.push({ id: q.id, title: q.title, day: +p.day, s: +p.start, e: +p.start + q.dur, mine: true }); }); return out; };
    const draw = () => { const H = (E0 - S0) / 60 * 40; const all = evs();
      const clash = new Set(); all.forEach(a => all.forEach(b => { if (a !== b && a.day === b.day && a.s < b.e && b.s < a.e){ clash.add(a.id); clash.add(b.id); } }));

    if (window.innerWidth < 900) $('[data-cg]', el).style.gridTemplateColumns = '1fr';
  },
  grade(el, act, place, moves, all, note, ctx, t0){
    const items = []; const S0 = (act.start || 8) * 60, E0 = (act.end || 18) * 60;
    const overlaps = x => all.filter(y => y !== x && y.day === x.day && x.s < y.e + (y.buffer || 0) && y.s < x.e + (x.buffer || 0));
    for (const q of act.requests){
      const p = place[q.id]; const ru = q.rule || {}; const probs = [];

      if (p.flag){ items.push(chk(false, `"${q.title}" could have been scheduled`, { detail: 'You flagged it, but there is at least one valid slot: ' + esc(ru.example || ''), why: 'Flagging solvable requests pushes work back to the client — the opposite of your job.', fix: 'Check every day against each condition before deciding it cannot fit.', tag: 'cal-overflag' })); continue; }
      const x = all.find(y => y.id === q.id);
      if (ru.days && !ru.days.includes(x.day)) probs.push('wrong day (allowed: ' + ru.days.map(d => act.days[d]).join(', ') + ')');
      if (x.s < S0 || x.e > E0) probs.push('outside working hours');

      if (ru.check){ const extra = ru.check(x, all); if (extra) probs.push(extra); }
      items.push(chk(!probs.length, `"${q.title}" placed on ${act.days[x.day]} at ${HM(x.s)}`, { detail: probs.length ? 'Problems: ' + probs.join('; ') : '', why: 'Every condition in a scheduling request is a promise to someone. Missing one means a no-show, a double-booking, or a 3 AM meeting for an overseas client.', fix: ru.example ? 'One valid option: ' + ru.example : 'Re-read each condition and check the time-zone conversion.', tag: probs.some(p => /their time/.test(p)) ? 'cal-timezone' : 'cal-conflict' }));
    }

    ctx.onResult({ score, items, critical: [], dur: Date.now() - t0, summary: `${items.filter(i => i.ok).length} of ${items.length} scheduling decisions correct.`, output: { type:'text', text: all.filter(x => x.mine).map(x => act.days[x.day] + ' ' + HM(x.s) + '–' + HM(x.e) + ': ' + x.title).join('\n') + (note ? '\n\nNote: ' + note : '') } }, el.querySelector('[data-out]'));
  }
};

  async grade(el, act, tasks, rep, ctx, t0){

      if (k.pri && t.pri !== k.pri && !(k.priAlt || []).includes(t.pri)) priWrong.push(`${esc(t.title)}: ${t.pri || '—'} → ${k.pri}${k.priWhy ? ' (' + k.priWhy + ')' : ''}`);
      if (k.due && t.due !== k.due) dueWrong.push(`${esc(t.title)}: ${t.due || 'none'} → ${k.due}`);
      if (k.col && t.col !== k.col && !(k.colAlt || []).includes(t.col)) colWrong.push(`${esc(t.title)}: ${t.col} → ${k.col}`);

      if (k.who && t.who !== k.who) whoWrong.push(`${esc(t.title)}: ${t.who || '—'} → ${k.who}`);

    items.push(chk(!dueWrong.length, 'Due dates copied correctly from the brief and updates', { detail: dueWrong.join('<br>'), why: 'A task without the right date is invisible until it is too late.', fix: 'Copy every date the client gives. When the client changes a date, update the card immediately.', tag: 'pm-dates' }));
    items.push(chk(!colWrong.length, 'Every task is in the correct status column', { detail: colWrong.join('<br>'), why: 'Status columns are how a client sees progress at a glance. Wrong columns tell the wrong story.', fix: 'Done = finished and delivered. Waiting on client = you cannot continue without them. In progress = you are actively working on it.', tag: 'pm-status' }));
    items.push(chk(!odWrong.length, 'Overdue tasks identified correctly', { detail: odWrong.join('<br>'), why: 'Spotting overdue work early is one of the most valued VA habits.', fix: 'Overdue = due date is before today AND it is not Done.', tag: 'pm-overdue' }));
    if (act.tasks.some(t => t.key && t.key.who)) items.push(chk(!whoWrong.length, 'Each task has the right owner', { detail: whoWrong.join('<br>'), why: 'A task without an owner belongs to no one.', fix: 'Assign the person named in the brief.', tag: 'pm-owner' }));
    const repRes = await VA.engines.written.grade([{ title:'Weekly progress report', prompt: act.report.prompt, rubric: act.report.rubric, minWords: 80, maxWords: 300 }], [rep]);
    repRes.items.forEach(i => { i.label = 'Report: ' + i.label; items.push(i); });
    const boardScore = items.slice(0, items.length - repRes.items.length).filter(i => i.ok).length / (items.length - repRes.items.length) * 100;
    const score = boardScore * 0.6 + repRes.score * 0.4;
    ctx.onResult({ score, items, critical: repRes.critical, ai: repRes.ai, dur: Date.now() - t0, summary: `Board accuracy ${Math.round(boardScore)}% (60% of score) · weekly report ${Math.round(repRes.score)}% (40%).`, output: { type:'text', text: this.COLS.map(c => c + ':\n' + tasks.filter(t => t.col === c).map(t => '  - ' + t.title + ' [' + (t.pri || '-') + (t.due ? ', due ' + t.due : '') + (t.who ? ', ' + t.who : '') + (t.overdue ? ', OVERDUE' : '') + ']').join('\n')).join('\n') + '\n\nWEEKLY REPORT\n' + rep } }, el.querySelector('[data-out]'));
  }
};

/* ---------- Proofreading / QA: find the errors ---------- */
VA.engines.proof = {
  render(el, act, ctx){
    const t0 = Date.now(); const toks = []; const re = /\[\[([^|\]]*)\|([^\]]*)\]\]|(\s+)|([^\s\[]+|\[)/g; let m;
    while ((m = re.exec(act.text))){ if (m[1] !== undefined) toks.push({ w: m[1], fix: m[2], err: true }); else if (m[3]) toks.push({ sp: m[3] }); else toks.push({ w: m[4] }); }
    const errs = toks.filter(t => t.err).length;
    el.innerHTML = `<p>${act.instructions || 'Click every word or number that is wrong (spelling, grammar, wrong fact, inconsistent formatting). Click again to unselect.'} <b>There are ${act.hideCount ? 'several' : errs} errors.</b></p>${act.source ? `<details class="card soft" style="margin-bottom:10px"><summary><b>Source facts to check against</b></summary><div style="white-space:pre-wrap;margin-top:8px">${act.source}</div></details>` : ''}<div class="proof">${toks.map((t, i) => t.sp ? (t.sp.includes('\n') ? '<br>'.repeat(Math.min(2, (t.sp.match(/\n/g) || []).length)) : ' ') : `<span class="w" data-i="${i}">${esc(t.w)}</span>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pri" data-sub>Submit</button><span class="mute" data-n style="font-size:14px">0 selected</span></div><div data-out></div>`;
    el.addEventListener('click', e => { const w = e.target.closest('.w'); if (w && !el.dataset.done){ w.classList.toggle('on'); $('[data-n]', el).textContent = $$('.w.on', el).length + ' selected'; return; }
      if (e.target.closest('[data-sub]') && !el.dataset.done){ el.dataset.done = '1'; let hit = 0, fp = 0; const missed = [], items = [];
        $$('.w', el).forEach(w => { const t = toks[+w.dataset.i]; const on = w.classList.contains('on'); if (t.err && on){ hit++; w.classList.add('hit'); w.title = 'Correct: ' + t.fix; w.textContent = t.w + ' → ' + t.fix; } else if (t.err){ missed.push(t); w.classList.add('miss'); w.textContent = t.w + ' → ' + t.fix; } else if (on){ fp++; w.style.textDecoration = 'line-through'; } });
        const score = Math.max(0, (hit - fp * 0.5) / errs) * 100;
        items.push(chk(!missed.length, `Found ${hit} of ${errs} errors`, { detail: missed.length ? 'Missed: ' + missed.map(t => `<code>${esc(t.w)}</code> → <code>${esc(t.fix)}</code>`).join(', ') : '', why: 'Clients notice small errors — and each one makes them trust the rest of your work less.', fix: 'Read slowly, once for spelling, once for numbers/dates against the source, once for consistency (same format everywhere).', tag: act.tag || 'proofreading' }));
        items.push(chk(fp === 0, fp ? `${fp} correct word(s) marked as errors` : 'No false alarms', { why: 'Changing correct text wastes time and can introduce new errors.', fix: 'When unsure, check the source or a dictionary before changing it.', tag: act.tag ? act.tag + '-fp' : 'proofreading-fp' }));
        ctx.onResult({ score, items, critical: [], dur: Date.now() - t0, summary: `Found ${hit}/${errs} · false alarms ${fp}.` }, el.querySelector('[data-out]')); }
    });
  }
};

    el.innerHTML = `<p>Type the passage exactly, including punctuation. The timer starts on your first key. Target: <b>35+ words per minute at 95%+ accuracy</b> (a common VA hiring bar).</p><div class="card soft" style="font-size:17px;line-height:1.7" data-src>${esc(text)}</div><textarea data-in style="margin-top:10px;font-size:17px" spellcheck="false" placeholder="Start typing here…"></textarea><div class="row"><span class="timer" data-timer>${act.seconds ? Math.floor(act.seconds / 60) + ':00' : ''}</span><span class="mute" data-live></span><span class="sp"></span><button class="btn pri" data-sub>Finish</button></div><div data-out></div>`;
    const inp = $('[data-in]', el);
    const finish = () => { if (el.dataset.done) return; el.dataset.done = '1'; inp.disabled = true; const typed = inp.value; const mins = Math.max((Date.now() - (t0 || Date.now())) / 60000, 0.05); let correct = 0; for (let i = 0; i < typed.length; i++) if (typed[i] === text[i]) correct++; const acc = typed.length ? correct / typed.length * 100 : 0; const wpm = Math.round(correct / 5 / mins); const score = acc >= 95 ? Math.min(100, 85 + (wpm - 35) / 2) * (wpm >= 35 ? 1 : wpm / 35) : acc * Math.min(1, wpm / 35) * 0.85;
      const items = [chk(wpm >= 35, `Speed: ${wpm} WPM`, { why: 'Many VA roles involve heavy typing: emails, data entry, notes.', fix: 'Practise 10 minutes a day without looking at the keyboard.', tag: 'typing-speed' }), chk(acc >= 95, `Accuracy: ${acc.toFixed(1)}%`, { why: 'Fast typing with errors creates more work than slow, clean typing.', fix: 'Slow down until accuracy is 97%+, then speed up gradually.', tag: 'typing-acc' })];
      ctx.onResult({ score: clamp(score, 0, 100), items, critical: [], dur: Date.now() - t0, summary: `${wpm} WPM at ${acc.toFixed(1)}% accuracy.` }, el.querySelector('[data-out]')); };
    inp.addEventListener('input', () => { if (!t0){ t0 = Date.now(); if (act.seconds) startTimer($('[data-timer]', el), act.seconds, finish); } const mins = (Date.now() - t0) / 60000; $('[data-live]', el).textContent = Math.round(inp.value.length / 5 / Math.max(mins, 0.05)) + ' WPM'; if (inp.value.length >= text.length) finish(); });
    inp.addEventListener('paste', e => { e.preventDefault(); toast('Pasting is disabled in a typing test.'); });
    el.addEventListener('click', e => { if (e.target.closest('[data-sub]')) finish(); });
  }
};

/* ---------- Multi-part (comprehensive exams) ---------- */
VA.engines.multi = {
  render(el, act, ctx){
    const results = []; const t0 = Date.now(); let i = 0;
    const step = () => {
      if (i >= act.parts.length){
        const tw = act.parts.reduce((s, p) => s + (p.weight || 1), 0);
        const score = results.reduce((s, r, k) => s + r.score * (act.parts[k].weight || 1), 0) / tw;
        const items = results.flatMap((r, k) => (r.items || []).map(it => Object.assign({}, it, { label: act.parts[k].title + ' — ' + it.label })));
        const critical = results.flatMap(r => r.critical || []);
        const breakdown = `<table style="margin-top:10px"><thead><tr><th>Part</th><th class="n">Weight</th><th class="n">Score</th><th>Result</th></tr></thead><tbody>${results.map((r, k) => `<tr><td>${esc(act.parts[k].title)}</td><td class="n">${act.parts[k].weight || 1}</td><td class="n">${Math.round(r.score)}%</td><td>${r.score >= PASS && !(r.critical || []).length ? '<span class="tag ok">pass</span>' : '<span class="tag bad">below standard</span>'}</td></tr>`).join('')}</tbody></table>`;
        el.innerHTML = '<div data-out></div>';
        ctx.onResult({ score, items, critical, dur: Date.now() - t0, parts: results.map((r, k) => ({ title: act.parts[k].title, score: r.score, skill: act.parts[k].skill })), summary: 'Combined score across ' + results.length + ' parts.' + breakdown }, el.querySelector('[data-out]'));
        return;
      }
      const p = act.parts[i]; const pact = typeof p.act === 'function' ? p.act() : p.act;
      el.innerHTML = `<div class="row" style="margin-bottom:10px"><span class="tag info">Part ${i + 1} of ${act.parts.length}</span><b>${esc(p.title)}</b>${p.minutes ? `<span class="sp"></span><span class="timer" data-pt></span>` : ''}</div>${p.intro ? `<p>${p.intro}</p>` : ''}<div data-part></div>`;
      const box = $('[data-part]', el);
      VA.engines[pact.type].render(box, pact, { seed: (ctx.seed || 1) + i, mode: 'test', onResult: (r, out) => { results[i] = r; out.innerHTML = `<div class="note ${r.score >= PASS ? 'ok' : 'warn'}"><b>Part ${i + 1} submitted: ${Math.round(r.score)}%</b>The full report comes at the end.</div><button class="btn pri" data-nextpart>${i + 1 < act.parts.length ? 'Continue to part ' + (i + 2) : 'See final report'}</button>`; out.querySelector('[data-nextpart]').onclick = () => { i++; step(); window.scrollTo(0, 0); }; } });
      if (p.minutes){ startTimer($('[data-pt]', el), p.minutes * 60, () => toast('Suggested time for this part is up. Finish and submit when you can — your time is recorded.')); }
    };
    step();
  }
};

L({ id:'l1a', level:1, title:'What an administrative VA actually does', mins:35, skills:['va-role'], keywords:'industry clients responsibilities scope',

L({ id:'l1b', level:1, title:'Understanding client instructions', mins:40, skills:['instructions'], keywords:'clarify questions vague unclear 5W',
