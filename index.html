L({ id:'l10b', level:10, title:'CRM basics & customer database simulation', mins:90, skills:['crm','customer-service'], apps:['hubspot','zoho','salesforce'], keywords:'crm hubspot salesforce zoho pipeline stage contact deal follow up duplicate record',
  objectives:{ learn:['What a CRM is and why businesses use one','Contacts, companies, deals and pipeline stages','Logging interactions and follow-ups','Keeping records accurate: updates and duplicates'], why:'A CRM is only as good as its data — and VAs keep it clean.', where:'Sales, real estate, agencies, any business with leads.', expect:'Every record current, every interaction logged, no duplicates, follow-ups never missed.' },
  tutorial:[
    { h:'CRM in plain words', b: plain('A CRM (Customer Relationship Management system) is a shared memory of every customer: who they are, what they want, every conversation, and what happens next.') + UL(['<b>HubSpot CRM</b> — free plan, very common with small businesses (HubSpot Academy has free courses).','<b>Zoho CRM</b> — free plan for small teams.','<b>Salesforce</b> — used by bigger companies; Trailhead offers free training.']) + P('No paid subscription is needed to learn: the free plans and this simulation cover the core ideas.') },
    { h:'Core objects', b: `<table><tbody><tr><td><b>Contact</b></td><td>A person (name, email, phone)</td></tr><tr><td><b>Company</b></td><td>The organization they belong to</td></tr><tr><td><b>Deal / opportunity</b></td><td>A possible sale</td></tr><tr><td><b>Activity</b></td><td>Calls, emails, meetings, notes</td></tr><tr><td><b>Task</b></td><td>A follow-up with a due date</td></tr></tbody></table>` },
    { h:'Pipeline stages', b: P('New lead → Contacted → Qualified (real need + ability to buy) → Customer → (Inactive if they go quiet or are lost).') + watch('Moving a stage without evidence (e.g. "Qualified" just because they replied) makes the pipeline lie.') },
    { h:'Data hygiene rules', b: UL(['Log every interaction the same day.','Always set the next follow-up date.','Search before creating a contact (avoid duplicates).','Merge duplicates, keeping the most complete record.','Correct bounced emails and wrong numbers immediately.']) }
  ],
  demo:{ intro:'Logging a call in HubSpot (same idea in any CRM).', steps:[
    { d:'Search the contact first (name/email/phone).', w:'Prevents duplicates.' },
    { d:'Open the record › Log activity › Call: "Pre-approved, wants to view 92 Pine Rd."', w:'Facts, not feelings.' },
    { d:'Update the lifecycle/deal stage to Qualified.', w:'Evidence: pre-approval + specific interest.' },
    { d:'Create a task: "Book viewing — due tomorrow".', w:'Every record has a next step.' } ] },
  guided:{ act: quiz([ mc('Before creating a new contact you should…', ['Create it immediately','Search for an existing record','Email them','Delete old ones'], 1, 'Search first.'), mc('A lead replied "thanks, I\'ll think about it". Stage?', ['Customer','Qualified','Contacted','Inactive'], 2, 'They engaged but are not qualified yet.') ]), hints:['Duplicates start when people skip one step.','Qualified needs evidence of real need and ability to buy.','Search first; Contacted.'] },
  practical:{ act: CRM_MAIN },
  portfolio:{ cat:'Task Management', title:'CRM Database Management Simulation', shows:'Updating a 30-contact CRM: new leads, logged interactions, stage changes, corrected details, a merged duplicate and customer replies.', skills:['CRM','Data accuracy','Customer communication','Follow-up policy'] },
  mastery:{ questions:[ mc('CRM stands for…', ['Customer Relationship Management','Client Report Maker','Central Record Machine','Contact Routing Module'], 0, 'Customer Relationship Management.'), mc('After two duplicate records are found, you…', ['Delete both','Merge into the most complete one and note it','Leave both','Rename one'], 1, 'Merge, keep history.'), mc('An email bounced. You…', ['Ignore','Find the correct address and update the record','Delete the contact','Send again 10 times'], 1, 'Fix data quickly.'), mc('Every record should have…', ['A next follow-up date (unless closed)','A photo','A nickname','Nothing'], 0, 'Next step.'), mc('Free CRM to practise with?', ['HubSpot CRM free plan','Only paid tools exist','Excel only','None'], 0, 'HubSpot / Zoho free plans.') ] } });

/* ================= LEVEL 11: OPERATIONS ================= */
L({ id:'l11a', level:11, title:'Confirming tasks, asking smart questions & estimating time', mins:50, skills:['ops','instructions'], keywords:'confirm requirements estimate time deadline scope assumptions',
  objectives:{ learn:['Confirm a task back to the client','Estimate time realistically','State assumptions','Propose a deadline with a time zone'], why:'Clear agreements prevent most client conflicts.', where:'The start of every non-trivial task.', expect:'Within an hour of a request: a short confirmation with scope, estimate and delivery time.' },
  tutorial:[
    { h:'The confirmation message', b: `<ol class="steps"><li>Restate the deliverable (what, how many, format).</li><li>State assumptions ("I\'ll include only spaces with day passes").</li><li>Ask only the questions that change the result.</li><li>Give an estimate and a delivery time with time zone.</li></ol>` },
    { h:'Estimating time', b: UL(['Break it down: 15 coworking spaces × ~10 min each = 2.5 h + 30 min formatting/QA = ~3 h.','Add a buffer (20–30%) for surprises.','Track actual time (Toggl, Clockify) to improve future estimates.','If it will exceed the estimate, tell the client BEFORE you go over.']) + plain('Under-promise slightly, deliver on time. Being 30 minutes early beats being 30 minutes late.') },
    { h:'Scope creep', b: P('If the client adds work ("also add their Instagram"), confirm the impact: "Happy to — that adds about 30 minutes; I\'ll deliver by 4 PM instead of 3:30."') }
  ],
  demo:{ intro:'Request: "Research coworking spaces in Cebu with prices. Need it soon."', steps:[
    { d:'Deliverable: Google Sheet, 15 spaces: name, area, day-pass price, monthly price, link.', w:'Specific.' },
    { d:'Assumption: Cebu City + Mandaue only; prices from official pages.', w:'Stated, so the client can correct it.' },
    { d:'Question: "Do you need meeting-room prices too?"', w:'Only questions that change the result.' },
    { d:'Estimate: ~3 hours → "I\'ll send it today by 4 PM PHT."', w:'Time + zone.' } ] },
  guided:{ act: quiz([ mc('15 items × 10 min + 30 min QA, plus a ~25% buffer ≈', ['1.5 h','2 h','3–3.5 h','8 h'], 2, '3 h + buffer ≈ 3.5 h.'), mc('Client adds work mid-task. You…', ['Silently do it and deliver late','Confirm the extra time and new delivery time','Refuse','Ignore it'], 1, 'Make the impact visible.') ]), hints:['Multiply, add QA, add buffer.','Scope changes change deadlines.','~3.5 h; confirm the impact.'] },
  practical:{ act: wr({ title:'Confirm a task with an estimate', prompt:'Write your confirmation reply. It is 10:00 AM your time (Manila). The client is in Denver (UTC−7 in December).', ctx:'Hey! Can you find coworking spaces in Cebu with their prices and put them in a sheet? Need it soon for a team trip. Thanks!\n— Hannah (Summit Ridge Outdoor)', minWords:60, maxWords:200,
    rubric:[ { auto:'greet' }, { id:'deliv', label:'Restates the deliverable specifically (sheet, number of spaces, columns)', all:[/(sheet|spreadsheet)/i, /\b(\d{1,2}|ten|fifteen|twenty)\b/i] }, { id:'assume', label:'States an assumption', any:[/(assum|I\'ll include|I will include|unless)/i] }, { id:'q', label:'Asks at least one question that changes the result (dates, team size, budget, area)', minQ:1 }, { id:'est', label:'Gives a time estimate', any:[/(\d+(\.\d)?\s*(hours?|hrs?)|half a day|by \d)/i] }, { id:'tz', label:'Delivery time includes a time zone (PHT/Manila and/or Denver/MST)', any:[/(PHT|Manila|MST|Denver|your time)/i] }, { auto:'close' } ],
    model:'Hi Hannah,\n\nHappy to help with the team trip! Here\'s what I\'ll prepare:\n• A Google Sheet with 15 coworking spaces in Cebu City and Mandaue: name, area, day-pass price, monthly price, capacity for groups, and the official link.\n\nI\'m assuming you need day passes for a group. Two quick questions: how many people, and which dates? That helps me check group rates.\n\nIt should take about 3 hours, so I\'ll send it by 2:00 PM Manila time today (11:00 PM tonight in Denver), ready for your morning.\n\nBest,\n[Your name]' }) },
  mastery:{ questions:[ mc('Why state assumptions?', ['To look smart','So the client can correct them before you do the work','Required by law','To fill space'], 1, 'Early correction.'), mc('Estimate formula?', ['Guess','Break down tasks × time + QA + buffer','Always 1 hour','Whatever the client wants'], 1, 'Break it down.'), mc('Time-tracking tools?', ['Toggl, Clockify','Canva','Zoom','Trello only'], 0, 'Toggl/Clockify.'), mc('You will exceed your estimate. When do you tell the client?', ['After delivering late','As soon as you know, before exceeding it','Never','Next week'], 1, 'Early.'), mc('Delivery time should include…', ['Only the hour','Time + time zone','Day only','Nothing'], 1, 'Time zone.') ] } });

L({ id:'l11b', level:11, title:'Handling mistakes, delays & changing priorities', mins:55, skills:['ops','communication','priorities'], keywords:'mistake delay change priorities communicate late deadline',
  objectives:{ learn:['Communicate a delay the right way','Handle client corrections calmly','Re-plan when priorities change','Protect quality under pressure'], why:'Things go wrong in every job. Professionals are judged by how they handle it.', where:'Missed deadlines, outages, client feedback, urgent changes.', expect:'Early warning, honest reason, new plan, options.' },
  tutorial:[
    { h:'Delay message formula', b: `<ol class="steps"><li>Say it early, before the deadline.</li><li>What\'s done so far (numbers).</li><li>The reason, in one line — no long excuses.</li><li>New delivery time (with time zone).</li><li>An option: partial delivery now, or what you need from them.</li></ol>` },
    { h:'When the client says "this is wrong"', b: UL(['Thank them, don\'t argue.','Check it yourself — quickly.','If you made the error: own it, fix it, say how you\'ll prevent it.','If it\'s actually correct: explain kindly with evidence ("The total includes the Nov 30 invoice, row 41").']) },
    { h:'Changing priorities', b: UL(['Confirm the new order in writing ("So: report first, then the supplier list — correct?").','Say what will be delayed as a result.','Update your tracker/board immediately.']) },
    { h:'Have a backup plan', b: P('Power or internet outage? Mobile data hotspot, a backup location, and saving work in the cloud. Tell the client immediately if you\'ll be offline.') }
  ],
  demo:{ intro:'Internet is down at 1 PM; the 3 PM supplier list is 15/20 done.', steps:[
    { d:'Switch to mobile data; message the client right away.', w:'Early warning.' },
    { d:'"15 of 20 suppliers are done and saved in the shared sheet."', w:'Progress with numbers.' },
    { d:'"Our area internet is down; I\'m on mobile data, which is slow."', w:'One-line reason.' },
    { d:'"I\'ll finish the last 5 by 4:30 PM PHT. Want me to send the 15 now?"', w:'New time + option.' } ] },
  guided:{ act: quiz([ mc('Best time to tell a client a deadline will slip?', ['After it passes','As soon as you know','At the deadline','Never'], 1, 'Early.'), mc('Client says your total is wrong, but you checked and it\'s right. You…', ['Argue','Kindly show the evidence (which rows it includes)','Change it anyway','Ignore'], 1, 'Evidence, kindly.') ]), hints:['Earlier is always better.','Facts, not emotions.','Early; show evidence.'] },
  practical:{ act:{ type:'multi', parts:[
    { title:'Judgment calls', weight:1, act: quiz([
      mc('The client asks for the report 2 hours earlier than planned. You have other tasks due. First step?', ['Say yes and silently miss the others','Confirm which tasks can move, then commit to the new time','Refuse','Ignore'], 1, 'Re-plan openly.'),
      mc('You realize a sent invoice summary missed one invoice (₱8,400). The client hasn\'t noticed. You…', ['Hope they don\'t notice','Correct it and tell the client now','Fix it quietly in the next report','Blame the software'], 1, 'Own it immediately.', { crit:[0,2,3], critMsg:'Hid a known error from the client.' }),
      mc('Brownout expected tomorrow 1–5 PM in your area. You…', ['Wait and see','Tell the client today and plan backup power/data or adjusted hours','Take the day off','Say nothing'], 1, 'Plan and warn.'),
      mc('Two clients both send "urgent" tasks due at the same time. You…', ['Do the bigger client\'s only','Tell both what you can deliver when, and agree the order honestly','Do both badly','Ignore both'], 1, 'Transparent re-planning.')
    ]) },
    { title:'Write a delay notice', weight:1.5, act: wr({ title:'Delay notice', prompt:'It\'s 1:15 PM Manila. The supplier list for your client (due 3:00 PM PHT today) is 15 of 20 done. A power outage hit your area; you\'re on a laptop battery and mobile data. You can finish by 4:30 PM PHT. Write the message to the client.', minWords:40, maxWords:140, rubric:[ { auto:'greet' }, { id:'prog', label:'States progress (15 of 20)', all:[/15/, /20/] }, { id:'reason', label:'Brief reason (power outage)', any:[/(power|outage|brownout|electric)/i] }, { id:'new', label:'New time with zone (4:30 PM PHT)', any:[/4:30/] }, { id:'opt', label:'Offers an option (send the 15 now)', any:[/(send|share).*(now|current|15)/i, /now\?/i] }, { id:'short', label:'No long excuses (under ~140 words)', len:[20, 140] }, { auto:'close' } ], model:'Hi Sam,\n\nA quick heads-up on the supplier list: 15 of 20 suppliers are done and saved in the shared sheet. We\'ve just had a power outage in my area, so I\'m working on battery and mobile data.\n\nI\'ll finish the remaining 5 by 4:30 PM PHT (instead of 3:00 PM). Would you like me to send the 15 completed ones now?\n\nSorry for the change, and thanks for understanding.\n\nBest,\n[Your name]' }) } ] } },
  mastery:{ questions:[ mc('A delay message should include…', ['Long excuses','Progress, short reason, new time, option','Only an apology','Nothing'], 1, 'The formula.'), mc('Priorities changed. You confirm…', ['Nothing','The new order in writing and what will be delayed','Only verbally','Later'], 1, 'Written confirmation.'), mc('You find your own mistake after delivery. You…', ['Wait','Tell the client, fix it, explain prevention','Hide it','Blame others'], 1, 'Own it.', { crit:[0,2,3], critMsg:'Hid a mistake.' }), mc('Backup for internet outages?', ['None','Mobile hotspot / backup location, work saved in cloud','Stop working','Use neighbors\' Wi-Fi without asking'], 1, 'Prepared.'), mc('Client feedback "this is wrong" — first reaction?', ['Defend','Thank them and check','Ignore','Quit'], 1, 'Check calmly.') ] } });

L({ id:'l11c', level:11, title:'SOPs, documentation & quality checks before submission', mins:55, skills:['qa','ops'], keywords:'quality check qa sop documentation checklist submission proofreading',

/* ===== Research checker (shared) ===== */
function researchCheck(head, min, sheetName){ return async (m, seed, W) => { const sh = W.sheet(sheetName); if (!sh) return [chk(false, `Sheet named "${sheetName}" exists`, { crit:true })]; const hdr = W.header(sh); const rows = W.dataRows(sh); const items = []; const v = (r, c) => { const x = sh.ws[XL.addr(c, r)]; return x ? String(x.w ?? x.v).trim() : ''; };
  const ui = head.findIndex(h => /source url/i.test(h)), di = head.findIndex(h => /date checked/i.test(h));
  items.push(chk(head.every((h, i) => (hdr.cols[i] || '').toLowerCase() === h.toLowerCase()), 'Columns exactly as requested', { detail:'Found: ' + esc(hdr.cols.filter(Boolean).join(' | ')), tag:'research' }));
  items.push(chk(rows.length >= min, `At least ${min} rows (${rows.length} found)`, { tag:'research' }));
  const names = rows.map(r => v(r, 0).toLowerCase().replace(/[^a-z0-9]/g, '')); items.push(chk(!names.some((n, i) => n && names.indexOf(n) !== i), 'No duplicates', { tag:'research' }));
  const badU = rows.filter(r => !/^https?:\/\/[^\s/]+\.[^\s]+/i.test(v(r, ui))); items.push(chk(!badU.length, 'Every row has a Source URL (http/https)', { detail: badU.length + ' row(s) missing', tag:'research' }));
  const fake = rows.filter(r => /example\.(com|org)|lorem|test\.com/i.test(rows.length ? head.map((_, c) => v(r, c)).join(' ') : '')); items.push(chk(!fake.length, 'No placeholder or fake-looking data', { crit: fake.length > 0, tag:'research' }));
  const now = Date.now(); const badD = rows.filter(r => { const c = sh.ws[XL.addr(di, r)]; if (!c || typeof c.v !== 'number') return true; const ms = (c.v - 25569) * 864e5; return ms > now + 2 * 864e5 || ms < now - 45 * 864e5; }); items.push(chk(!badD.length, 'Date checked = real, recent dates', { detail: badD.length + ' row(s)', tag:'research' }));
  return items; }; }

/* run any activity with recording + report */
function runActivity(box, actIn, o){
  const act = resolve(actIn); let hintsUsed = 0; const seed = o.seed || newSeed();
  box.innerHTML = `${o.mode === 'guided' && o.hints ? hintBox(o.hints, n => hintsUsed = n) : ''}${o.limitSec ? `<div class="row" style="margin-bottom:10px"><span class="timer" data-lim></span><span class="mute" style="font-size:14px">Time limit ${Math.round(o.limitSec / 60)} min — finishing late counts as a fail for a timed test.</span></div>` : ''}<div data-eng></div>`;
  if (o.limitSec) startTimer($('[data-lim]', box), o.limitSec, () => toast('Time is up. Submit now — late submission fails a timed test.'));
  const eng = VA.engines[act.type]; if (!eng){ box.innerHTML = '<div class="note bad">Unknown activity.</div>'; return; }
  eng.render($('[data-eng]', box), act, { seed, mode: o.mode || 'practical', onResult: (res, out) => {
    if (o.limitSec && res.dur > o.limitSec * 1000) res.critical = (res.critical || []).concat(['Over the time limit: ' + Math.round(res.dur / 60000) + ' min used, limit ' + Math.round(o.limitSec / 60) + ' min']);
    const pass = o.key ? Progress.record(o.key, res, { label: o.label, kind: o.kind, ctx: o.ctx || 'lesson', skills: o.skills, route: o.route, hints: hintsUsed }) : (res.score >= PASS && !(res.critical || []).length);
    res.pass = pass; if (o.key) Outputs.set(o.key, res.output);
    const pfBtn = o.portfolio && pass ? `<div class="note ok"><b>Portfolio-ready</b>This passed. Save it as a training sample in your portfolio.<div style="margin-top:8px"><button class="btn sm pri" data-pf>Save to portfolio</button></div></div>` : '';
    out.innerHTML = renderReport(res, { title: o.title || 'Evaluation', retry: o.retryLabel === null ? null : (o.retryLabel || (pass ? 'Do it again (new variant)' : 'Try a similar exercise')), next: o.nextLabel, extra: pfBtn + (o.extra ? o.extra(res) : '') });
    out.addEventListener('click', e => { const r = e.target.closest('[data-r]'); if (r){ if (r.dataset.r === 'retry'){ if (o.onRetry) o.onRetry(); else runActivity(box, actIn, Object.assign({}, o, { seed: newSeed() })); box.scrollIntoView({ behavior:'smooth' }); } else if (o.onNext) o.onNext(); } if (e.target.closest('[data-pf]')) Portfolio.edit(Portfolio.draft(o.portfolio, o.key, res)); });
    if (o.onDone) o.onDone(res, pass);
    setTimeout(() => out.scrollIntoView({ behavior:'smooth', block:'start' }), 50);
  } });
}

/* ---------- PDF helper ---------- */
const PDF = {
  async make(name, lines, images=[]){
    try { const jsPDF = await Lib.load('jspdf'); const doc = new jsPDF({ unit:'pt', format:'a4' }); const W = 595, M = 50; let y = 60;
      const ensure = h => { if (y + h > 790){ doc.addPage(); y = 60; } };
      for (const [t, s] of lines){
        if (t === 'img'){ try { const props = doc.getImageProperties(s); const w = Math.min(W - 2 * M, props.width), h = w * props.height / props.width; ensure(Math.min(h, 400)); doc.addImage(s, props.fileType || 'PNG', M, y, w, Math.min(h, 400)); y += Math.min(h, 400) + 12; } catch(e){} continue; }
        const size = t === 'h' ? 20 : t === 'h2' ? 14 : 10.5; doc.setFont('helvetica', t === 'p' || t === 'pre' ? 'normal' : 'bold'); doc.setFontSize(size);
        const txt = String(s).replace(/[₱]/g, 'PHP ').replace(/[^\x00-\xFF•–—’“”]/g, ''); const wrapped = doc.splitTextToSize(txt, W - 2 * M);
        for (const ln of wrapped){ ensure(size * 1.4); doc.text(ln, M, y); y += size * 1.4; } y += t === 'h' ? 8 : t === 'h2' ? 4 : 2;
      }
      return DL.save(name, doc.output('blob'));
    } catch(e){ const html = '<!DOCTYPE html><meta charset="utf-8"><title>' + esc(name) + '</title><body style="font-family:Arial;max-width:760px;margin:40px auto;line-height:1.5">' + lines.map(([t, s]) => t === 'img' ? `<img src="${s}" style="max-width:100%">` : t === 'h' ? `<h1>${esc(s)}</h1>` : t === 'h2' ? `<h2>${esc(s)}</h2>` : `<p style="white-space:pre-wrap">${esc(s)}</p>`).join('') + '<p style="color:#666">Open this file and use Print › Save as PDF.</p></body>'; toast('PDF tool could not load — saving a printable HTML file instead.'); return DL.save(name.replace(/\.pdf$/, '.html'), html); }
  }
};

const Schedule = {
  DAYS:['mon','tue','wed','thu','fri','sat','sun'], NAMES:{ mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday', fri:'Friday', sat:'Saturday', sun:'Sunday' },
  generate(){ const av = S().settings.avail; const now = new Date(); const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7)); const queue = VA.lessons.filter(l => Progress.lessonState(l.id) !== 'passed'); const rem = {}; const weak = Weak.list(); let wi = 0;
    const plan = this.DAYS.map((d, i) => { const date = new Date(mon); date.setDate(mon.getDate() + i); let left = +av[d] || 0; const blocks = [];
      if (left >= 45){ blocks.push({ min:10, label:'Daily practice', href:'#resources-daily' }); left -= 10; }
      if (weak.length && i % 2 === 0 && left >= 30){ const w = weak[wi++ % weak.length]; blocks.push({ min:15, label:'Review: ' + w.label, href:'#drill-t-' + w.tag }); left -= 15; }
      while (left >= 20 && queue.length){ const l = queue[0]; const need = rem[l.id] ?? l.mins; const take = Math.min(need, left); blocks.push({ min: take, label: 'L' + l.level + ' · ' + l.title + (take < need ? ' (continue next session)' : ''), href:'#lesson-' + l.id }); rem[l.id] = need - take; left -= take; if (rem[l.id] <= 0) queue.shift(); else break; }
      if (left >= 15 && !queue.length) blocks.push({ min: left, label:'Workplace Simulator / Assessments', href:'#simulator' });
      return { day: d, date: isoD(date), blocks }; });
    S().schedule = { weekOf: isoD(mon), plan, at: Date.now() }; Store.save(); },
  today(){ const sc = S().schedule; const key = ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()];
    if (sc){ const p = sc.plan.find(x => x.day === key); if (p && p.blocks.length) return p.blocks; }
    const nl = nextLesson(); const out = []; if (nl) out.push({ min: nl.mins, label: 'L' + nl.level + ' · ' + nl.title, href:'#lesson-' + nl.id }); const w = Weak.list()[0]; if (w) out.push({ min:15, label:'Review: ' + w.label, href:'#drill-t-' + w.tag }); out.push({ min:10, label:'Daily practice', href:'#resources-daily' }); return out; }
};

   <div class="card"><h3>Study availability (minutes per day)</h3><p class="mute" style="font-size:14px">Used to build your weekly schedule. Suggested: 60–120 minutes a day.</p><div class="grid g4">${Schedule.DAYS.map(d => `<label class="f">${Schedule.NAMES[d]}<input type="number" min="0" max="600" step="15" data-av="${d}" value="${+av[d] || 0}"></label>`).join('')}</div><button class="btn" style="margin-top:12px" data-saveav>Save & rebuild schedule</button></div></div>
   <div class="grid g2" style="margin-top:16px"><div class="card"><h3>Saving</h3><p>${Store.mode === 'cloud' ? '<span class="tag ok">Saved to your account</span> Your progress follows you to any device where you open this academy.' : '<span class="tag warn">This device only</span> Progress is kept in this browser. ' + (Store.backend === 'firebase' ? 'Sign in below to save to your account.' : 'Open the academy from Claude, or set up account saving (Firebase) in your own copy, to save to an account.')}</p>${Store.backend === 'firebase' ? `<div class="row" style="margin-bottom:10px">${Fire.user ? `<span class="mute">Signed in as ${esc(Fire.user.email || '')}</span><button class="btn sm" data-fsout>Sign out</button>` : '<button class="btn sm pink" data-fsin>Sign in with Google to save to your account</button>'}</div>` : ''}<div class="row"><button class="btn" data-export>${icon('download')} Export backup (.json)</button><label class="btn">${icon('upload')} Import backup<input type="file" accept=".json" data-import hidden></label></div></div>
   <div class="card"><h3>Reset</h3><p class="mute">Clears all progress, scores, mistakes and schedule. Portfolio items are kept unless you delete them.</p><div class="row"><button class="btn" data-clearhist>Clear history only</button><button class="btn pink" data-reset>Reset all progress</button></div></div></div>`;
  view.addEventListener('click', async e => {
    if (e.target.closest('[data-fsin]')){ await Fire.signIn(); Router.go(); return; }
    if (e.target.closest('[data-fsout]')){ await Fire.signOut(); Router.go(); return; }
    if (e.target.closest('[data-save]')){ st.profile.name = $('[data-name]', view).value.trim(); st.settings.researchLocation = $('[data-loc]', view).value.trim() || 'Cebu City, Philippines'; st.settings.mentor = $('[data-mentor]', view).checked; Store.save(); toast('Saved.'); }
    if (e.target.closest('[data-saveav]')){ $$('[data-av]', view).forEach(i => av[i.dataset.av] = clamp(+i.value || 0, 0, 600)); Schedule.generate(); toast('Schedule rebuilt.'); }
    if (e.target.closest('[data-export]')) DL.save('va-academy-backup-' + todayISO() + '.json', JSON.stringify({ state: st, portfolio: Store.portfolio }, null, 1));
    if (e.target.closest('[data-clearhist]')){ if (await confirmBox('Clear history?', 'Removes the activity log only. Scores and progress stay.', 'Clear')){ st.history = []; Store.save(); toast('History cleared.'); } }
    if (e.target.closest('[data-reset]')){ if (await confirmBox('Reset all progress?', 'This cannot be undone. Export a backup first if you might want it.', 'Reset everything')){ const keepName = st.profile.name; Store.state = DEFAULT_STATE(); Store.state.profile.name = keepName; Store.save(); Store.flush(); toast('Progress reset.'); location.hash = '#dashboard'; Router.go(); } }
  });
  view.addEventListener('change', async e => { if (e.target.matches('[data-import]')){ const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(new TextDecoder().decode(await readBuf(f))); if (!j.state || !j.state.acts) throw 0; if (await confirmBox('Import backup?', 'This replaces your current progress with the backup.', 'Import')){ Store.state = Object.assign(DEFAULT_STATE(), j.state); Store.save(); Store.flush(); for (const p of (j.portfolio || [])) await Store.savePf(p); toast('Backup imported.'); Router.go(); } } catch(err){ toast('That file is not a VA Academy backup.'); } } });
};

/* ===== Boot ===== */
{
  Shell.render();
  Router.go();
  Clock.start();
  const before = S().updatedAt;
  Store.init().then(() => { if (S().updatedAt !== before) Router.go(); Shell.sync(); });
  AI.init();
  DL.init();
}

</script></body></html>
